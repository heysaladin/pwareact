<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Car Offers</title>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
  <style>
    html,body,#root{margin:0;padding:0;height:100%;overflow:hidden;background:#fff;}
    *{box-sizing:border-box;}
    button{cursor:pointer;font-family:inherit;}
    .scroll{scrollbar-width:none;overflow-y:auto;}
    .scroll::-webkit-scrollbar{display:none;}
    input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;outline:none;margin:0;padding:0;}
    input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:24px;height:24px;border-radius:50%;background:#0063F5;border:2.5px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,0.25);cursor:pointer;}
    input[type=range]::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:#0063F5;border:2.5px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,0.25);cursor:pointer;}
  </style>
</head>
<body>
<div id="root" style="height:100%"></div>
<script type="text/babel">
  const { useState, useEffect, useRef } = React;
  const C = { brand600:'#0063F5', brand700:'#004FC6', brand300:'#BBD5FB', yellow:'#FFDD33', gray900:'#121A26', gray700:'#364152', gray600:'#4B5565', gray500:'#697586', gray400:'#9AA4B2', gray200:'#E3E8EF', gray100:'#EEF1F6', gray50:'#F8FAFC', white:'#FFFFFF', black:'#000' };
  const nav = (p) => (window.top||window).location.href = p;

  const SAR = ({ size=14, color='currentColor' }) => (
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1124.14 1256.39" fill={color} style={{width:size,height:size,flexShrink:0}}>
      <path d="M699.62,1113.02h0c-20.06,44.48-33.32,92.75-38.4,143.37l424.51-90.24c20.06-44.47,33.31-92.75,38.4-143.37l-424.51,90.24Z"/>
      <path d="M1085.73,895.8c20.06-44.47,33.32-92.75,38.4-143.37l-330.68,70.33v-135.2l292.27-62.11c20.06-44.47,33.32-92.75,38.4-143.37l-330.68,70.27V66.13c-50.67,28.45-95.67,66.32-132.25,110.99v403.35l-132.25,28.11V0c-50.67,28.44-95.67,66.32-132.25,110.99v525.69l-295.91,62.88c-20.06,44.47-33.33,92.75-38.42,143.37l334.33-71.05v170.26l-358.3,76.14c-20.06,44.47-33.32,92.75-38.4,143.37l375.04-79.7c30.53-6.35,56.77-24.4,73.83-49.24l68.78-101.97v-.02c7.14-10.55,11.3-23.27,11.3-36.97v-149.98l132.25-28.11v270.4l424.53-90.28Z"/>
    </svg>
  );

  const cars = [
    { id:1, make:'Toyota',   model:'Camry',        year:2024, trim:'XLE 2.5L', isNew:true,  price:122000, monthly:1850, img:'/car-loan-assets/car-toyota-camry.png' },
    { id:2, make:'Hyundai',  model:'Elantra',      year:2024, trim:'1.6L',     isNew:true,  price:98000,  monthly:1490, img:'/car-loan-assets/car-hyundai-elantra.png' },
    { id:3, make:'Toyota',   model:'Hilux',        year:2024, trim:'2.8L 4x4', isNew:true,  price:165000, monthly:2450, img:'/car-loan-assets/car-toyota-hilux.png' },
    { id:4, make:'Hyundai',  model:'Accent',       year:2024, trim:'1.4L',     isNew:false, price:72000,  monthly:1100, img:'/car-loan-assets/car-hyundai-accent.png' },
    { id:5, make:'KIA',      model:'Pegas',        year:2024, trim:'1.4L',     isNew:false, price:68000,  monthly:1050, img:'/car-loan-assets/car-kia-pegas.png' },
    { id:6, make:'Toyota',   model:'Yaris',        year:2024, trim:'1.5L',     isNew:true,  price:78000,  monthly:1200, img:'/car-loan-assets/car-toyota-yaris.png' },
    { id:7, make:'Ford',     model:'Taurus',       year:2024, trim:'2.0L EcoBoost', isNew:true, price:135000, monthly:2000, img:'/car-loan-assets/car-ford-taurus.png' },
  ];

  function StatusBar() {
    return (
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'14px 20px 6px'}}>
        <span style={{fontSize:15,fontWeight:700,color:C.gray900}}>9:41</span>
        <div style={{display:'flex',gap:6,alignItems:'center'}}>
          <svg width="17" height="11" viewBox="0 0 17 11" fill={C.gray900}><rect x="0" y="5" width="3" height="6" rx="0.5" opacity="0.4"/><rect x="4.5" y="3" width="3" height="8" rx="0.5" opacity="0.6"/><rect x="9" y="1.5" width="3" height="9.5" rx="0.5" opacity="0.8"/><rect x="13.5" y="0" width="3" height="11" rx="0.5"/></svg>
          <svg width="16" height="11" viewBox="0 0 16 11" fill={C.gray900} opacity="0.7"><path d="M8 8c.9 0 1.6.7 1.6 1.6S8.9 11.2 8 11.2 6.4 10.5 6.4 9.6 7.1 8 8 8z"/><path d="M4.6 5.4C5.6 4.3 6.7 3.7 8 3.7s2.4.6 3.4 1.7l1.3-1.3C11.2 2.6 9.7 2 8 2S4.8 2.6 3.3 4.1l1.3 1.3z" opacity="0.75"/><path d="M1.6 2.5C3.1 1 5.4 0 8 0s4.9 1 6.4 2.5L16 1C14 .4 11.2 0 8 0S2 .4 0 1l1.6 1.5z" opacity="0.5"/></svg>
          <div style={{display:'flex',alignItems:'center',gap:2}}><div style={{width:22,height:11,border:'1.5px solid rgba(0,0,0,0.35)',borderRadius:3,padding:1.5}}><div style={{background:C.gray900,borderRadius:1.5,height:'100%',width:'72%'}}/></div></div>
        </div>
      </div>
    );
  }

  function CarCard({ car }) {
    const [liked, setLiked] = useState(false);
    return (
      <div style={{background:C.white,border:`1px solid ${C.gray100}`,borderRadius:16,overflow:'hidden',boxShadow:'0 1px 2px rgba(10,13,18,0.05)',width:'100%'}}>
        <div style={{height:200,background:C.white,display:'flex',alignItems:'center',justifyContent:'center',overflow:'hidden'}}>
          <img src={car.img} alt={car.model} style={{width:'100%',height:'100%',objectFit:'contain',objectPosition:'center'}}/>
        </div>
        <div style={{display:'flex',alignItems:'center',gap:12,padding:'4px 12px',borderBottom:`1px solid ${C.gray200}`,minHeight:60}}>
          <div style={{flex:1,paddingLeft:6,minWidth:0}}>
            <p style={{margin:'0 0 2px',fontSize:17.5,fontWeight:700,color:C.gray900,letterSpacing:0.1,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>
              {car.make} {car.model} {car.year}
            </p>
            <div style={{display:'flex',alignItems:'center',gap:4,color:C.gray600}}>
              <span style={{fontSize:13.5,fontWeight:500,letterSpacing:0.4}}>{car.trim}</span>
              <span style={{fontSize:10,fontWeight:500,letterSpacing:0.5}}>·</span>
              <span style={{fontSize:13.5,fontWeight:500,letterSpacing:0.4}}>{car.isNew?'NEW':'USED'}</span>
              <span style={{fontSize:10,fontWeight:500,letterSpacing:0.5}}>·</span>
              <SAR size={12}/><span style={{fontSize:13.5,fontWeight:500,letterSpacing:0}}>{car.price.toLocaleString('en-US')}</span>
            </div>
          </div>
          <button onClick={()=>nav('/car-loan/car-details')} style={{background:'none',border:'none',padding:'8px 4px 8px 16px',margin:'-8px -4px -8px 0',display:'flex',alignItems:'center',flexShrink:0}}>
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M9 18l6-6-6-6" stroke={C.gray900} strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/></svg>
          </button>
        </div>
        <div style={{display:'flex',alignItems:'center',gap:12,padding:'4px 12px',minHeight:68}}>
          <div style={{flex:1,minWidth:0}}>
            <p style={{margin:'0 0 2px',fontSize:0,color:C.gray600}}>
              <span style={{fontSize:13.5,fontWeight:500,letterSpacing:0.4}}>Installment </span>
              <span style={{fontSize:10,fontWeight:500,letterSpacing:0.5}}>from</span>
            </p>
            <div style={{display:'flex',alignItems:'center',gap:2}}>
              <SAR size={15}/><span style={{fontSize:17.5,fontWeight:700,color:C.gray900,letterSpacing:0,whiteSpace:'nowrap'}}>{car.monthly.toLocaleString('en-US')}.00</span>
              <span style={{fontSize:10,fontWeight:500,color:C.gray600,letterSpacing:0.5,marginLeft:2}}>/month</span>
            </div>
          </div>
          <button onClick={()=>setLiked(!liked)} style={{background:'none',border:'none',padding:4,display:'flex',flexShrink:0}}>
            <svg width="24" height="24" viewBox="0 0 24 24" fill={liked?'#EF4444':'none'} xmlns="http://www.w3.org/2000/svg">
              <path d="M16.1111 3C19.6333 3 22 6.3525 22 9.48C22 15.8138 12.1778 21 12 21C11.8222 21 2 15.8138 2 9.48C2 6.3525 4.36667 3 7.88889 3C9.91111 3 11.2333 4.02375 12 4.92375C12.7667 4.02375 14.0889 3 16.1111 3Z" stroke={liked?'#EF4444':'#4B5565'} strokeWidth="1.66667" strokeLinecap="round" strokeLinejoin="round"/>
            </svg>
          </button>
          <button onClick={()=>nav('/car-loan/offers')} style={{background:C.brand600,border:'2px solid rgba(255,255,255,0.12)',borderRadius:8,padding:'8px 12px',fontSize:13.5,fontWeight:600,color:C.white,letterSpacing:0.5,minHeight:36,minWidth:90,flexShrink:0}}>
            See offers
          </button>
        </div>
      </div>
    );
  }

  function FindLoanExpanded({ onClose }) {
    const [salary, setSalary] = useState('12,000');
    const [hasLoans, setHasLoans] = useState(false);
    return (
      <div style={{background:C.white,padding:'12px 24px 20px',borderTop:`1px solid ${C.gray100}`}}>
        <div style={{marginBottom:16}}>
          <label style={{display:'block',fontSize:12.5,color:C.gray600,marginBottom:6}}>Salary <span style={{color:'#E53935'}}>*</span></label>
          <div style={{background:'#F8FAFC',border:'1.5px solid #E2E8F0',borderRadius:12,padding:'12px 14px',display:'flex',alignItems:'center',gap:8}}>
            <SAR size={16}/>
            <input type="text" placeholder="0" value={salary} onChange={e=>{const raw=e.target.value.replace(/[^0-9]/g,'');const n=parseInt(raw||'0',10);setSalary(n?n.toLocaleString('en-US'):'');}} style={{flex:1,border:'none',background:'transparent',fontSize:16,fontWeight:600,color:C.gray900,fontFamily:'inherit',outline:'none'}}/>
            <span style={{fontSize:13,color:C.gray600,flexShrink:0}}>Monthly</span>
          </div>
        </div>
        <div style={{marginBottom:16}}>
          <label style={{display:'block',fontSize:12.5,color:C.gray600,marginBottom:10}}>Do you have active loans? <span style={{color:'#E53935'}}>*</span></label>
          <div style={{display:'flex',gap:10}}>
            {[{l:'Yes',v:true},{l:'No',v:false}].map(o=>(
              <button key={o.l} onClick={()=>setHasLoans(o.v)} style={{flex:1,padding:11,fontSize:14,fontWeight:hasLoans===o.v?600:400,border:`1.5px solid ${hasLoans===o.v?C.brand600:'#E2E8F0'}`,borderRadius:10,background:hasLoans===o.v?'#EBF3FF':C.white,color:hasLoans===o.v?C.brand600:C.gray600,fontFamily:'inherit'}}>{o.l}</button>
            ))}
          </div>
        </div>
        <div style={{backgroundImage:'url(/bg-yellow.png)',backgroundSize:'cover',backgroundPosition:'left center',borderRadius:16,padding:'16px 18px 16px 140px',marginBottom:16,minHeight:88,display:'flex',flexDirection:'column',justifyContent:'center',position:'relative'}}>
          <img src="/car-loan-assets/icon-loan-type.svg" alt="" style={{position:'absolute',left:12,top:'50%',transform:'translateY(-50%)',width:110,pointerEvents:'none'}}/>
          <p style={{margin:'0 0 4px',fontSize:12,color:'#5C4200',fontWeight:500}}>You may be eligible to take a loan up to</p>
          <div style={{display:'flex',alignItems:'center',gap:5,marginBottom:4}}><SAR size={20}/><span style={{fontSize:26,fontWeight:700,color:C.gray900}}>183,552</span></div>
          <p style={{margin:0,fontSize:12,color:'#5C4200'}}>for <strong>60 Months</strong></p>
        </div>
        <button onClick={onClose} style={{width:'100%',background:C.brand600,border:'none',borderRadius:14,padding:16,fontSize:16,fontWeight:600,color:C.white,fontFamily:'inherit'}}>Update</button>
      </div>
    );
  }

  function Tag({ label, selected, onToggle }) {
    return (
      <button onClick={onToggle} style={{
        background: selected ? '#EBF3FF' : C.white,
        border: `1px solid ${selected ? C.brand600 : C.gray200}`,
        borderRadius: 32, padding: '4px 12px', minHeight: 32,
        display: 'flex', alignItems: 'center', justifyContent: 'center',
        fontSize: 13.5, fontWeight: 600, color: selected ? C.brand600 : C.gray700,
        whiteSpace: 'nowrap', flexShrink: 0,
      }}>
        {label}
      </button>
    );
  }

  function toggleTag(arr, setArr, val) {
    if (arr.includes(val)) setArr(arr.filter(v => v !== val));
    else setArr([...arr, val]);
  }

  function DualRangeSlider({ min, max, step, valueMin, valueMax, onChangeMin, onChangeMax }) {
    const pct1 = ((valueMin - min) / (max - min)) * 100;
    const pct2 = ((valueMax - min) / (max - min)) * 100;
    return (
      <div style={{ position: 'relative', paddingBottom: 24 }}>
        <div style={{ position: 'relative', height: 6, borderRadius: 999, background: C.gray200, margin: '12px 0 8px' }}>
          <div style={{ position: 'absolute', left: `${pct1}%`, width: `${pct2 - pct1}%`, height: '100%', background: C.brand600, borderRadius: 999 }} />
        </div>
        <input type="range" min={min} max={max} step={step} value={valueMin}
          onChange={e => { const v = +e.target.value; if (v < valueMax - step) onChangeMin(v); }}
          style={{ position: 'absolute', top: 5, left: 0, width: '100%', height: 28, opacity: 0, cursor: 'pointer', zIndex: valueMin > max * 0.9 ? 5 : 3 }} />
        <input type="range" min={min} max={max} step={step} value={valueMax}
          onChange={e => { const v = +e.target.value; if (v > valueMin + step) onChangeMax(v); }}
          style={{ position: 'absolute', top: 5, left: 0, width: '100%', height: 28, opacity: 0, cursor: 'pointer', zIndex: 4 }} />
        <div style={{ position: 'relative', height: 20 }}>
          <div style={{ position: 'absolute', left: `${pct1}%`, transform: 'translateX(-50%)', display: 'flex', alignItems: 'baseline', gap: 1, color: C.brand700, fontSize: 13.5, fontWeight: 500, whiteSpace: 'nowrap' }}>
            <SAR size={10} color={C.brand700} /><span>{valueMin.toLocaleString('en-US')}</span>
          </div>
          <div style={{ position: 'absolute', left: `${pct2}%`, transform: 'translateX(-50%)', display: 'flex', alignItems: 'baseline', gap: 1, color: C.brand700, fontSize: 13.5, fontWeight: 500, whiteSpace: 'nowrap' }}>
            <SAR size={10} color={C.brand700} /><span>{valueMax.toLocaleString('en-US')}</span>
          </div>
        </div>
      </div>
    );
  }

  function SheetOverlay({ children, onDismiss }) {
    const [visible, setVisible] = useState(false);
    useEffect(() => { requestAnimationFrame(() => setVisible(true)); }, []);
    const dismiss = () => { setVisible(false); setTimeout(onDismiss, 280); };
    return (
      <div onClick={dismiss} style={{ position: 'fixed', inset: 0, background: 'rgba(13,19,28,0.5)', zIndex: 200, display: 'flex', flexDirection: 'column', justifyContent: 'flex-end' }}>
        <div onClick={e => e.stopPropagation()} style={{
          background: C.white, borderRadius: '32px 32px 0 0', display: 'flex', flexDirection: 'column',
          transform: visible ? 'translateY(0)' : 'translateY(100%)',
          transition: 'transform 0.28s cubic-bezier(0.4,0,0.2,1)',
        }}>
          {children(dismiss)}
        </div>
      </div>
    );
  }

  const DragHandle = () => (
    <div style={{ display: 'flex', justifyContent: 'center', padding: '12px 12px 24px', flexShrink: 0 }}>
      <div style={{ width: 48, height: 4, background: C.gray400, borderRadius: 999 }} />
    </div>
  );

  const HomeBar = () => (
    <div style={{ background: C.white, height: 34, display: 'flex', alignItems: 'flex-end', justifyContent: 'center', paddingBottom: 8, flexShrink: 0 }}>
      <div style={{ width: 135, height: 5, background: C.black, borderRadius: 999 }} />
    </div>
  );

  function FilterSheet({ onClose, onApply }) {
    const [carStatus, setCarStatus] = useState([]);
    const [carType, setCarType] = useState([]);
    const [motorType, setMotorType] = useState([]);
    const [brand, setBrand] = useState([]);
    const [priceMin, setPriceMin] = useState(20000);
    const [priceMax, setPriceMax] = useState(120000);
    const [likeStatus, setLikeStatus] = useState([]);

    const reset = () => { setCarStatus([]); setCarType([]); setMotorType([]); setBrand([]); setPriceMin(20000); setPriceMax(120000); setLikeStatus([]); };
    const Divider = () => <div style={{ height: 1, background: C.gray200, width: '100%', flexShrink: 0 }} />;

    return (
      <SheetOverlay onDismiss={onClose}>
        {(dismiss) => (
          <>
            <DragHandle />
            <div className="scroll" style={{ padding: '0 24px', overflowY: 'auto', display: 'flex', flexDirection: 'column', gap: 20, maxHeight: '60vh' }}>
              <p style={{ margin: 0, fontSize: 17.5, fontWeight: 700, color: C.gray900, textAlign: 'center', letterSpacing: 0.1 }}>Car filter</p>

              <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
                <p style={{ margin: 0, fontSize: 13.5, fontWeight: 500, color: C.gray500, letterSpacing: 0.4 }}>Car Status</p>
                <div style={{ display: 'flex', gap: 8 }}>
                  {['New Car', 'Used Car'].map(v => <Tag key={v} label={v} selected={carStatus.includes(v)} onToggle={() => toggleTag(carStatus, setCarStatus, v)} />)}
                </div>
              </div>

              <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
                <p style={{ margin: 0, fontSize: 13.5, fontWeight: 500, color: C.gray500, letterSpacing: 0.4 }}>Car Type</p>
                <div style={{ display: 'flex', flexWrap: 'wrap', gap: 8 }}>
                  {['Sedan', 'Hatchback', 'SUV', 'Pickup', 'Crossover', 'MPV', 'Coupe & Convertible'].map(v => <Tag key={v} label={v} selected={carType.includes(v)} onToggle={() => toggleTag(carType, setCarType, v)} />)}
                </div>
              </div>

              <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
                <p style={{ margin: 0, fontSize: 13.5, fontWeight: 500, color: C.gray500, letterSpacing: 0.4 }}>Motor Type</p>
                <div style={{ display: 'flex', flexWrap: 'wrap', gap: 8 }}>
                  {['Gasoline', 'Diesel', 'EV', 'Hybrid', 'Hydrogen'].map(v => <Tag key={v} label={v} selected={motorType.includes(v)} onToggle={() => toggleTag(motorType, setMotorType, v)} />)}
                </div>
              </div>

              <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
                <p style={{ margin: 0, fontSize: 13.5, fontWeight: 500, color: C.gray500, letterSpacing: 0.4 }}>Brand</p>
                <div style={{ display: 'flex', flexWrap: 'wrap', gap: 8 }}>
                  {['Toyota', 'Ford', 'CEER', 'Lucid', 'Tesla'].map(v => <Tag key={v} label={v} selected={brand.includes(v)} onToggle={() => toggleTag(brand, setBrand, v)} />)}
                </div>
              </div>

              <Divider />

              <div style={{ display: 'flex', flexDirection: 'column', gap: 4 }}>
                <p style={{ margin: 0, fontSize: 13.5, fontWeight: 500, color: C.gray500, letterSpacing: 0.4 }}>Car Price</p>
                <DualRangeSlider min={0} max={200000} step={1000} valueMin={priceMin} valueMax={priceMax} onChangeMin={setPriceMin} onChangeMax={setPriceMax} />
              </div>

              <Divider />

              <p style={{ margin: 0, fontSize: 15.5, fontWeight: 600, color: C.gray500, letterSpacing: 0.25 }}>PREFERENCES</p>

              <div style={{ display: 'flex', flexDirection: 'column', gap: 8, paddingBottom: 8 }}>
                <p style={{ margin: 0, fontSize: 13.5, fontWeight: 500, color: C.gray500, letterSpacing: 0.4 }}>Like Status</p>
                <div style={{ display: 'flex', gap: 8 }}>
                  {['Liked', 'Unliked'].map(v => <Tag key={v} label={v} selected={likeStatus.includes(v)} onToggle={() => toggleTag(likeStatus, setLikeStatus, v)} />)}
                </div>
              </div>
            </div>

            <div style={{ padding: '12px 24px 8px' }}>
              <div style={{ display: 'flex', gap: 8 }}>
                <button onClick={reset} style={{ flex: 1, background: C.white, border: `1px solid ${C.gray200}`, borderRadius: 8, padding: '12px 16px', fontSize: 13.5, fontWeight: 600, color: C.gray600, letterSpacing: 0.5, minHeight: 46 }}>Reset</button>
                <button onClick={() => { dismiss(); onApply({ carStatus, carType, motorType, brand, priceMin, priceMax, likeStatus }); }} style={{ flex: 1, background: C.brand600, border: '2px solid rgba(255,255,255,0.12)', borderRadius: 8, padding: '12px 16px', fontSize: 13.5, fontWeight: 600, color: C.white, letterSpacing: 0.5, minHeight: 46 }}>Apply</button>
              </div>
            </div>
            <HomeBar />
          </>
        )}
      </SheetOverlay>
    );
  }

  function SortSheet({ onClose, onApply, initialSel }) {
    const [sel, setSel] = useState(initialSel || { newest: 'asc', price: null, year: null, popularity: null });
    const pick = (key, dir) => setSel(s => ({ ...s, [key]: s[key] === dir ? null : dir }));
    const iconBtn = (active) => ({ border: `1px solid ${active ? C.brand300 : C.gray100}`, borderRadius: 8, padding: 8, display: 'flex', alignItems: 'center', justifyContent: 'center', background: C.white, flexShrink: 0 });
    const rows = [
      { key: 'newest',     label: 'Newest listing', minSrc: '/sort-icon-newest-desc.svg',  maxSrc: '/sort-icon-newest-asc.svg',  maxRot: true },
      { key: 'price',      label: 'Price',           minSrc: '/sort-icon-price-desc.svg',   maxSrc: '/sort-icon-price-asc.svg',   maxRot: false },
      { key: 'year',       label: 'Year',            minSrc: '/sort-icon-year-desc.svg',    maxSrc: '/sort-icon-year-asc.svg',    maxRot: false },
      { key: 'popularity', label: 'Popularity',      minSrc: '/sort-icon-pop-desc.svg',     maxSrc: '/sort-icon-pop-asc.svg',     maxRot: false },
    ];
    return (
      <SheetOverlay onDismiss={onClose}>
        {(dismiss) => (
          <>
            <DragHandle />
            <div style={{ padding: '0 24px 6px', display: 'flex', flexDirection: 'column', gap: 24 }}>
              <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
                <p style={{ margin: 0, fontSize: 23.5, fontWeight: 600, color: C.gray900 }}>Sort</p>
                <button onClick={dismiss} style={{ border: `1px solid ${C.gray100}`, borderRadius: 24, padding: 6, background: C.white, display: 'flex' }}>
                  <img src="/sort-close-icon.svg" width={18} height={18} style={{ transform: 'rotate(45deg)' }} alt="close" />
                </button>
              </div>
              <div style={{ display: 'flex', flexDirection: 'column' }}>
                <div style={{ display: 'flex', gap: 16, justifyContent: 'flex-end', marginBottom: 0 }}>
                  <div style={{ width: 40, textAlign: 'center' }}><span style={{ fontSize: 12.5, fontWeight: 500, color: C.gray500, letterSpacing: 0.5 }}>Min.</span></div>
                  <div style={{ width: 40, textAlign: 'center' }}><span style={{ fontSize: 12.5, fontWeight: 500, color: C.gray500, letterSpacing: 0.5 }}>Max.</span></div>
                </div>
                {rows.map(r => (
                  <div key={r.key} style={{ display: 'flex', gap: 16, alignItems: 'center', padding: '8px 0' }}>
                    <p style={{ flex: 1, margin: 0, fontSize: 15.5, fontWeight: 500, color: C.gray600, letterSpacing: 0.1 }}>{r.label}</p>
                    <button onClick={() => pick(r.key, 'asc')} style={iconBtn(sel[r.key] === 'asc')}><img src={r.minSrc} width={24} height={24} alt="" /></button>
                    <button onClick={() => pick(r.key, 'desc')} style={iconBtn(sel[r.key] === 'desc')}><img src={r.maxSrc} width={24} height={24} style={r.maxRot ? { transform: 'rotate(180deg)' } : {}} alt="" /></button>
                  </div>
                ))}
              </div>
            </div>
            <div style={{ padding: '12px 24px 8px' }}>
              <button onClick={() => { dismiss(); onApply(sel); }} style={{ width: '100%', background: C.brand600, border: '2px solid rgba(255,255,255,0.12)', borderRadius: 10, padding: '16px 20px', fontSize: 17.5, fontWeight: 700, color: C.white, letterSpacing: 0.1, minHeight: 58 }}>Apply</button>
            </div>
            <HomeBar />
          </>
        )}
      </SheetOverlay>
    );
  }

  const DEALERS = [
    { id: 'almajdouie', name: 'Almajdouie Dealer', logo: '/dealer-almajdouie.png' },
    { id: 'wallan',     name: 'Wallan Dealer',     logo: '/dealer-wallan.png' },
  ];

  function DealerSheet({ onClose, onSelect }) {
    return (
      <SheetOverlay onDismiss={onClose}>
        {(dismiss) => (
          <>
            <DragHandle />
            <div style={{ padding: '0 24px 8px', display: 'flex', flexDirection: 'column', gap: 8 }}>
              <p style={{ margin: '0 0 8px', fontSize: 17.5, fontWeight: 700, color: C.gray900, textAlign: 'center' }}>Select Dealer</p>
              {DEALERS.map(d => (
                <button key={d.id} onClick={() => { dismiss(); onSelect(d); }} style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '12px 16px', border: `1px solid ${C.gray100}`, borderRadius: 12, background: C.white }}>
                  <span style={{ fontSize: 15.5, fontWeight: 600, color: C.gray900 }}>{d.name}</span>
                  <img src={d.logo} alt={d.name} style={{ height: 36, objectFit: 'contain' }} />
                </button>
              ))}
            </div>
            <HomeBar />
          </>
        )}
      </SheetOverlay>
    );
  }

  function App() {
    const [expanded, setExpanded] = useState(false);
    const [filterOpen, setFilterOpen] = useState(false);
    const [sortOpen, setSortOpen] = useState(false);
    const [activeFilters, setActiveFilters] = useState(null);
    const [sortSel, setSortSel] = useState({ newest: 'asc', price: null, year: null, popularity: null });

    const dealers = {
      wallan:     { id:'wallan',     name:'Al Wallan Dealer',  logo:'/dealer-wallan.png' },
      almajdouie: { id:'almajdouie', name:'Almajdouie Dealer', logo:'/dealer-almajdouie.png' },
    };
    const dealerId = (window.top||window).location.pathname.split('/').filter(Boolean).pop();
    const selectedDealer = dealers[dealerId] || null;

    const activeFilterCount = activeFilters
      ? activeFilters.carStatus.length + activeFilters.carType.length + activeFilters.motorType.length + activeFilters.brand.length + activeFilters.likeStatus.length + (activeFilters.priceMin !== 20000 || activeFilters.priceMax !== 120000 ? 1 : 0)
      : 0;
    const activeSortCount = Object.values(sortSel).filter(Boolean).length;

    return (
      <div style={{height:'100%',display:'flex',flexDirection:'column',background:C.gray50,fontFamily:'"SF Arabic",system-ui,-apple-system,Arial,sans-serif',position:'relative'}}>

        <div style={{background:C.white,flexShrink:0}}>
          <StatusBar/>
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'4px 16px 10px'}}>
            <button onClick={()=>nav('/car-loan')} style={{background:'none',border:'none',padding:'8px 4px',minWidth:48,display:'flex',alignItems:'center'}}>
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M15 19L8 12l7-7" stroke={C.gray900} strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round"/></svg>
            </button>
            <span style={{fontSize:15.5,fontWeight:600,color:'#202A39',letterSpacing:0.25}}>Car offers</span>
            <div style={{minWidth:48}}/>
          </div>
        </div>

        <div style={{background:C.white,flexShrink:0}}>
          <div style={{padding:'8px 24px'}}>
            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}>
              <span style={{fontSize:15.5,fontWeight:700,color:C.gray900,letterSpacing:0.1}}>Find your car</span>
              <button onClick={()=>setExpanded(e=>!e)} style={{display:'flex',alignItems:'center',gap:10,background:'none',border:'none',padding:0}}>
                <span style={{fontSize:12.5,fontWeight:500,color:C.gray600,letterSpacing:0.5}}>Change</span>
                <div style={{border:`1px solid ${C.gray200}`,borderRadius:34,padding:8,display:'flex',alignItems:'center',justifyContent:'center'}}>
                  <svg width="16" height="16" viewBox="0 0 16 16" fill="none" style={{transform:expanded?'rotate(180deg)':'rotate(0deg)',transition:'transform 0.2s'}}>
                    <path d="M4 6l4 4 4-4" stroke={C.gray600} strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round"/>
                  </svg>
                </div>
              </button>
            </div>
          </div>
          {expanded && <FindLoanExpanded onClose={()=>setExpanded(false)}/>}
        </div>

        {selectedDealer && (
          <div style={{background:C.white,padding:'10px 24px',borderBottom:`1px solid ${C.gray100}`,flexShrink:0,display:'flex',alignItems:'center',gap:16}}>
            <div style={{flex:1}}>
              <p style={{margin:'0 0 2px',fontSize:13.5,fontWeight:500,color:C.gray600,letterSpacing:0.4}}>Car in dealer</p>
              <p style={{margin:0,fontSize:15.5,fontWeight:700,color:C.gray900,letterSpacing:0.1}}>{selectedDealer.name}</p>
            </div>
            <img src={selectedDealer.logo} alt={selectedDealer.name} style={{height:48,objectFit:'contain',flexShrink:0}}/>
            <button onClick={()=>setSelectedDealer(null)} style={{background:'none',border:'none',padding:4,display:'flex',alignItems:'center',flexShrink:0}}>
              <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M15 5L5 15M5 5l10 10" stroke={C.gray400} strokeWidth="1.5" strokeLinecap="round"/></svg>
            </button>
          </div>
        )}

        <div className="scroll" style={{flex:1,padding:'24px'}}>

          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:24}}>
            <p style={{margin:0,fontSize:13.5,fontWeight:500,color:'#98A2B3',letterSpacing:0.4}}>
              You may be eligible for{' '}
              <span style={{color:'#1D2939',fontWeight:500}}>{cars.length} Cars</span>
            </p>
            <div style={{display:'flex',gap:24,alignItems:'center'}}>
              <button onClick={() => setFilterOpen(true)} style={{ background: 'none', border: 'none', padding: 0, position: 'relative', display: 'flex' }}>
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M13.5 15.75L17.25 19.5L21 15.75" stroke="#697586" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
                  <path d="M17.25 10.5V19.5" stroke="#697586" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
                  <path d="M4.5 12H11.25" stroke="#697586" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
                  <path d="M4.5 6H17.25" stroke="#697586" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
                  <path d="M4.5 18H9.75" stroke="#697586" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
                </svg>
                {activeFilterCount > 0 && <div style={{ position: 'absolute', top: -4, right: -4, width: 14, height: 14, background: C.brand600, borderRadius: '50%', display: 'flex', alignItems: 'center', justifyContent: 'center' }}><span style={{ fontSize: 9, fontWeight: 700, color: C.white, lineHeight: 1 }}>{activeFilterCount}</span></div>}
              </button>
              <button onClick={() => setSortOpen(true)} style={{ background: 'none', border: 'none', padding: 0, position: 'relative', display: 'flex' }}>
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M3.94507 4.5H20.0513C20.1968 4.50005 20.3391 4.5424 20.461 4.62191C20.5828 4.70141 20.6789 4.81463 20.7375 4.94777C20.7961 5.08092 20.8148 5.22824 20.7911 5.37179C20.7675 5.51533 20.7026 5.64891 20.6045 5.75625L14.4451 12.5344C14.3169 12.6716 14.2464 12.8529 14.2482 13.0406V18.3469C14.2493 18.4715 14.219 18.5944 14.16 18.7042C14.101 18.814 14.0153 18.9072 13.9107 18.975L10.9107 20.9719C10.7982 21.046 10.6677 21.0884 10.5331 21.0947C10.3985 21.101 10.2647 21.0709 10.1458 21.0076C10.0268 20.9443 9.92713 20.8501 9.85717 20.7349C9.78721 20.6198 9.74956 20.4879 9.7482 20.3531V13.0406C9.75001 12.8529 9.67952 12.6716 9.55132 12.5344L3.39195 5.75625C3.29375 5.64891 3.22889 5.51533 3.20527 5.37179C3.18164 5.22824 3.20028 5.08092 3.2589 4.94777C3.31753 4.81463 3.41361 4.70141 3.53544 4.62191C3.65727 4.5424 3.7996 4.50005 3.94507 4.5Z" stroke="#697586" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
                </svg>
                {activeSortCount > 0 && <div style={{ position: 'absolute', top: -4, right: -4, width: 14, height: 14, background: C.brand600, borderRadius: '50%', display: 'flex', alignItems: 'center', justifyContent: 'center' }}><span style={{ fontSize: 9, fontWeight: 700, color: C.white, lineHeight: 1 }}>{activeSortCount}</span></div>}
              </button>
            </div>
          </div>

          <div style={{display:'flex',flexDirection:'column',gap:16}}>
            {cars.map(car => <CarCard key={car.id} car={car}/>)}
          </div>
        </div>

        <div style={{background:C.white,height:34,display:'flex',alignItems:'flex-end',justifyContent:'center',paddingBottom:8,flexShrink:0}}>
          <div style={{width:135,height:5,background:'#000',borderRadius:999}}/>
        </div>

        {filterOpen && <FilterSheet onClose={() => setFilterOpen(false)} onApply={(f) => setActiveFilters(f)} />}
        {sortOpen && <SortSheet initialSel={sortSel} onClose={() => setSortOpen(false)} onApply={(s) => setSortSel(s)} />}

      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
