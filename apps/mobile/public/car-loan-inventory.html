<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Car Offers</title>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
  <style>
    html,body,#root{margin:0;padding:0;height:100%;overflow:hidden;background:#fff;}
    *{box-sizing:border-box;}
    button{cursor:pointer;font-family:inherit;}
    .scroll{scrollbar-width:none;overflow-y:auto;}
    .scroll::-webkit-scrollbar{display:none;}
    input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;outline:none;margin:0;padding:0;}
    input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:24px;height:24px;border-radius:50%;background:#0063F5;border:2.5px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,0.25);cursor:pointer;}
    input[type=range]::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:#0063F5;border:2.5px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,0.25);cursor:pointer;}
    @keyframes shimmer{0%{background-position:-800px 0}100%{background-position:800px 0}}
    .shimmer{background:linear-gradient(90deg,#E3E8EF 25%,#EEF1F6 50%,#E3E8EF 75%);background-size:800px 100%;animation:shimmer 1.4s infinite linear;}
    @keyframes ripple-out{0%{transform:scale(0);opacity:0.45}100%{transform:scale(1);opacity:0}}
    .ripple-ring{position:absolute;border-radius:50%;background:rgba(0,99,245,0.22);animation:ripple-out 0.6s cubic-bezier(0.2,0.6,0.4,1) forwards;pointer-events:none;}
  </style>
</head>
<body>
<div id="root" style="height:100%"></div>
<script type="text/babel">
  const { useState, useEffect, useRef } = React;
  const C = { brand600:'#0063F5', brand700:'#004FC6', brand300:'#BBD5FB', yellow:'#FFDD33', gray900:'#121A26', gray700:'#364152', gray600:'#4B5565', gray500:'#697586', gray400:'#9AA4B2', gray200:'#E3E8EF', gray100:'#EEF1F6', gray50:'#F8FAFC', white:'#FFFFFF', black:'#000' };
  const nav = (p) => (window.top||window).location.href = p;

  const SAR = ({ size=14, color='currentColor' }) => (
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1124.14 1256.39" fill={color} style={{width:size,height:size,flexShrink:0}}>
      <path d="M699.62,1113.02h0c-20.06,44.48-33.32,92.75-38.4,143.37l424.51-90.24c20.06-44.47,33.31-92.75,38.4-143.37l-424.51,90.24Z"/>
      <path d="M1085.73,895.8c20.06-44.47,33.32-92.75,38.4-143.37l-330.68,70.33v-135.2l292.27-62.11c20.06-44.47,33.32-92.75,38.4-143.37l-330.68,70.27V66.13c-50.67,28.45-95.67,66.32-132.25,110.99v403.35l-132.25,28.11V0c-50.67,28.44-95.67,66.32-132.25,110.99v525.69l-295.91,62.88c-20.06,44.47-33.33,92.75-38.42,143.37l334.33-71.05v170.26l-358.3,76.14c-20.06,44.47-33.32,92.75-38.4,143.37l375.04-79.7c30.53-6.35,56.77-24.4,73.83-49.24l68.78-101.97v-.02c7.14-10.55,11.3-23.27,11.3-36.97v-149.98l132.25-28.11v270.4l424.53-90.28Z"/>
    </svg>
  );

  const cars = [
    // car-image_registered (Figma 4001:218875)
    { id:4,  make:'CEER',     model:'Foxtron Model B', year:2026, trim:'77 kWh', name:'CEER Foxtron Model B - EV Hatchback - Limited Edition', isNew:true,  price:122000, monthly:1850, img:'/car-loan-assets/car-foxconn-model-b.png' },
    { id:5,  make:'CEER',     model:'Exobot Sedan', year:2026, trim:'Standard',  isNew:true,  price:122000, monthly:1850, img:'/car-loan-assets/car-ceer-sedan-new.png' },
    { id:6,  make:'CEER',     model:'Exobot SUV',   year:2026, trim:'Standard',  isNew:true,  price:135000, monthly:2000, img:'/car-loan-assets/car-ceer-suv-new.png' },
    { id:7,  make:'Lucid',    model:'Air',          year:2026, trim:'Pure',      isNew:true,  price:310000, monthly:4600, img:'/car-loan-assets/car-lucid-air-new.png' },
    { id:8,  make:'Tesla',    model:'Model Y',      year:2026, trim:'Long Range',isNew:true,  price:190000, monthly:2800, img:'/car-loan-assets/car-tesla-model-y-new.png' },
    { id:9,  make:'Mercedes-Benz', model:'C-Class', year:2026, trim:'C200',      isNew:true,  price:230000, monthly:3400, img:'/car-loan-assets/car-merc-cclass-new.png' },
    { id:10, make:'Ford',     model:'Ranger Raptor',year:2026, trim:'3.0L V6',   isNew:true,  price:245000, monthly:3600, img:'/car-loan-assets/car-ford-raptor-new.png' },
    { id:11, make:'MG',       model:'ZS EV',        year:2026, trim:'Standard',  isNew:true,  price:110000, monthly:1650, img:'/car-loan-assets/car-mg-zs-ev-new.png' },
    // NEW cars (Figma 4325) — just before Camry
    { id:1,  make:'Lucid',         model:'Gravity Touring',       year:2026, trim:'Touring', isNew:true,  price:450000, monthly:6750, img:'/car-loan-assets/car-lucid-gravity-touring.png' },
    { id:2,  make:'Mercedes-Benz', model:'S 450 4MATIC Long',     year:2026, trim:'Long',    isNew:true,  price:480000, monthly:7200, img:'/car-loan-assets/car-mercedes-s450.png' },
    { id:3,  make:'Toyota',        model:'Hilux SC-GL Diesel 2.8', year:2024, trim:'SC-GL',  isNew:true,  price:135000, monthly:2050, img:'/car-loan-assets/car-toyota-hilux-scgl.png' },
    // car-image_real (Figma 4001:218942)
    { id:12, make:'Toyota',   model:'Camry',        year:2024, trim:'XLE 2.5L', isNew:true,  price:122000, monthly:1850, img:'/car-loan-assets/car-toyota-camry.png' },
    { id:13, make:'Hyundai',  model:'Accent',       year:2024, trim:'1.4L',     isNew:false, price:72000,  monthly:1100, img:'/car-loan-assets/car-hyundai-accent.png' },
    { id:14, make:'Toyota',   model:'Yaris',        year:2024, trim:'1.5L',     isNew:true,  price:78000,  monthly:1200, img:'/car-loan-assets/car-toyota-yaris.png' },
    { id:15, make:'Toyota',   model:'Hilux',        year:2024, trim:'2.8L 4x4', isNew:true,  price:165000, monthly:2450, img:'/car-loan-assets/car-toyota-hilux.png' },
    { id:16, make:'Hyundai',  model:'Elantra',      year:2024, trim:'1.6L',     isNew:true,  price:98000,  monthly:1490, img:'/car-loan-assets/car-hyundai-elantra.png' },
    { id:17, make:'KIA',      model:'Pegas',        year:2024, trim:'1.4L',     isNew:false, price:68000,  monthly:1050, img:'/car-loan-assets/car-kia-pegas.png' },
    { id:18, make:'Ford',     model:'Taurus',       year:2024, trim:'2.0L EcoBoost', isNew:true, price:135000, monthly:2000, img:'/car-loan-assets/car-ford-taurus.png' },
    // car-image_placeholder (Figma 4001:218913)
    { id:19, make:'Generic',  model:'Sedan',        year:2024, trim:'Standard', isNew:false, price:60000,  monthly:950,  img:'/car-loan-assets/car-placeholder-sedan.png' },
    { id:20, make:'Generic',  model:'Hatchback',    year:2024, trim:'Standard', isNew:false, price:55000,  monthly:880,  img:'/car-loan-assets/car-placeholder-hatchback.png' },
    { id:21, make:'Generic',  model:'SUV',          year:2024, trim:'Standard', isNew:false, price:90000,  monthly:1350, img:'/car-loan-assets/car-placeholder-suv.png' },
    { id:22, make:'Generic',  model:'Pickup',       year:2024, trim:'Standard', isNew:false, price:85000,  monthly:1300, img:'/car-loan-assets/car-placeholder-pickup.png' },
    { id:23, make:'Generic',  model:'Crossover',    year:2024, trim:'Standard', isNew:false, price:80000,  monthly:1250, img:'/car-loan-assets/car-placeholder-crossover.png' },
    { id:24, make:'Generic',  model:'MPV',          year:2024, trim:'Standard', isNew:false, price:75000,  monthly:1150, img:'/car-loan-assets/car-placeholder-mvp.png' },
    { id:25, make:'Generic',  model:'Coupe',        year:2024, trim:'Standard', isNew:false, price:95000,  monthly:1400, img:'/car-loan-assets/car-mercedes-s450.png' },
  ];

  function StatusBar() {
    return (
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'14px 20px 6px'}}>
        <span style={{fontSize:15,fontWeight:700,color:C.gray900}}>9:41</span>
        <div style={{display:'flex',gap:6,alignItems:'center'}}>
          <svg width="17" height="11" viewBox="0 0 17 11" fill={C.gray900}><rect x="0" y="5" width="3" height="6" rx="0.5" opacity="0.4"/><rect x="4.5" y="3" width="3" height="8" rx="0.5" opacity="0.6"/><rect x="9" y="1.5" width="3" height="9.5" rx="0.5" opacity="0.8"/><rect x="13.5" y="0" width="3" height="11" rx="0.5"/></svg>
          <svg width="16" height="11" viewBox="0 0 16 11" fill={C.gray900} opacity="0.7"><path d="M8 8c.9 0 1.6.7 1.6 1.6S8.9 11.2 8 11.2 6.4 10.5 6.4 9.6 7.1 8 8 8z"/><path d="M4.6 5.4C5.6 4.3 6.7 3.7 8 3.7s2.4.6 3.4 1.7l1.3-1.3C11.2 2.6 9.7 2 8 2S4.8 2.6 3.3 4.1l1.3 1.3z" opacity="0.75"/><path d="M1.6 2.5C3.1 1 5.4 0 8 0s4.9 1 6.4 2.5L16 1C14 .4 11.2 0 8 0S2 .4 0 1l1.6 1.5z" opacity="0.5"/></svg>
          <div style={{display:'flex',alignItems:'center',gap:2}}><div style={{width:22,height:11,border:'1.5px solid rgba(0,0,0,0.35)',borderRadius:3,padding:1.5}}><div style={{background:C.gray900,borderRadius:1.5,height:'100%',width:'72%'}}/></div></div>
        </div>
      </div>
    );
  }

  function ViewOptionBar({ selected, onSelect }) {
    const tabs = [
      { id:'List', label:'List', icon: <svg width="16" height="16" viewBox="0 0 16 16" fill="none" style={{color:'currentColor'}}><path d="M2 4h12M2 8h12M2 12h12" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/></svg> },
      { id:'Square', label:'Square', icon: <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="2" y="2" width="12" height="12" rx="2" stroke="currentColor" strokeWidth="1.5"/><path d="M5 8h6" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"/></svg> },
      { id:'Detailed', label:'Detailed', icon: <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="2" y="2" width="12" height="12" rx="2" stroke="currentColor" strokeWidth="1.5"/><path d="M2 6h12" stroke="currentColor" strokeWidth="1.5"/><path d="M6 6v8" stroke="currentColor" strokeWidth="1.5"/></svg> },
    ];
    return (
      <div style={{background:C.gray50,borderRadius:11,padding:3,display:'flex',gap:3,marginBottom:16}}>
        {tabs.map(tab => (
          <button key={tab.id} onClick={()=>onSelect(tab.id)} style={{
            flex:1,display:'flex',alignItems:'center',justifyContent:'center',gap:8,
            padding:'8px 0',borderRadius:8,
            background: selected===tab.id ? C.white : 'transparent',
            border: selected===tab.id ? `1px solid ${C.gray100}` : '1px solid transparent',
            fontSize:12.5,fontWeight:500,letterSpacing:0.5,
            color: selected===tab.id ? C.brand600 : C.gray500,
            boxShadow: selected===tab.id ? '0 1px 2px rgba(10,13,18,0.05)' : 'none',
            cursor:'pointer',fontFamily:'inherit',
          }}>
            {tab.icon}
            {tab.label}
          </button>
        ))}
      </div>
    );
  }

  function HeartButton({ liked, onToggle }) {
    return (
      <button onClick={onToggle} style={{background:'none',border:'none',padding:4,display:'flex',flexShrink:0}}>
        <svg width="24" height="24" viewBox="0 0 24 24" fill={liked?'#EF4444':'none'} xmlns="http://www.w3.org/2000/svg">
          <path d="M16.1111 3C19.6333 3 22 6.3525 22 9.48C22 15.8138 12.1778 21 12 21C11.8222 21 2 15.8138 2 9.48C2 6.3525 4.36667 3 7.88889 3C9.91111 3 11.2333 4.02375 12 4.92375C12.7667 4.02375 14.0889 3 16.1111 3Z" stroke={liked?'#EF4444':'#4B5565'} strokeWidth="1.66667" strokeLinecap="round" strokeLinejoin="round"/>
        </svg>
      </button>
    );
  }

  function TamawalButton({ carId }) {
    return (
      <button onClick={()=>nav(`/car-loan/car-details?id=${carId}`)} style={{background:C.brand600,border:'2px solid rgba(255,255,255,0.12)',borderRadius:8,padding:'8px 12px',fontSize:13.5,fontWeight:600,color:C.white,letterSpacing:0.5,minHeight:36,minWidth:90,flexShrink:0,cursor:'pointer',fontFamily:'inherit'}}>
        Tamawal
      </button>
    );
  }

  function InstallmentRow({ monthly }) {
    return (
      <div style={{flex:1,minWidth:0}}>
        <p style={{margin:'0 0 2px',fontSize:0,color:C.gray600}}>
          <span style={{fontSize:13.5,fontWeight:500,letterSpacing:0.4}}>Installment </span>
          <span style={{fontSize:10,fontWeight:500,letterSpacing:0.5}}>from</span>
        </p>
        <div style={{display:'flex',alignItems:'center',gap:2}}>
          <SAR size={15}/><span style={{fontSize:17.5,fontWeight:700,color:C.gray900,letterSpacing:0,whiteSpace:'nowrap'}}>{monthly.toLocaleString('en-US')}.00</span>
          <span style={{fontSize:10,fontWeight:500,color:C.gray600,letterSpacing:0.5,marginLeft:2}}>/month</span>
        </div>
      </div>
    );
  }

  function CarCard({ car, view = 'Square' }) {
    const [liked, setLiked] = useState(false);
    const [ripples, setRipples] = useState([]);
    const addRipple = (e) => {
      const rect = e.currentTarget.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      const size = Math.max(rect.width, rect.height) * 2;
      const id = Date.now();
      setRipples(r => [...r, {id, x, y, size}]);
      setTimeout(() => setRipples(r => r.filter(rp => rp.id !== id)), 650);
    };

    const cardStyle = {background:C.white,border:`1px solid ${C.gray100}`,borderRadius:16,overflow:'hidden',boxShadow:'0 1px 2px rgba(10,13,18,0.05)',width:'100%'};
    const chevronRight = <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M9 18l6-6-6-6" stroke={C.gray900} strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/></svg>;
    const carImg = (
      <div onDoubleClick={addRipple} style={{display:'flex',alignItems:'center',justifyContent:'center',overflow:'hidden',position:'relative',cursor:'pointer'}}>
        <img src={car.img} alt={car.model} style={{width:'100%',height:'auto',objectFit:'contain',objectPosition:'center'}}/>
        {ripples.map(rp => <span key={rp.id} className="ripple-ring" style={{width:rp.size,height:rp.size,left:rp.x-rp.size/2,top:rp.y-rp.size/2}}/>)}
      </div>
    );

    if (view === 'List') {
      return (
        <div style={{background:C.white,border:`1px solid ${C.gray100}`,borderRadius:16,overflow:'hidden',boxShadow:'0 1px 2px rgba(10,13,18,0.05)',display:'flex',alignItems:'center',justifyContent:'center',width:'100%',minHeight:78}}>
          <div onDoubleClick={addRipple} style={{width:159,height:78,flexShrink:0,position:'relative',overflow:'hidden',display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer'}}>
            <img src={car.img} alt={car.model} style={{width:'100%',height:'100%',objectFit:'contain',objectPosition:'center'}}/>
            {ripples.map(rp => <span key={rp.id} className="ripple-ring" style={{width:rp.size,height:rp.size,left:rp.x-rp.size/2,top:rp.y-rp.size/2}}/>)}
          </div>
          <div style={{flex:1,minWidth:0,display:'flex',gap:8,alignItems:'flex-end',padding:'6px 8px'}}>
            <div style={{flex:1,minWidth:0,display:'flex',flexDirection:'column',justifyContent:'center',opacity:0.9}}>
              <p style={{margin:'0 0 0',fontSize:15.5,fontWeight:600,color:C.gray900,letterSpacing:0.25,overflow:'hidden',display:'-webkit-box',WebkitLineClamp:2,WebkitBoxOrient:'vertical',whiteSpace:'pre-line'}}>
                {`${car.name || `${car.make} ${car.model}`}\n${car.year}`}
              </p>
              <div style={{display:'flex',alignItems:'center',gap:2,color:C.gray600,whiteSpace:'nowrap'}}>
                <span style={{fontSize:10,fontWeight:500,letterSpacing:0.5}}>From</span>
                <SAR size={13} color={C.gray600}/><span style={{fontSize:13.5,fontWeight:500,color:C.gray600,letterSpacing:0}}>{car.monthly.toLocaleString('en-US')}.0</span>
                <span style={{fontSize:10,fontWeight:500,letterSpacing:0.5}}>/mo</span>
              </div>
            </div>
            <div style={{display:'flex',alignItems:'center',paddingBottom:1,flexShrink:0}}>
              <button onClick={()=>nav(`/car-loan/car-details?id=${car.id}`)} style={{background:C.brand600,border:'2px solid rgba(255,255,255,0.12)',borderRadius:48,padding:2,display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer'}}>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M9 18l6-6-6-6" stroke="#fff" strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round"/></svg>
              </button>
            </div>
          </div>
        </div>
      );
    }

    if (view === 'Detailed') {
      const downPayment = Math.round(car.price * 0.30);
      const loanAmount = car.price - downPayment;
      const infoIcon = <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke={C.gray500} strokeWidth="1.5"/><path d="M12 8v1M12 11v5" stroke={C.gray500} strokeWidth="1.5" strokeLinecap="round"/></svg>;
      return (
        <div style={{...cardStyle,paddingTop:8,paddingBottom:2}}>
          <div style={{display:'flex',alignItems:'center',gap:12,padding:'0 12px 4px',borderBottom:`1px solid ${C.gray200}`,minHeight:60}}>
            <div style={{flex:1,paddingLeft:6,minWidth:0}}>
              <p style={{margin:0,fontSize:17.5,fontWeight:700,color:C.gray900,letterSpacing:0.1,overflow:'hidden',textOverflow:'ellipsis',display:'-webkit-box',WebkitLineClamp:2,WebkitBoxOrient:'vertical'}}>
                {car.name || `${car.make} ${car.model} ${car.year} - ${car.trim}`}
              </p>
            </div>
            <button onClick={()=>nav(`/car-loan/car-details?id=${car.id}`)} style={{background:'none',border:'none',padding:'8px 4px 8px 16px',display:'flex',alignItems:'center',flexShrink:0,cursor:'pointer'}}>
              {chevronRight}
            </button>
          </div>
          {carImg}
          <div style={{display:'flex',alignItems:'center',gap:12,padding:'6px 12px 0',borderTop:`1px solid ${C.gray200}`,minHeight:52}}>
            <div style={{flex:1,minWidth:0}}>
              <p style={{margin:'0 0 2px',fontSize:13.5,fontWeight:500,color:C.gray600,letterSpacing:0.4}}>Car Price</p>
              <div style={{display:'flex',alignItems:'center',gap:2}}>
                <SAR size={15}/><span style={{fontSize:17.5,fontWeight:700,color:C.gray900,letterSpacing:0}}>{car.price.toLocaleString('en-US')}.00</span>
              </div>
            </div>
            <div style={{display:'flex',flexDirection:'column',alignItems:'flex-end',minWidth:0,flexShrink:0}}>
              <div style={{display:'flex',alignItems:'center',gap:4}}>{infoIcon}<span style={{fontSize:13.5,fontWeight:500,color:C.gray600,letterSpacing:0.4}}>Down payment</span></div>
              <div style={{display:'flex',alignItems:'center',gap:4}}>
                <div style={{display:'flex',alignItems:'center',gap:2}}><SAR size={15}/><span style={{fontSize:17.5,fontWeight:700,color:C.gray900,letterSpacing:0}}>{downPayment.toLocaleString('en-US')}.00</span></div>
                <div style={{background:C.brand600,borderRadius:4,padding:'0 4px 0 2px'}}><span style={{fontSize:12.5,fontWeight:500,color:C.white,letterSpacing:0.5}}>30%</span></div>
              </div>
            </div>
          </div>
          <div style={{display:'flex',alignItems:'center',gap:12,padding:'4px 12px 0',minHeight:52}}>
            <div style={{flex:1,minWidth:0}}>
              <p style={{margin:'0 0 2px',fontSize:0,color:C.gray600}}>
                <span style={{fontSize:13.5,fontWeight:500,letterSpacing:0.4}}>Loan amount </span>
                <span style={{fontSize:10,fontWeight:500,letterSpacing:0.5}}>up to</span>
              </p>
              <div style={{display:'flex',alignItems:'center',gap:2}}>
                <SAR size={15}/><span style={{fontSize:17.5,fontWeight:700,color:C.gray900,letterSpacing:0}}>{loanAmount.toLocaleString('en-US')}.00</span>
              </div>
            </div>
            <div style={{display:'flex',flexDirection:'column',alignItems:'flex-end',paddingRight:4,flexShrink:0,minWidth:90}}>
              <div style={{display:'flex',alignItems:'center',gap:4}}>{infoIcon}<span style={{fontSize:13.5,fontWeight:500,color:C.gray600,letterSpacing:0.4}}>APR </span><span style={{fontSize:10,fontWeight:500,color:C.gray600,letterSpacing:0.5}}>from</span></div>
              <p style={{margin:0,fontSize:17.5,fontWeight:700,color:C.gray900,letterSpacing:0.1}}>2.24%</p>
            </div>
          </div>
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'4px 12px 6px'}}>
            <InstallmentRow monthly={car.monthly}/>
            <div style={{display:'flex',gap:16,alignItems:'center'}}>
              <HeartButton liked={liked} onToggle={()=>setLiked(!liked)}/>
              <TamawalButton carId={car.id}/>
            </div>
          </div>
        </div>
      );
    }

    // Square (default)
    return (
      <div style={cardStyle}>
        {carImg}

  function DualRangeSlider({ min, max, step, valueMin, valueMax, onChangeMin, onChangeMax }) {
    const pct1 = ((valueMin - min) / (max - min)) * 100;
    const pct2 = ((valueMax - min) / (max - min)) * 100;
    const [minOnTop, setMinOnTop] = React.useState(false);
    const handlePointerDown = (e) => {
      const rect = e.currentTarget.getBoundingClientRect();
      const clickPct = ((e.clientX - rect.left) / rect.width) * 100;
      setMinOnTop(Math.abs(clickPct - pct1) <= Math.abs(clickPct - pct2));
    };
    return (
      <div style={{ position: 'relative', paddingBottom: 24 }} onPointerDown={handlePointerDown}>
        <div style={{ position: 'relative', height: 6, borderRadius: 999, background: C.gray200, margin: '12px 0 8px' }}>
          <div style={{ position: 'absolute', left: `${pct1}%`, width: `${pct2 - pct1}%`, height: '100%', background: C.brand600, borderRadius: 999 }} />
          <div style={{ position: 'absolute', left: `${pct1}%`, top: '50%', transform: 'translate(-50%, -50%)', width: 24, height: 24, boxSizing: 'border-box', borderRadius: 999, background: C.brand600, border: `2.5px solid ${C.white}`, pointerEvents: 'none', zIndex: 2 }} />
          <div style={{ position: 'absolute', left: `${pct2}%`, top: '50%', transform: 'translate(-50%, -50%)', width: 24, height: 24, boxSizing: 'border-box', borderRadius: 999, background: C.brand600, border: `2.5px solid ${C.white}`, pointerEvents: 'none', zIndex: 2 }} />
        </div>
        <input type="range" min={min} max={max} step={step} value={valueMin}
          onChange={e => { const v = +e.target.value; if (v < valueMax - step) onChangeMin(v); }}
          style={{ position: 'absolute', top: 5, left: 0, width: '100%', height: 28, opacity: 0, cursor: 'pointer', zIndex: minOnTop ? 5 : 3 }} />
        <input type="range" min={min} max={max} step={step} value={valueMax}
          onChange={e => { const v = +e.target.value; if (v > valueMin + step) onChangeMax(v); }}
          style={{ position: 'absolute', top: 5, left: 0, width: '100%', height: 28, opacity: 0, cursor: 'pointer', zIndex: minOnTop ? 3 : 5 }} />
        <div style={{ position: 'relative', height: 20 }}>
          <div style={{ position: 'absolute', left: `${pct1}%`, transform: 'translateX(-50%)', display: 'flex', alignItems: 'baseline', gap: 1, color: C.brand700, fontSize: 13.5, fontWeight: 500, whiteSpace: 'nowrap' }}>
            <SAR size={10} color={C.brand700} /><span>{valueMin.toLocaleString('en-US')}</span>
          </div>
          <div style={{ position: 'absolute', left: `${pct2}%`, transform: 'translateX(-50%)', display: 'flex', alignItems: 'baseline', gap: 1, color: C.brand700, fontSize: 13.5, fontWeight: 500, whiteSpace: 'nowrap' }}>
            <SAR size={10} color={C.brand700} /><span>{valueMax.toLocaleString('en-US')}</span>
          </div>
        </div>
      </div>
    );
  }

              <p style={{ margin: '0 0 8px', fontSize: 17.5, fontWeight: 700, color: C.gray900, textAlign: 'center' }}>Select Dealer</p>
              {DEALERS.map(d => (
                <button key={d.id} onClick={() => { dismiss(); onSelect(d); }} style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '12px 16px', border: `1px solid ${C.gray100}`, borderRadius: 12, background: C.white }}>
                  <span style={{ fontSize: 15.5, fontWeight: 600, color: C.gray900 }}>{d.name}</span>
                  <img src={d.logo} alt={d.name} style={{ height: 36, objectFit: 'contain' }} />
                </button>
              ))}
            </div>
            <HomeBar />
          </>
        )}
      </SheetOverlay>
    );
  }

  function App() {
    const [expanded, setExpanded] = useState(false);
    const [filterOpen, setFilterOpen] = useState(false);
    const [sortOpen, setSortOpen] = useState(false);
    const [activeFilters, setActiveFilters] = useState(null);
    const [sortSel, setSortSel] = useState({ newest: 'asc', price: null, year: null, popularity: null });
    const [view, setView] = useState('Square');
    const [visibleCount, setVisibleCount] = useState(6);
    const [isLoading, setIsLoading] = useState(false);
    const scrollRef = useRef(null);
    const loadingRef = useRef(false);
    const visibleRef = useRef(6);

    useEffect(() => {
      const el = scrollRef.current;
      if (!el) return;
      const onScroll = () => {
        if (loadingRef.current) return;
        if (visibleRef.current >= cars.length) return;
        const { scrollTop, scrollHeight, clientHeight } = el;
        if (scrollHeight - scrollTop - clientHeight < 150) {
          loadingRef.current = true;
          setIsLoading(true);
          setTimeout(() => {
            const next = Math.min(visibleRef.current + 6, cars.length);
            visibleRef.current = next;
            setVisibleCount(next);
            setIsLoading(false);
            loadingRef.current = false;
          }, 1500);
        }
      };
      el.addEventListener('scroll', onScroll, { passive: true });
      return () => el.removeEventListener('scroll', onScroll);
    }, []);

    const dealers = {
      wallan:     { id:'wallan',     name:'Al Wallan Dealer',  logo:'/dealer-wallan.png' },
      almajdouie: { id:'almajdouie', name:'Almajdouie Dealer', logo:'/dealer-almajdouie.png' },
    };
    const dealerId = (window.top||window).location.pathname.split('/').filter(Boolean).pop();
    const selectedDealer = dealers[dealerId] || null;

    const activeFilterCount = activeFilters
      ? activeFilters.carStatus.length + activeFilters.carType.length + activeFilters.motorType.length + activeFilters.brand.length + activeFilters.likeStatus.length + (activeFilters.priceMin !== 20000 || activeFilters.priceMax !== 120000 ? 1 : 0)
      : 0;
    const activeSortCount = Object.values(sortSel).filter(Boolean).length;

    return (
      <div style={{height:'100%',display:'flex',flexDirection:'column',background:C.gray50,fontFamily:'"SF Arabic",system-ui,-apple-system,Arial,sans-serif',position:'relative'}}>

        <div style={{background:C.white,flexShrink:0}}>
          <StatusBar/>
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'4px 16px 10px'}}>
            <button onClick={()=>nav('/car-loan')} style={{background:'none',border:'none',padding:'8px 4px',minWidth:48,display:'flex',alignItems:'center'}}>
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M15 19L8 12l7-7" stroke={C.gray900} strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round"/></svg>
            </button>
            <span onClick={()=>nav('/car-loan/inventory-alternative')} style={{fontSize:15.5,fontWeight:600,color:'#202A39',letterSpacing:0.25,cursor:'pointer'}}>Car offers</span>
            <div style={{minWidth:48}}/>
          </div>
        </div>

        <div style={{background:C.white,flexShrink:0}}>
          <div style={{padding:'8px 24px'}}>
            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}>
              <span style={{fontSize:15.5,fontWeight:700,color:C.gray900,letterSpacing:0.1}}>Find your car</span>
              <button onClick={()=>setExpanded(e=>!e)} style={{display:'flex',alignItems:'center',gap:10,background:'none',border:'none',padding:0}}>
                <span style={{fontSize:12.5,fontWeight:500,color:C.gray600,letterSpacing:0.5}}>Change</span>
                <div style={{border:`1px solid ${C.gray200}`,borderRadius:34,padding:8,display:'flex',alignItems:'center',justifyContent:'center'}}>
                  <svg width="16" height="16" viewBox="0 0 16 16" fill="none" style={{transform:expanded?'rotate(180deg)':'rotate(0deg)',transition:'transform 0.2s'}}>
                    <path d="M4 6l4 4 4-4" stroke={C.gray600} strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round"/>
                  </svg>
                </div>
              </button>
            </div>
          </div>
          {expanded && <FindLoanExpanded onClose={()=>setExpanded(false)}/>}
        </div>

        {selectedDealer && (
          <div style={{background:C.white,padding:'10px 24px',borderBottom:`1px solid ${C.gray100}`,flexShrink:0,display:'flex',alignItems:'center',gap:16}}>
            <div style={{flex:1}}>
              <p style={{margin:'0 0 2px',fontSize:13.5,fontWeight:500,color:C.gray600,letterSpacing:0.4}}>Car in dealer</p>
              <p style={{margin:0,fontSize:15.5,fontWeight:700,color:C.gray900,letterSpacing:0.1}}>{selectedDealer.name}</p>
            </div>
            <img src={selectedDealer.logo} alt={selectedDealer.name} style={{height:48,objectFit:'contain',flexShrink:0}}/>
            <button onClick={()=>setSelectedDealer(null)} style={{background:'none',border:'none',padding:4,display:'flex',alignItems:'center',flexShrink:0}}>
              <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M15 5L5 15M5 5l10 10" stroke={C.gray400} strokeWidth="1.5" strokeLinecap="round"/></svg>
            </button>
          </div>
        )}

        <div ref={scrollRef} className="scroll" style={{flex:1,padding:'24px'}}>

          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:24}}>
            <p style={{margin:0,fontSize:13.5,fontWeight:500,color:'#98A2B3',letterSpacing:0.4}}>
              You may be eligible for{' '}
              <span style={{color:'#1D2939',fontWeight:500}}>{cars.length} Cars</span>
            </p>
            <div style={{display:'flex',gap:24,alignItems:'center'}}>
              <button onClick={() => setFilterOpen(true)} style={{ background: 'none', border: 'none', padding: 0, position: 'relative', display: 'flex' }}>
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M13.5 15.75L17.25 19.5L21 15.75" stroke="#697586" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
                  <path d="M17.25 10.5V19.5" stroke="#697586" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
                  <path d="M4.5 12H11.25" stroke="#697586" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
                  <path d="M4.5 6H17.25" stroke="#697586" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
                  <path d="M4.5 18H9.75" stroke="#697586" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
                </svg>
                {activeFilterCount > 0 && <div style={{ position: 'absolute', top: -4, right: -4, width: 14, height: 14, background: C.brand600, borderRadius: '50%', display: 'flex', alignItems: 'center', justifyContent: 'center' }}><span style={{ fontSize: 9, fontWeight: 700, color: C.white, lineHeight: 1 }}>{activeFilterCount}</span></div>}
              </button>
              <button onClick={() => setSortOpen(true)} style={{ background: 'none', border: 'none', padding: 0, position: 'relative', display: 'flex' }}>
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M3.94507 4.5H20.0513C20.1968 4.50005 20.3391 4.5424 20.461 4.62191C20.5828 4.70141 20.6789 4.81463 20.7375 4.94777C20.7961 5.08092 20.8148 5.22824 20.7911 5.37179C20.7675 5.51533 20.7026 5.64891 20.6045 5.75625L14.4451 12.5344C14.3169 12.6716 14.2464 12.8529 14.2482 13.0406V18.3469C14.2493 18.4715 14.219 18.5944 14.16 18.7042C14.101 18.814 14.0153 18.9072 13.9107 18.975L10.9107 20.9719C10.7982 21.046 10.6677 21.0884 10.5331 21.0947C10.3985 21.101 10.2647 21.0709 10.1458 21.0076C10.0268 20.9443 9.92713 20.8501 9.85717 20.7349C9.78721 20.6198 9.74956 20.4879 9.7482 20.3531V13.0406C9.75001 12.8529 9.67952 12.6716 9.55132 12.5344L3.39195 5.75625C3.29375 5.64891 3.22889 5.51533 3.20527 5.37179C3.18164 5.22824 3.20028 5.08092 3.2589 4.94777C3.31753 4.81463 3.41361 4.70141 3.53544 4.62191C3.65727 4.5424 3.7996 4.50005 3.94507 4.5Z" stroke="#697586" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
                </svg>
                {activeSortCount > 0 && <div style={{ position: 'absolute', top: -4, right: -4, width: 14, height: 14, background: C.brand600, borderRadius: '50%', display: 'flex', alignItems: 'center', justifyContent: 'center' }}><span style={{ fontSize: 9, fontWeight: 700, color: C.white, lineHeight: 1 }}>{activeSortCount}</span></div>}
              </button>
            </div>
          </div>

          <ViewOptionBar selected={view} onSelect={setView}/>
          <div style={{display:'flex',flexDirection:'column',gap:16}}>
            {cars.slice(0, visibleCount).map(car => <CarCard key={car.id} car={car} view={view}/>)}
            {isLoading && [0,1,2].map(i => <SkeletonCard key={`sk-${i}`} view={view}/>)}
          </div>
          {!isLoading && visibleCount >= cars.length && (
            <div style={{background:C.gray50,borderRadius:11,padding:'12px 24px',textAlign:'center',marginTop:24}}>
              <p style={{margin:0,fontSize:12.5,fontWeight:500,color:C.gray400,letterSpacing:0.5,lineHeight:'18px'}}>You've reached the end of the list</p>
            </div>
          )}
        </div>

        <div style={{background:C.white,height:34,display:'flex',alignItems:'flex-end',justifyContent:'center',paddingBottom:8,flexShrink:0}}>
          <div style={{width:135,height:5,background:'#000',borderRadius:999}}/>
        </div>

        {filterOpen && <FilterSheet initial={activeFilters} onClose={() => setFilterOpen(false)} onApply={(f) => setActiveFilters(f)} />}
        {sortOpen && <SortSheet initialSel={sortSel} onClose={() => setSortOpen(false)} onApply={(s) => setSortSel(s)} />}

      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
