const LOAN_PERIODS = [12,18,24,30,36,42,54,60,72];

function LoanPeriodSelector({selected, onSelect, maxPeriod=60}) {

        {LOAN_PERIODS.map(p => {
          const isActive = p === selected;
          const isDisabled = p > maxPeriod;
          return (
            <button key={p} onClick={()=>!isDisabled && onSelect(p)}
              style={{
                padding:12,borderRadius:12,cursor:isDisabled?'default':'pointer',
                background: isActive ? 'var(--brand-600)' : isDisabled ? 'var(--gray-50)' : 'var(--gray-100)',
                border: isActive ? '1px solid var(--gray-100)' : isDisabled ? 'none' : '1px solid var(--brand-600)',

              <span style={{fontSize:13.5,fontWeight:600,lineHeight:'20px',color: isActive ? 'white' : isDisabled ? 'var(--gray-400)' : 'var(--gray-600)',letterSpacing:0.5,display:'block',width:19,textAlign:'center'}}>{p}</span>

const fmtSar = n => Math.round(n).toLocaleString('en-US');

function RangeSlider({value, min, max, step, onChange, topLabels, bottomLabels}) {
  const pct = ((value - min) / (max - min)) * 100;
  const thumbCenter = `calc(${pct}% + ${(0.5 - pct / 100) * 22}px)`;
  const labelRow = (labels, withSar) => (
    <div style={{position:'relative',height:26,width:'100%'}}>
      {labels.map(({text, at, active}, i) => {
        const x = at === 'min' ? 0 : at === 'max' ? 100 : pct;
        const shift = at === 'min' ? '0%' : at === 'max' ? '-100%' : `-${pct}%`;
        if (!active && Math.abs(x - pct) < 22) return null;
        return (
          <span key={i} style={{position:'absolute',left:`${x}%`,transform:`translateX(${shift})`,display:'flex',alignItems:'center',gap:2,fontSize:15.5,fontWeight:600,lineHeight:'26px',letterSpacing:0.1,whiteSpace:'nowrap',color: active ? 'var(--brand-600)' : 'var(--gray-400)'}}>
            {withSar && <SarIcon size={12} color={active ? 'var(--brand-600)' : 'var(--gray-400)'}/>}{text}
          </span>
        );
      })}
    </div>
  );
  return (
    <div style={{display:'flex',flexDirection:'column',gap:12,width:'100%'}}>
      {topLabels && labelRow(topLabels, true)}
      <div style={{position:'relative',height:24,margin:'0 12px'}}>
        <div style={{position:'absolute',inset:0,background:'var(--gray-100)',borderRadius:999}}/>
        <div style={{position:'absolute',left:0,top:0,bottom:0,width:`calc(${thumbCenter} + 11px)`,background:'linear-gradient(90deg, var(--brand-800), var(--brand-600))',borderRadius:999}}/>
        <div style={{position:'absolute',top:1,left:`calc(${thumbCenter} - 11px)`,width:22,height:22,borderRadius:'50%',background:'white',border:'3px solid var(--brand-600)',pointerEvents:'none'}}/>
        <input type="range" min={min} max={max} step={step} value={value} onChange={e=>onChange(Number(e.target.value))}
          style={{position:'absolute',inset:0,width:'100%',height:'100%',opacity:0,margin:0,cursor:'pointer',touchAction:'pan-x'}}/>
      </div>
      {bottomLabels && labelRow(bottomLabels, false)}
    </div>
  );
}

          <img src="/car-loan-assets/icon-compare-nav.svg" style={{width:20,height:20}} alt=""/>
          <span style={{fontSize:13.5,fontWeight:600,color:'var(--gray-600)',lineHeight:'18px',letterSpacing:0.5}}>Compare</span>
        </button>
        <button style={{flex:1,minHeight:46,background:'var(--brand-600)',border:'2px solid rgba(255,255,255,0.12)',borderRadius:8,display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer',padding:'12px 16px'}}>
          <span style={{fontSize:13.5,fontWeight:600,color:'white',lineHeight:'18px',letterSpacing:0.5}}>Tamawal</span>
        </button>
      </div>
      <div style={{height:34,display:'flex',alignItems:'flex-end',justifyContent:'center',paddingBottom:8}}>
        <div style={{width:134,height:5,background:'black',borderRadius:999}}/>
      </div>
    </div>
  );
}

function App() {
  const [activeTab, setActiveTab] = React.useState('max');
  const [selectedPeriod, setSelectedPeriod] = React.useState(60);
  const [downPaymentPct, setDownPaymentPct] = React.useState(20);
  const [loanAmount, setLoanAmount] = React.useState(75000);
  const maxLoanAmount = CAR_PRICE * (1 - downPaymentPct / 100);
  const maxPeriod = maxPeriodForDp(downPaymentPct);
  const changeDownPayment = pct => {
    setDownPaymentPct(pct);
    setLoanAmount(a => Math.min(a, CAR_PRICE * (1 - pct / 100)));
    setSelectedPeriod(m => Math.min(m, Math.max(...LOAN_PERIODS.filter(p => p <= maxPeriodForDp(pct)))));
  };

  return (
    <div style={{width:'100%',minHeight:'100vh',background:'white',position:'relative'}}>
      <StatusBar/>
      <Header/>
      <CarCollapsed/>
      <BankSection/>
      <SegmentedControl activeTab={activeTab} onTabChange={setActiveTab}/>

      <div style={{display:'flex',flexDirection:'column',gap:24,padding:'24px 24px 160px',alignItems:'center'}}>
        {activeTab === 'calc' ? (
          <>
            <DownPaymentSlider percent={downPaymentPct} onChange={changeDownPayment}/>
            <LoanPeriodSelector selected={selectedPeriod} onSelect={setSelectedPeriod} maxPeriod={maxPeriod}/>
            <LoanAmountSlider amount={loanAmount} max={maxLoanAmount} onChange={setLoanAmount}/>
          </>
        ) : (
          <>
            <LoanPeriodSelector selected={selectedPeriod} onSelect={setSelectedPeriod}/>
            <LoanAmount months={selectedPeriod}/>
          </>
        )}
        <LoanDetailsTable/>
        <FeesContainer/>
        <ExecutionCard/>
        <p style={{fontSize:12.5,fontWeight:500,color:'var(--gray-600)',lineHeight:'18px',letterSpacing:0.5,width:327}}>Profit rates starting from 2.25%, Payment holiday for first installment (up to 120 days), High financing amounts of up to SAR 4 Million for KSA Nationals, Quick and easy approval process</p>
        <div style={{display:'flex',flexDirection:'column',gap:12,alignItems:'flex-start',width:'100%'}}>
          <AccordionCard
            title="Great for"
            icon="/car-loan-assets/frame-1.svg"
            items={['Low profit fees starting from 2.25% for KSA Nationals ','Deferred payment of the first installment for up to 120 days ']}
          />
          <AccordionCard
            title="Beware"
            icon="/car-loan-assets/frame-2.svg"
            items={['Applicable only for KSA Nationals ']}
          />
          <AccordionCard
            title="Required documents"
            icon="/car-loan-assets/frame-3.svg"
            items={['Passport (pdf or jpg)','Salary Evidance Document (pdf or jpg)']}
          />
          <AccordionCard
            title="Conditions"
            icon="/car-loan-assets/frame-4.svg"
            items={['The borrower is of legal age','The borrower has his permanent residence in Saudi Arabia']}
          />
        </div>
        <MediaCard/>
        <div style={{width:40,height:1,borderTop:'1px solid var(--gray-200)'}}/>
        <ProductRating/>
      </div>

      <BottomNav/>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
</body>
</html>
