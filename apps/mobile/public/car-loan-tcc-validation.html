<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>TCC Validation</title>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; font-family: -apple-system, 'SF Pro Text', sans-serif; }
  .screen { width: 375px; height: 812px; position: relative; overflow: hidden; background: #fff; margin: 0 auto; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const A = '/car-loan-assets/';

function StatusBar() {
  return (
    <div style={{ position: 'absolute', top: 0, left: 0, width: 375, height: 38, overflow: 'hidden' }}>
      <div style={{ position: 'absolute', top: '50%', transform: 'translateY(-50%)', right: 14.67, display: 'flex', alignItems: 'center', gap: 4 }}>
        <img src={A+'status-signal.svg'} style={{ width: 17, height: 10.667, marginTop: 4 }} alt=""/>
        <img src={A+'status-wifi.svg'} style={{ width: 15.272, height: 10.966, marginTop: 3.81 }} alt=""/>
        <div style={{ position: 'relative', marginTop: 4 }}>
          <img src={A+'status-battery.svg'} style={{ width: 22, height: 11.333 }} alt=""/>
          <img src={A+'status-battery-fill.svg'} style={{ position: 'absolute', top: '50%', transform: 'translateY(-50%)', left: 1, width: 18, height: 7.333 }} alt=""/>
          <img src={A+'status-battery-nub.svg'} style={{ position: 'absolute', top: '50%', transform: 'translateY(-50%)', right: -1.328, width: 1.328, height: 4 }} alt=""/>
        </div>
      </div>
      <div style={{ position: 'absolute', top: '50%', transform: 'translateY(-50%)', left: 33.45, marginTop: 3.71 }}>
        <img src={A+'status-time.svg'} style={{ width: 28.426, height: 11.089 }} alt=""/>
      </div>
    </div>
  );
}

function HomeBar() {
  return (
    <div style={{ position: 'absolute', bottom: 0, left: 0, width: 375, height: 34, background: '#fff' }}>
      <div style={{ position: 'absolute', bottom: 8, left: '32.27%', right: '32%', height: 5, background: '#000', borderRadius: 999 }} />
    </div>
  );
}

function App() {
  return (
    <div className="screen">
      <StatusBar />
      <HomeBar />
      <div style={{
        position: 'absolute',
        top: '50%', left: '50%',
        transform: 'translate(-50%, -50%)',
        display: 'flex', flexDirection: 'column',
        alignItems: 'center', gap: 86
      }}>
        <div style={{ width: 64, height: 64, position: 'relative' }}>
          <img src={A+'tamawal-logo-mark.svg'} style={{ width: 64.003, height: 64 }} alt="Tamawal"/>
        </div>
        <div style={{ display: 'flex', flexDirection: 'column', gap: 20, alignItems: 'center', textAlign: 'center' }}>
          <p style={{
            width: 327, fontSize: 17.5, fontWeight: 500,
            lineHeight: '26px', letterSpacing: 0.5,
            color: '#121a26'
          }}>
            Ownership Validation<br/>of Mobile Number
          </p>
          <p style={{
            width: 327, fontSize: 23.5, fontWeight: 600,
            lineHeight: '30px', letterSpacing: 0,
            color: '#121a26'
          }}>
            +966 599855552
          </p>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
