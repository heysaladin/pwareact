<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Offers on this car</title>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
  <style>
    html,body,#root{margin:0;padding:0;height:100%;overflow:hidden;background:#fff;}
    *{box-sizing:border-box;}
    button{cursor:pointer;font-family:inherit;}
    .scroll{scrollbar-width:none;overflow-y:auto;}
    .scroll::-webkit-scrollbar{display:none;}
  </style>
</head>
<body>
<div id="root" style="height:100%"></div>
<script type="text/babel">
  const { useState } = React;
  const C = { brand600:'#0063F5', brand700:'#004FC6', yellow:'#FFDD33', gray900:'#121A26', gray700:'#364152', gray600:'#4B5565', gray500:'#697586', gray400:'#9AA4B2', gray200:'#E3E8EF', gray100:'#EEF1F6', gray50:'#F8FAFC', white:'#FFFFFF', green:'#1F9254', greenBg:'#EAF7EF', greenBorder:'#B7E4C7', red:'#E53935' };
  const nav = (p) => (window.top||window).location.href = p;

  const car = {
    make:'Mitsubishi', year:2026, model:'Space Star MT Diesel', price:69900,
    installmentFrom:1096, aprFrom:1.75,
    chips:['1.2L Diesel','5-speed manual','5 seats','18.5 km/L'],
    description:'A practical, efficient compact car for everyday driving. The manual gearbox and diesel engine give responsive performance and good fuel economy, for city commutes and longer trips alike.',
    specs:[
      { label:'Engine',       value:'1.2L 4-cylinder diesel' },
      { label:'Transmission', value:'5-speed manual' },
      { label:'Fuel economy', value:'18.5 km/L' },
      { label:'Seating',      value:'5 passengers' },
      { label:'Warranty',     value:'5 years / 100,000 km' },
    ],
  };

  const dpOptions = [0,10,20,30,40];
  const periodOptions = [24,36,48,60];
  const totalOffersCount = 46;

  const offers = [
    { id:1, code:'BAB', bank:'Bank Albilad',         bankColor:'#143C6B', title:'Car/EV Financing for Big Family & Employee', aprFrom:1.75, monthlyFrom:1096, note:'No minimum down payment', stars:5.0, personalApr:2.05, personalMonthly:1104 },
    { id:2, code:'ARB', bank:'Al Rajhi Bank',         bankColor:'#0B5733', title:'Auto Lease for Salaried Employees',          aprFrom:1.89, monthlyFrom:1100, note:'Min. down payment 10%',  stars:4.8, personalApr:2.19, personalMonthly:1108 },
    { id:3, code:'SNB', bank:'Saudi National Bank',   bankColor:'#5B2A86', title:'Car Financing Murabaha',                     aprFrom:1.95, monthlyFrom:1101, note:'No minimum down payment', stars:4.7, personalApr:2.30, personalMonthly:1111 },
    { id:4, code:'BAJ', bank:'Bank AlJazira',         bankColor:'#7A4B12', title:'Auto Financing for New Cars',                aprFrom:2.25, monthlyFrom:1110, note:'Min. down payment 5%',   stars:4.5, personalApr:2.61, personalMonthly:1120 },
    { id:5, code:'ALN', bank:'Alinma Bank',           bankColor:'#8A1C2B', title:'Vehicle Ijara Plus',                         aprFrom:2.40, monthlyFrom:1118, note:'Min. down payment 10%',  stars:4.4, personalApr:2.75, personalMonthly:1126 },
    { id:6, code:'SAB', bank:'Saudi Awwal Bank',      bankColor:'#1A5276', title:'Simple Car Finance',                         aprFrom:2.55, monthlyFrom:1123, note:'Min. down payment 10%',  stars:4.3, personalApr:2.89, personalMonthly:1131 },
  ];
  const eligibleCount = offers.length;

  function StatusBar() {
    return (
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'14px 20px 6px'}}>
        <span style={{fontSize:15,fontWeight:700,color:C.gray900}}>9:41</span>
        <div style={{display:'flex',gap:6,alignItems:'center'}}>
          <svg width="17" height="11" viewBox="0 0 17 11" fill={C.gray900}><rect x="0" y="5" width="3" height="6" rx="0.5" opacity="0.4"/><rect x="4.5" y="3" width="3" height="8" rx="0.5" opacity="0.6"/><rect x="9" y="1.5" width="3" height="9.5" rx="0.5" opacity="0.8"/><rect x="13.5" y="0" width="3" height="11" rx="0.5"/></svg>
          <svg width="16" height="11" viewBox="0 0 16 11" fill={C.gray900} opacity="0.7"><path d="M8 8c.9 0 1.6.7 1.6 1.6S8.9 11.2 8 11.2 6.4 10.5 6.4 9.6 7.1 8 8 8z"/><path d="M4.6 5.4C5.6 4.3 6.7 3.7 8 3.7s2.4.6 3.4 1.7l1.3-1.3C11.2 2.6 9.7 2 8 2S4.8 2.6 3.3 4.1l1.3 1.3z" opacity="0.75"/><path d="M1.6 2.5C3.1 1 5.4 0 8 0s4.9 1 6.4 2.5L16 1C14 .4 11.2 0 8 0S2 .4 0 1l1.6 1.5z" opacity="0.5"/></svg>
          <div style={{display:'flex',alignItems:'center',gap:2}}><div style={{width:22,height:11,border:'1.5px solid rgba(0,0,0,0.35)',borderRadius:3,padding:1.5}}><div style={{background:C.gray900,borderRadius:1.5,height:'100%',width:'72%'}}/></div></div>
        </div>
      </div>
    );
  }

  const SAR = ({ size=14, color='currentColor' }) => (
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1124.14 1256.39" fill={color} style={{width:size,height:size,flexShrink:0}}>
      <path d="M699.62,1113.02h0c-20.06,44.48-33.32,92.75-38.4,143.37l424.51-90.24c20.06-44.47,33.31-92.75,38.4-143.37l-424.51,90.24Z"/>
      <path d="M1085.73,895.8c20.06-44.47,33.32-92.75,38.4-143.37l-330.68,70.33v-135.2l292.27-62.11c20.06-44.47,33.32-92.75,38.4-143.37l-330.68,70.27V66.13c-50.67,28.45-95.67,66.32-132.25,110.99v403.35l-132.25,28.11V0c-50.67,28.44-95.67,66.32-132.25,110.99v525.69l-295.91,62.88c-20.06,44.47-33.33,92.75-38.42,143.37l334.33-71.05v170.26l-358.3,76.14c-20.06,44.47-33.32,92.75-38.4,143.37l375.04-79.7c30.53-6.35,56.77-24.4,73.83-49.24l68.78-101.97v-.02c7.14-10.55,11.3-23.27,11.3-36.97v-149.98l132.25-28.11v270.4l424.53-90.28Z"/>
    </svg>
  );

  const BackIcon = ({ color=C.gray900 }) => (
    <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M12.5 16.5L6 10l6.5-6.5" stroke={color} strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round"/></svg>
  );
  const ChevronRightIcon = ({ color=C.gray500, size=18 }) => (
    <svg width={size} height={size} viewBox="0 0 20 20" fill="none"><path d="M7.5 4.5L13 10l-5.5 5.5" stroke={color} strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/></svg>
  );
  const SortIcon = () => (
    <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
      <path d="M6 4v12M6 4L3 7M6 4l3 3" stroke={C.gray700} strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round"/>
      <path d="M14 16V4M14 16l3-3M14 16l-3-3" stroke={C.gray700} strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round"/>
    </svg>
  );
  const ShareIcon = () => (
    <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
      <path d="M10 2.5v10M10 2.5L6.5 6M10 2.5L13.5 6" stroke={C.gray700} strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round"/>
      <path d="M4.5 10v5.5a1 1 0 001 1h9a1 1 0 001-1V10" stroke={C.gray700} strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round"/>
    </svg>
  );
  const CompareIcon = ({ color='currentColor', size=20 }) => (
    <svg width={size} height={size} viewBox="0 0 20 20" fill="none">
      <path d="M15.3125 12.7083C14.1044 12.7083 13.125 13.6877 13.125 14.8958C13.125 16.104 14.1044 17.0833 15.3125 17.0833C16.5206 17.0833 17.5 16.104 17.5 14.8958C17.5 13.6877 16.5206 12.7083 15.3125 12.7083ZM15.3125 12.7083V9.57552C15.3112 8.57925 14.9151 7.6241 14.2109 6.91927L11.25 3.95833M14.375 3.95833H11.25V7.08333M4.6875 7.70833C5.89562 7.70833 6.875 6.72896 6.875 5.52083C6.875 4.31271 5.89562 3.33333 4.6875 3.33333C3.47938 3.33333 2.5 4.31271 2.5 5.52083C2.5 6.72896 3.47938 7.70833 4.6875 7.70833ZM4.6875 7.70833V10.8411C4.68885 11.8374 5.08495 12.7926 5.78906 13.4974L8.75 16.4583M5.625 16.4583H8.75V13.3333" stroke={color} strokeWidth="1.66667" strokeLinecap="round" strokeLinejoin="round"/>
    </svg>
  );
  const HeartIcon = ({ liked }) => (
    <svg width="22" height="22" viewBox="0 0 24 24" fill={liked?'#EF4444':'none'}>
      <path d="M16.1111 3C19.6333 3 22 6.3525 22 9.48C22 15.8138 12.1778 21 12 21C11.8222 21 2 15.8138 2 9.48C2 6.3525 4.36667 3 7.88889 3C9.91111 3 11.2333 4.02375 12 4.92375C12.7667 4.02375 14.0889 3 16.1111 3Z" stroke={liked?'#EF4444':C.gray600} strokeWidth="1.66667" strokeLinecap="round" strokeLinejoin="round"/>
    </svg>
  );
  const CheckIcon = () => (
    <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><circle cx="9" cy="9" r="9" fill={C.green}/><path d="M5.5 9.3l2.2 2.2 4.8-4.8" stroke={C.white} strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"/></svg>
  );
  const FilterIcon = () => (
    <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
      <path d="M2.5 5h15M5.5 10h9M8.25 15h3.5" stroke={C.gray700} strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round"/>
    </svg>
  );
  const CarPlaceholderIcon = ({ size=40 }) => (
    <svg width={size} height={size*0.56} viewBox="0 0 100 56" fill="none">
      <path d="M12 38h76M18 38v-9c0-2 1.3-3.8 3.2-4.4L29 22l5-8c1-1.6 2.8-2.6 4.7-2.6h22.6c1.9 0 3.7 1 4.7 2.6l5 8 7.8 2.6c1.9.6 3.2 2.4 3.2 4.4v9" stroke={C.gray400} strokeWidth="2" strokeLinejoin="round"/>
      <circle cx="30" cy="38" r="6" stroke={C.gray400} strokeWidth="2"/>
      <circle cx="70" cy="38" r="6" stroke={C.gray400} strokeWidth="2"/>
    </svg>
  );
  function Stars({ val }) {
    return (
      <div style={{display:'flex',alignItems:'center',gap:2}}>
        {[1,2,3,4,5].map(i=>(
          <svg key={i} width="13" height="13" viewBox="0 0 12 12" fill={i<=Math.round(val)?C.yellow:C.gray200}>
            <path d="M6 1l1.24 2.51 2.76.4-2 1.95.47 2.74L6 7.25 3.53 8.6 4 5.86 2 3.91l2.76-.4z"/>
          </svg>
        ))}
        <span style={{fontSize:12,color:C.gray500,marginLeft:2}}>{val.toFixed(1)}</span>
      </div>
    );
  }

  function SpecChip({ label }) {
    return <span style={{fontSize:12.5,fontWeight:500,color:C.gray700,border:`1px solid ${C.gray200}`,borderRadius:999,padding:'7px 12px',whiteSpace:'nowrap'}}>{label}</span>;
  }

  function Pills({ options, value, onChange, suffix }) {
    return (
      <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
        {options.map(o => (
          <button key={o} onClick={()=>onChange(o)} style={{flex:'1 1 0',minWidth:64,padding:'10px 4px',fontSize:13.5,fontWeight: value===o?700:500,border:`1.5px solid ${value===o?C.brand600:C.gray200}`,borderRadius:10,background:value===o?C.brand600:C.white,color:value===o?C.white:C.gray600}}>
            {o}{suffix||''}
          </button>
        ))}
      </div>
    );
  }

  function DpEditorPanel({ dp, setDp, period, setPeriod, dpAmount, financeAmount, onDone, eligibilityChecked }) {
    return (
      <div style={{background:C.white,border:`1px solid ${C.gray100}`,borderRadius:16,padding:16,marginBottom:16}}>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:16}}>
          <div style={{display:'flex',alignItems:'center',gap:8}}>
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><rect x="3" y="4" width="14" height="13" rx="2" stroke={C.gray700} strokeWidth="1.4"/><path d="M3 8h14" stroke={C.gray700} strokeWidth="1.4"/></svg>
            <span style={{fontSize:13.5,fontWeight:500,color:C.gray700}}>Prices calculated with <strong>{dp}% DP · {period} months</strong></span>
          </div>
          <button onClick={onDone} style={{background:'none',border:`1.5px solid ${C.brand600}`,borderRadius:999,padding:'6px 16px',fontSize:13,fontWeight:600,color:C.brand600,flexShrink:0}}>Done</button>
        </div>

        <p style={{margin:'0 0 10px',fontSize:12.5,fontWeight:600,color:C.gray900}}>Down payment</p>
        <Pills options={dpOptions} value={dp} onChange={setDp} suffix="%"/>

        <p style={{margin:'20px 0 10px',fontSize:12.5,fontWeight:600,color:C.gray900}}>Period</p>
        <Pills options={periodOptions} value={period} onChange={setPeriod} suffix=" mo"/>

        <div style={{marginTop:20,paddingTop:16,borderTop:`1px solid ${C.gray100}`,display:'flex',flexDirection:'column',gap:8}}>
          <div style={{display:'flex',justifyContent:'space-between'}}>
            <span style={{fontSize:13,color:C.gray500}}>Car price</span>
            <span style={{fontSize:13,fontWeight:600,color:C.gray900}}>SAR {car.price.toLocaleString('en-US')}</span>
          </div>
          <div style={{display:'flex',justifyContent:'space-between'}}>
            <span style={{fontSize:13,color:C.gray500}}>Down payment</span>
            <span style={{fontSize:13,fontWeight:600,color:C.gray900}}>− SAR {dpAmount.toLocaleString('en-US')}</span>
          </div>
          <div style={{display:'flex',justifyContent:'space-between'}}>
            <span style={{fontSize:13.5,fontWeight:700,color:C.gray900}}>Amount to finance</span>
            <span style={{fontSize:13.5,fontWeight:700,color:C.gray900}}>SAR {financeAmount.toLocaleString('en-US')}</span>
          </div>
        </div>

        <p style={{margin:'14px 0 0',fontSize:11.5,color:C.gray500,lineHeight:1.5}}>
          Your down payment is paid to the dealer. All {eligibilityChecked?eligibleCount:totalOffersCount} offers update when you change it; some banks need a higher minimum.
        </p>
      </div>
    );
  }

  function OfferCardPre({ offer }) {
    const [compared, setCompared] = useState(false);
    const [liked, setLiked] = useState(false);
    return (
      <div style={{background:C.white,border:`1px solid ${C.gray100}`,borderRadius:16,overflow:'hidden',boxShadow:'0 1px 2px rgba(10,13,18,0.05)'}}>
        <div style={{display:'flex',alignItems:'flex-start',gap:10,padding:'14px 16px 12px',borderBottom:`1px solid ${C.gray100}`}}>
          <div style={{width:40,height:28,borderRadius:6,background:offer.bankColor,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,marginTop:2}}>
            <span style={{fontSize:10,fontWeight:700,color:C.white}}>{offer.code}</span>
          </div>
          <div style={{flex:1,minWidth:0}}>
            <p style={{margin:'0 0 2px',fontSize:12,color:C.gray500,fontWeight:500}}>{offer.bank}</p>
            <p style={{margin:0,fontSize:15,fontWeight:700,color:C.gray900,lineHeight:1.3}}>{offer.title}</p>
          </div>
          <ChevronRightIcon/>
        </div>

        <div style={{display:'flex',justifyContent:'space-between',padding:'12px 16px 4px'}}>
          <div>
            <p style={{margin:'0 0 3px',fontSize:11.5,color:C.gray500,fontWeight:500}}>APR from</p>
            <span style={{fontSize:17.5,fontWeight:700,color:C.brand600}}>{offer.aprFrom}%</span>
          </div>
          <div style={{textAlign:'right'}}>
            <p style={{margin:'0 0 3px',fontSize:11.5,color:C.gray500,fontWeight:500}}>Monthly from</p>
            <div style={{display:'flex',alignItems:'center',gap:3,justifyContent:'flex-end'}}><SAR size={13}/><span style={{fontSize:15.5,fontWeight:700,color:C.gray900}}>{offer.monthlyFrom.toLocaleString('en-US')}</span></div>
          </div>
        </div>
        <p style={{margin:'4px 16px 10px',fontSize:12,color:C.gray500}}>{offer.note}</p>

        <div style={{display:'flex',alignItems:'center',gap:10,padding:'10px 16px',borderTop:`1px solid ${C.gray100}`}}>
          <Stars val={offer.stars}/>
          <div style={{flex:1}}/>
          <button onClick={()=>setCompared(!compared)} style={{display:'flex',alignItems:'center',gap:5,background:'none',border:`1px solid ${compared?C.brand600:C.gray200}`,borderRadius:8,padding:'6px 10px',color:compared?C.brand600:C.gray600,fontSize:12.5,fontWeight:500}}>
            <CompareIcon size={16}/>Compare
          </button>
          <button onClick={()=>setLiked(!liked)} style={{background:'none',border:'none',padding:2,display:'flex'}}><HeartIcon liked={liked}/></button>
        </div>
        <div style={{padding:'0 16px 14px'}}>
          <button style={{width:'100%',background:C.brand600,border:'none',borderRadius:10,padding:'10px 16px',fontSize:14,fontWeight:600,color:C.white}}>View offer</button>
        </div>
      </div>
    );
  }

  function OfferCardPost({ offer, lowest, comparing, onToggleCompare }) {
    return (
      <div style={{background:C.white,border:`1px solid ${C.gray100}`,borderRadius:16,overflow:'hidden',boxShadow:'0 1px 2px rgba(10,13,18,0.05)',padding:'14px 16px'}}>
        <div style={{display:'flex',alignItems:'flex-start',gap:10,marginBottom:10}}>
          <div style={{width:36,height:26,borderRadius:6,background:offer.bankColor,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,marginTop:2}}>
            <span style={{fontSize:9.5,fontWeight:700,color:C.white}}>{offer.code}</span>
          </div>
          <div style={{flex:1,minWidth:0}}>
            <div style={{display:'flex',alignItems:'center',gap:8,justifyContent:'space-between'}}>
              <p style={{margin:0,fontSize:14.5,fontWeight:700,color:C.gray900,lineHeight:1.3}}>{offer.title}</p>
              {lowest && <span style={{flexShrink:0,fontSize:11,fontWeight:700,color:C.green,background:C.greenBg,border:`1px solid ${C.greenBorder}`,borderRadius:999,padding:'3px 9px'}}>Lowest</span>}
            </div>
            <p style={{margin:'2px 0 0',fontSize:12,color:C.gray500,fontWeight:500}}>{offer.bank}</p>
          </div>
        </div>

        <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-end'}}>
          <div style={{display:'flex',gap:20}}>
            <div>
              <p style={{margin:'0 0 3px',fontSize:11.5,color:C.gray500,fontWeight:500}}>Your APR</p>
              <span style={{fontSize:16.5,fontWeight:700,color:C.gray900}}>{offer.personalApr}%</span>
            </div>
            <div>
              <p style={{margin:'0 0 3px',fontSize:11.5,color:C.gray500,fontWeight:500}}>Monthly</p>
              <div style={{display:'flex',alignItems:'center',gap:3}}><SAR size={13}/><span style={{fontSize:16.5,fontWeight:700,color:C.gray900}}>{offer.personalMonthly.toLocaleString('en-US')}</span></div>
            </div>
          </div>
          <div style={{display:'flex',alignItems:'center',gap:8}}>
            <button onClick={onToggleCompare} style={{width:34,height:34,borderRadius:8,border:`1.5px solid ${comparing?C.brand600:C.gray200}`,background:comparing?'#EBF3FF':C.white,color:comparing?C.brand600:C.gray500,display:'flex',alignItems:'center',justifyContent:'center'}}>
              <CompareIcon size={16}/>
            </button>
            <button style={{width:34,height:34,borderRadius:8,border:'none',background:C.brand600,display:'flex',alignItems:'center',justifyContent:'center'}}>
              <ChevronRightIcon color={C.white} size={16}/>
            </button>
          </div>
        </div>
      </div>
    );
  }

  function CarDetailsTab({ onSeeOffers }) {
    return (
      <div>
        <p style={{margin:'4px 0 20px',fontSize:13.5,color:C.gray600,lineHeight:1.6}}>{car.description}</p>

        <p style={{margin:'0 0 10px',fontSize:13.5,fontWeight:700,color:C.gray900}}>Specifications</p>
        <div style={{border:`1px solid ${C.gray100}`,borderRadius:12,overflow:'hidden',marginBottom:24}}>
          {car.specs.map((s,i)=>(
            <div key={s.label} style={{display:'flex',justifyContent:'space-between',padding:'11px 14px',background:i%2?C.gray50:C.white}}>
              <span style={{fontSize:13,color:C.gray600}}>{s.label}</span>
              <span style={{fontSize:13.5,fontWeight:700,color:C.gray900}}>{s.value}</span>
            </div>
          ))}
        </div>

        <p style={{margin:'0 0 10px',fontSize:13.5,fontWeight:700,color:C.gray900}}>Video review</p>
        <div style={{background:'#121A26',borderRadius:14,height:160,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:8,marginBottom:24}}>
          <div style={{width:48,height:48,borderRadius:'50%',border:`2px solid ${C.white}`,display:'flex',alignItems:'center',justifyContent:'center'}}>
            <svg width="16" height="18" viewBox="0 0 16 18" fill={C.white}><path d="M0 0l16 9-16 9V0z"/></svg>
          </div>
          <span style={{fontSize:12,color:'rgba(255,255,255,0.7)'}}>[Video thumbnail]</span>
        </div>

        <p style={{margin:'0 0 10px',fontSize:13.5,fontWeight:700,color:C.gray900}}>Available at dealers</p>
        <div style={{display:'flex',gap:10,marginBottom:24}}>
          <button onClick={()=>nav('/car-loan/inventory/wallan')} style={{flex:1,border:`1px solid ${C.gray200}`,borderRadius:12,padding:'16px 8px',background:C.white,display:'flex',alignItems:'center',justifyContent:'center'}}>
            <span style={{fontSize:12,color:C.gray500}}>[Wallan logo]</span>
          </button>
          <button onClick={()=>nav('/car-loan/inventory/almajdouie')} style={{flex:1,border:`1px solid ${C.gray200}`,borderRadius:12,padding:'16px 8px',background:C.white,display:'flex',alignItems:'center',justifyContent:'center'}}>
            <span style={{fontSize:12,color:C.gray500}}>[Almajdouie logo]</span>
          </button>
        </div>

        <button onClick={onSeeOffers} style={{width:'100%',background:C.white,border:`1.5px solid ${C.brand600}`,borderRadius:12,padding:14,fontSize:14.5,fontWeight:600,color:C.brand600}}>
          See {totalOffersCount} financing offers
        </button>
      </div>
    );
  }

  function App() {
    const [tab, setTab] = useState('offers');
    const [dp, setDp] = useState(10);
    const [period, setPeriod] = useState(60);
    const [dpEditorOpen, setDpEditorOpen] = useState(true);
    const [eligibilityChecked, setEligibilityChecked] = useState(false);
    const [activeThumb, setActiveThumb] = useState(0);
    const [compareSel, setCompareSel] = useState([]);

    const dpAmount = Math.round(car.price * dp / 100);
    const financeAmount = car.price - dpAmount;
    const sortedOffers = eligibilityChecked ? [...offers].sort((a,b)=>a.personalApr-b.personalApr) : offers;

    const toggleCompare = (id) => {
      setCompareSel(sel => sel.includes(id) ? sel.filter(x=>x!==id) : sel.length>=3 ? sel : [...sel, id]);
    };

    return (
      <div style={{height:'100%',display:'flex',flexDirection:'column',background:C.gray50,fontFamily:'"SF Arabic",system-ui,-apple-system,Arial,sans-serif',position:'relative'}}>

        {/* Header */}
        <div style={{background:C.white,flexShrink:0,borderBottom:`1px solid ${C.gray100}`}}>
          <StatusBar/>

          {!eligibilityChecked ? (
            <>
              <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'4px 16px 10px'}}>
                <button onClick={()=>nav('/car-loan/inventory')} style={{background:'none',border:'none',padding:'8px 4px',minWidth:36,display:'flex'}}><BackIcon/></button>
                <span style={{fontSize:15.5,fontWeight:600,color:C.gray900,letterSpacing:0.1}}>Offers on this car</span>
                <div style={{display:'flex',gap:14,minWidth:36,justifyContent:'flex-end'}}>
                  <button style={{background:'none',border:'none',padding:'8px 2px',display:'flex'}}><SortIcon/></button>
                  <button style={{background:'none',border:'none',padding:'8px 2px',display:'flex'}}><ShareIcon/></button>
                </div>
              </div>

              <div style={{padding:'0 16px'}}>
                <div style={{background:C.gray100,borderRadius:16,height:150,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:6,marginBottom:10}}>
                  <CarPlaceholderIcon size={56}/>
                  <span style={{fontSize:12,color:C.gray500}}>[Car hero image]</span>
                </div>
                <div style={{display:'flex',gap:8,marginBottom:18}}>
                  {[0,1,2].map(i=>(
                    <button key={i} onClick={()=>setActiveThumb(i)} style={{width:56,height:44,borderRadius:10,border:`1.5px solid ${activeThumb===i?C.brand600:C.gray200}`,background:C.gray50,flexShrink:0}}/>
                  ))}
                  <div style={{width:56,height:44,borderRadius:10,background:C.gray100,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
                    <span style={{fontSize:12.5,fontWeight:600,color:C.gray600}}>+8</span>
                  </div>
                </div>

                <p style={{margin:'0 0 2px',fontSize:13,color:C.gray500,fontWeight:500}}>{car.make} · {car.year}</p>
                <p style={{margin:'0 0 14px',fontSize:21,fontWeight:700,color:C.gray900}}>{car.model}</p>
                <div style={{display:'flex',justifyContent:'space-between',marginBottom:16}}>
                  <span style={{fontSize:13,color:C.gray500}}>Car price</span>
                  <span style={{fontSize:14,fontWeight:700,color:C.gray900}}>SAR {car.price.toLocaleString('en-US')}</span>
                </div>

                <div style={{background:'#EBF3FF',borderRadius:14,padding:'14px 16px',display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}}>
                  <div>
                    <p style={{margin:'0 0 2px',fontSize:11.5,color:C.gray600,fontWeight:500}}>Installment from</p>
                    <div style={{display:'flex',alignItems:'baseline',gap:3}}><SAR size={14} color={C.gray900}/><span style={{fontSize:18,fontWeight:700,color:C.gray900}}>{car.installmentFrom.toLocaleString('en-US')}</span><span style={{fontSize:12,color:C.gray500}}>/month</span></div>
                  </div>
                  <div style={{textAlign:'right'}}>
                    <p style={{margin:'0 0 2px',fontSize:11.5,color:C.gray600,fontWeight:500}}>APR from</p>
                    <span style={{fontSize:18,fontWeight:700,color:C.gray900}}>{car.aprFrom}%</span>
                  </div>
                </div>
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginTop:-10,marginBottom:16}}>
                  <span style={{fontSize:12,color:C.gray500}}>With <strong>{dp}%</strong> down payment · <strong>{period} months</strong></span>
                  <button onClick={()=>{setTab('offers');setDpEditorOpen(true);}} style={{background:'none',border:'none',padding:0,fontSize:12.5,fontWeight:600,color:C.brand600}}>Change</button>
                </div>

                <div style={{display:'flex',gap:8,flexWrap:'wrap',marginBottom:16}}>
                  {car.chips.map(c => <SpecChip key={c} label={c}/>)}
                </div>
              </div>
            </>
          ) : (
            <div style={{display:'flex',alignItems:'center',gap:10,padding:'4px 16px 10px'}}>
              <button onClick={()=>nav('/car-loan/inventory')} style={{background:'none',border:'none',padding:'8px 2px 8px 0',display:'flex',flexShrink:0}}><BackIcon/></button>
              <div style={{width:40,height:30,borderRadius:8,background:C.gray100,flexShrink:0}}/>
              <button onClick={()=>setTab('details')} style={{flex:1,minWidth:0,background:'none',border:'none',padding:0,textAlign:'left',display:'flex',alignItems:'center',gap:4}}>
                <div style={{minWidth:0}}>
                  <p style={{margin:0,fontSize:14,fontWeight:700,color:C.gray900,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{car.model}</p>
                  <p style={{margin:0,fontSize:12,color:C.gray500}}>SAR {car.price.toLocaleString('en-US')} · Car details</p>
                </div>
                <ChevronRightIcon size={14}/>
              </button>
              <button style={{background:'none',border:'none',padding:'8px 2px',display:'flex',flexShrink:0}}><SortIcon/></button>
            </div>
          )}

          {/* Tabs */}
          <div style={{display:'flex',gap:8,padding:'0 16px 14px'}}>
            <button onClick={()=>setTab('offers')} style={{flex:1,padding:'10px',borderRadius:10,border:`1.5px solid ${tab==='offers'?C.gray900:C.gray200}`,background:tab==='offers'?C.gray900:C.white,color:tab==='offers'?C.white:C.gray600,fontSize:13.5,fontWeight:600}}>
              Offers ({eligibilityChecked?eligibleCount:totalOffersCount})
            </button>
            <button onClick={()=>setTab('details')} style={{flex:1,padding:'10px',borderRadius:10,border:`1.5px solid ${tab==='details'?C.gray900:C.gray200}`,background:tab==='details'?C.gray900:C.white,color:tab==='details'?C.white:C.gray600,fontSize:13.5,fontWeight:600}}>
              Car details
            </button>
          </div>
        </div>

        {/* Scrollable body */}
        <div className="scroll" style={{flex:1,minHeight:0,overflowY:'auto',padding:'16px 16px 24px'}}>
          {tab==='offers' ? (
            <>
              {dpEditorOpen ? (
                <DpEditorPanel dp={dp} setDp={setDp} period={period} setPeriod={setPeriod} dpAmount={dpAmount} financeAmount={financeAmount} onDone={()=>setDpEditorOpen(false)} eligibilityChecked={eligibilityChecked}/>
              ) : (
                <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',background:C.white,border:`1px solid ${C.gray100}`,borderRadius:12,padding:'12px 14px',marginBottom:16}}>
                  <span style={{fontSize:13.5,fontWeight:600,color:C.gray900}}>{dp}% DP (SAR {dpAmount.toLocaleString('en-US')}) · {period} months</span>
                  <button onClick={()=>setDpEditorOpen(true)} style={{background:'none',border:'none',padding:0,fontSize:13,fontWeight:600,color:C.brand600}}>Edit</button>
                </div>
              )}

              {!eligibilityChecked && (
                <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:14,paddingLeft:2}}>
                  <span style={{fontSize:13,fontWeight:600,color:C.gray900}}>{totalOffersCount} car financing products</span>
                  <span style={{fontSize:12,color:C.gray500}}>Sorted by monthly</span>
                </div>
              )}

              {eligibilityChecked && (
                <div style={{display:'flex',alignItems:'center',gap:10,background:C.greenBg,border:`1px solid ${C.greenBorder}`,borderRadius:12,padding:'10px 12px',marginBottom:14}}>
                  <CheckIcon/>
                  <span style={{flex:1,fontSize:13,fontWeight:600,color:C.gray900}}>Eligible for {eligibleCount} of {totalOffersCount} · personal rates</span>
                  <button style={{background:'none',border:'none',padding:0,fontSize:12.5,fontWeight:600,color:C.brand600}}>Change</button>
                  <button style={{background:'none',border:'none',padding:0,display:'flex'}}><FilterIcon/></button>
                </div>
              )}

              <div style={{display:'flex',flexDirection:'column',gap:12}}>
                {sortedOffers.map((o,i) => eligibilityChecked
                  ? <OfferCardPost key={o.id} offer={o} lowest={i===0} comparing={compareSel.includes(o.id)} onToggleCompare={()=>toggleCompare(o.id)}/>
                  : <OfferCardPre key={o.id} offer={o}/>
                )}
              </div>
            </>
          ) : (
            <CarDetailsTab onSeeOffers={()=>setTab('offers')}/>
          )}
        </div>

        {/* Bottom bar */}
        <div style={{background:C.white,borderTop:`1px solid ${C.gray100}`,flexShrink:0}}>
          {!eligibilityChecked ? (
            <div style={{display:'flex',alignItems:'center',gap:12,padding:'12px 16px'}}>
              <div style={{flex:1}}>
                <p style={{margin:0,fontSize:11.5,color:C.gray500}}>{dp}% DP · not checked yet</p>
                <p style={{margin:0,fontSize:13,fontWeight:700,color:C.gray900}}>See your personal rate</p>
              </div>
              <button onClick={()=>setEligibilityChecked(true)} style={{background:C.brand600,border:'none',borderRadius:12,padding:'13px 22px',fontSize:14,fontWeight:700,color:C.white,whiteSpace:'nowrap'}}>
                Check eligibility
              </button>
            </div>
          ) : (
            <div style={{display:'flex',gap:10,padding:'12px 16px'}}>
              <button style={{flex:1,background:C.white,border:`1.5px solid ${C.gray200}`,borderRadius:12,padding:'13px',fontSize:14,fontWeight:600,color:C.gray900}}>
                Compare {compareSel.length}
              </button>
              <button style={{flex:1,background:C.brand600,border:'none',borderRadius:12,padding:'13px',fontSize:14,fontWeight:700,color:C.white}}>
                Continue with best
              </button>
            </div>
          )}
          <div style={{height:28,display:'flex',alignItems:'flex-end',justifyContent:'center',paddingBottom:8}}>
            <div style={{width:135,height:5,background:'#000',borderRadius:999}}/>
          </div>
        </div>

      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
