<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>Nafath Verification</title>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { background: #fff; font-family: -apple-system, 'SF Pro Text', sans-serif; overflow-x: hidden; }
  :root {
    --brand-600: #0063f5;
    --gray-100: #eef1f6;
    --gray-200: #e3e8ef;
    --gray-300: #cdd4df;
    --gray-400: #9aa4b2;
    --gray-500: #697586;
    --gray-600: #4b5565;
    --gray-800: #202a39;
    --gray-900: #121a26;
  }
  @keyframes spin { from { stroke-dashoffset: 226; } to { stroke-dashoffset: 56; } }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">

const { useState, useEffect } = React;

function StatusBar() {
  return (
    <div style={{height:38,position:'relative',overflow:'hidden',width:'100%'}}>
      <div style={{position:'absolute',right:14.67,top:'50%',transform:'translateY(-50%)',display:'flex',alignItems:'center',gap:6}}>
        <img src="/car-loan-assets/status-signal.svg" style={{width:17,height:10.67}} alt=""/>
        <img src="/car-loan-assets/status-wifi.svg" style={{width:15.27,height:10.97}} alt=""/>
        <div style={{position:'relative',width:22,height:11.33}}>
          <img src="/car-loan-assets/status-battery.svg" style={{width:'100%',height:'100%'}} alt=""/>
        </div>
      </div>
      <div style={{position:'absolute',left:33,top:'50%',transform:'translateY(-50%)'}}>
        <img src="/car-loan-assets/status-time.svg" style={{width:28.4,height:11.1}} alt=""/>
      </div>
    </div>
  );
}

function App() {
  const [seconds, setSeconds] = useState(202); // 03:22

  useEffect(() => {
    const t = setInterval(() => setSeconds(s => s > 0 ? s - 1 : 0), 1000);
    return () => clearInterval(t);
  }, []);

  const mm = String(Math.floor(seconds / 60)).padStart(2, '0');
  const ss = String(seconds % 60).padStart(2, '0');
  const progress = seconds / 300; // out of 5 minutes total

  // Circular progress
  const r = 36;
  const circ = 2 * Math.PI * r;
  const dashoffset = circ * (1 - progress);

  return (
    <div style={{width:'100%',height:'100vh',background:'white',display:'flex',flexDirection:'column',position:'relative'}}>
      <StatusBar/>
      {/* Header */}
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',paddingLeft:16,paddingRight:16,paddingTop:4,paddingBottom:6}}>
        <div style={{minWidth:48,display:'flex',alignItems:'center'}}>
          <img src="/car-loan-assets/chevron-left.svg" style={{width:24,height:24}} alt="back"/>
        </div>
        <p style={{flex:1,textAlign:'center',fontSize:15.5,fontWeight:600,lineHeight:'22px',color:'var(--gray-800)',letterSpacing:0.25}}>Nafath Verification</p>
        <div style={{minWidth:48}}/>
      </div>

      {/* Main content */}
      <div style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:'24px 24px 100px',gap:32}}>

        {/* OTP Number box */}
        <div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:12}}>
          <div style={{width:120,height:120,border:'1px solid var(--gray-200)',borderRadius:16,background:'#f8fafc',display:'flex',alignItems:'center',justifyContent:'center',boxShadow:'0 1px 3px rgba(0,0,0,0.06)'}}>
            <span style={{fontSize:56,fontWeight:700,color:'var(--gray-900)',lineHeight:1}}>68</span>
          </div>
          <p style={{fontSize:15.5,color:'var(--gray-500)',lineHeight:'22px',textAlign:'center'}}>Select this number in Nafath</p>
        </div>

        {/* Progress bar */}
        <div style={{width:'100%',maxWidth:327}}>
          <div style={{height:4,background:'var(--gray-200)',borderRadius:4,overflow:'hidden'}}>
            <div style={{height:'100%',background:'var(--brand-600)',borderRadius:4,width:`${progress * 100}%`,transition:'width 1s linear'}}/>
          </div>
        </div>

        {/* Timer */}
        <div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:6}}>
          <p style={{fontSize:13.5,color:'var(--gray-500)',lineHeight:'20px',textAlign:'center'}}>Time remaining for the request to expire...</p>
          <p style={{fontSize:23.5,fontWeight:700,color:'var(--gray-900)',lineHeight:'30px',letterSpacing:1}}>{mm}:{ss}</p>
        </div>

        {/* Steps */}
        <div style={{display:'flex',alignItems:'center',justifyContent:'center',gap:8,width:'100%',maxWidth:327}}>
          {/* Step 1 */}
          <div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:8,flex:1}}>
            <div style={{width:56,height:56,borderRadius:12,background:'#e8f5e9',display:'flex',alignItems:'center',justifyContent:'center',overflow:'hidden'}}>
              <img src="/car-loan-assets/nafath-logo.png" style={{width:44,height:44,objectFit:'contain'}} alt="Nafath"/>
            </div>
            <p style={{fontSize:11,color:'var(--gray-500)',textAlign:'center',lineHeight:'16px'}}>Go to{'\n'}Nafath App</p>
          </div>
          {/* Arrow */}
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" style={{flexShrink:0,marginBottom:20}}>
            <path d="M4 10h12M11 5.5l4.5 4.5L11 14.5" stroke="#9aa4b2" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
          </svg>
          {/* Step 2 */}
          <div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:8,flex:1}}>
            <div style={{width:56,height:56,borderRadius:12,background:'var(--gray-100)',display:'flex',alignItems:'center',justifyContent:'center'}}>
              <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
                <rect x="3" y="3" width="18" height="18" rx="3" stroke="#697586" strokeWidth="1.5"/>
                <circle cx="12" cy="12" r="3" stroke="#697586" strokeWidth="1.5"/>
                <path d="M12 8v1M12 15v1M8 12H7M17 12h-1" stroke="#697586" strokeWidth="1.5" strokeLinecap="round"/>
              </svg>
            </div>
            <p style={{fontSize:11,color:'var(--gray-500)',textAlign:'center',lineHeight:'16px'}}>Select the{'\n'}number above</p>
          </div>
          {/* Arrow */}
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" style={{flexShrink:0,marginBottom:20}}>
            <path d="M4 10h12M11 5.5l4.5 4.5L11 14.5" stroke="#9aa4b2" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
          </svg>
          {/* Step 3 */}
          <div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:8,flex:1}}>
            <div style={{width:56,height:56,borderRadius:12,background:'#e8f0ff',display:'flex',alignItems:'center',justifyContent:'center'}}>
              <img src="/car-loan-assets/tamawal-logo-mark.svg" style={{width:36,height:36,objectFit:'contain'}} alt="Tamawal"/>
            </div>
            <p style={{fontSize:11,color:'var(--gray-500)',textAlign:'center',lineHeight:'16px'}}>Return back{'\n'}to Tamawal</p>
          </div>
        </div>
      </div>

      {/* Bottom button */}
      <div style={{position:'fixed',bottom:0,left:0,right:0,background:'white',borderTop:'1px solid var(--gray-100)'}}>
        <div style={{padding:'12px 24px 8px'}}>
          <button style={{width:'100%',minHeight:46,background:'var(--brand-600)',border:'none',borderRadius:8,fontSize:15.5,fontWeight:600,color:'white',cursor:'pointer'}}>
            Go to Nafath App
          </button>
        </div>
        <div style={{height:34,display:'flex',alignItems:'flex-end',justifyContent:'center',paddingBottom:8}}>
          <div style={{width:134,height:5,background:'black',borderRadius:999}}/>
        </div>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
</body>
</html>
