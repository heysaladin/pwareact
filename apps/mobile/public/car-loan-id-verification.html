<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>ID Verification</title>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { background: #fff; font-family: -apple-system, 'SF Pro Text', sans-serif; overflow-x: hidden; }
  :root {
    --brand-600: #0063f5;
    --gray-50: #f8fafc;
    --gray-100: #eef1f6;
    --gray-200: #e3e8ef;
    --gray-300: #cdd4df;
    --gray-400: #9aa4b2;
    --gray-500: #697586;
    --gray-600: #4b5565;
    --gray-800: #202a39;
    --gray-900: #121a26;
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">

function StatusBar() {
  return (
    <div style={{height:38,position:'relative',overflow:'hidden',width:'100%'}}>
      <div style={{position:'absolute',right:14.67,top:'50%',transform:'translateY(-50%)',display:'flex',alignItems:'center',gap:6}}>
        <img src="/car-loan-assets/status-signal.svg" style={{width:17,height:10.67}} alt=""/>
        <img src="/car-loan-assets/status-wifi.svg" style={{width:15.27,height:10.97}} alt=""/>
        <div style={{position:'relative',width:22,height:11.33}}>
          <img src="/car-loan-assets/status-battery.svg" style={{width:'100%',height:'100%'}} alt=""/>
        </div>
      </div>
      <div style={{position:'absolute',left:33,top:'50%',transform:'translateY(-50%)'}}>
        <img src="/car-loan-assets/status-time.svg" style={{width:28.4,height:11.1}} alt=""/>
      </div>
    </div>
  );
}

function App() {
  return (
    <div style={{width:'100%',height:'100vh',background:'white',display:'flex',flexDirection:'column',position:'relative'}}>
      <StatusBar/>
      {/* Header */}
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',paddingLeft:16,paddingRight:16,paddingTop:4,paddingBottom:6}}>
        <div style={{minWidth:48,display:'flex',alignItems:'center'}}>
          <img src="/car-loan-assets/chevron-left.svg" style={{width:24,height:24}} alt="back"/>
        </div>
        <p style={{flex:1,textAlign:'center',fontSize:15.5,fontWeight:600,lineHeight:'22px',color:'var(--gray-800)',letterSpacing:0.25}}>ID Verification</p>
        <div style={{minWidth:48}}/>
      </div>

      {/* Centered content */}
      <div style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:'24px',gap:24}}>
        {/* ID text */}
        <p style={{fontSize:15.5,color:'#364152',textAlign:'center'}}>(ID 74549459545)</p>

        {/* Logos row */}
        <div style={{display:'flex',alignItems:'center',gap:12}}>
          {/* Tamawal logo circle */}
          <div style={{width:72,height:72,borderRadius:999,border:'1px solid var(--gray-200)',display:'flex',alignItems:'center',justifyContent:'center',background:'white',overflow:'hidden'}}>
            <img src="/car-loan-assets/tamawal-logo.svg" style={{width:64,height:64,objectFit:'contain'}} alt="Tamawal"/>
          </div>
          {/* Infinity icon */}
          <img src="/car-loan-assets/icon-infinity.svg" style={{width:24,height:24}} alt=""/>
          {/* Nafath logo box */}
          <div style={{width:72,height:72,borderRadius:8,border:'1px solid var(--gray-200)',display:'flex',alignItems:'center',justifyContent:'center',background:'white',overflow:'hidden'}}>
            <img src="/car-loan-assets/nafath-logo.png" style={{width:64,height:64,objectFit:'contain'}} alt="Nafath"/>
          </div>
        </div>

        {/* Description */}
        <p style={{fontSize:17.5,color:'#121a26',textAlign:'center',lineHeight:'26px',width:326}}>
          To complete registration, open Nafath app and accept the registration request{'\n'}to verify your ID.
        </p>
      </div>

      {/* Sticky bottom */}
      <div style={{position:'fixed',bottom:0,left:0,right:0,background:'white'}}>
        <div style={{position:'absolute',top:0,left:0,right:0,height:1}}>
          <img src="/car-loan-assets/nav-separator.svg" style={{width:'100%',height:1,display:'block'}} alt=""/>
        </div>
        <div style={{padding:'12px 24px 8px'}}>
          <button style={{width:'100%',minHeight:46,background:'var(--brand-600)',border:'none',borderRadius:8,fontSize:15.5,fontWeight:600,color:'white',cursor:'pointer'}}>
            Validate with Nafath
          </button>
        </div>
        <div style={{height:34,display:'flex',alignItems:'flex-end',justifyContent:'center',paddingBottom:8}}>
          <div style={{width:134,height:5,background:'black',borderRadius:999}}/>
        </div>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
</body>
</html>
