<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>Eligible Offers</title>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; font-family: -apple-system, 'SF Pro Text', sans-serif; }
  .screen { width: 375px; height: 812px; position: relative; overflow: hidden; background: #fff; margin: 0 auto; }
  .scroll-content { position: absolute; top: 0; left: 0; right: 0; bottom: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .scroll-content::-webkit-scrollbar { display: none; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const A = '/car-loan-assets/';

function StatusBarDark() {
  return (
    <div style={{ height: 38, overflow: 'hidden', position: 'relative', width: '100%' }}>
      <div style={{ position: 'absolute', top: '50%', transform: 'translateY(-50%)', right: 14.67, display: 'flex', alignItems: 'center', gap: 4 }}>
        <img src={A+'status-signal.svg'} style={{ width: 17, height: 10.667, marginTop: 4, filter: 'brightness(0) invert(1)' }} alt=""/>
        <img src={A+'status-wifi.svg'} style={{ width: 15.272, height: 10.966, marginTop: 3.81, filter: 'brightness(0) invert(1)' }} alt=""/>
        <div style={{ position: 'relative', marginTop: 4 }}>
          <img src={A+'status-battery.svg'} style={{ width: 22, height: 11.333, filter: 'brightness(0) invert(1)' }} alt=""/>
          <img src={A+'status-battery-fill.svg'} style={{ position: 'absolute', top: '50%', transform: 'translateY(-50%)', left: 1, width: 18, height: 7.333, filter: 'brightness(0) invert(1)' }} alt=""/>
          <img src={A+'status-battery-nub.svg'} style={{ position: 'absolute', top: '50%', transform: 'translateY(-50%)', right: -1.328, width: 1.328, height: 4, filter: 'brightness(0) invert(1)' }} alt=""/>
        </div>
      </div>
      <div style={{ position: 'absolute', top: '50%', transform: 'translateY(-50%)', left: 33.45, marginTop: 3.71 }}>
        <img src={A+'status-time.svg'} style={{ width: 28.426, height: 11.089, filter: 'brightness(0) invert(1)' }} alt=""/>
      </div>
    </div>
  );
}

function HomeBar() {
  return (
    <div style={{ height: 34, background: '#fff' }}>
      <div style={{ position: 'relative', height: '100%' }}>
        <div style={{ position: 'absolute', bottom: 8, left: '32.27%', right: '32%', height: 5, background: '#000', borderRadius: 999 }} />
      </div>
    </div>
  );
}

function ProductCard({ title, bankLogo, apr, loanAmount, loanPeriod }) {
  return (
    <div style={{
      background: '#fff', border: '1px solid #eef1f6', borderRadius: 16,
      overflow: 'hidden', width: 327,
      boxShadow: '0px 1px 2px rgba(10,13,18,0.05)'
    }}>
      <div style={{ padding: '8px 0' }}>
        {/* Title row */}
        <div style={{
          display: 'flex', alignItems: 'center', gap: 12,
          padding: '0 12px 4px', minHeight: 60,
          borderBottom: '1px solid #e3e8ef'
        }}>
          <div style={{ flex: 1, paddingLeft: 6 }}>
            <p style={{
              fontSize: 17.5, fontWeight: 700, lineHeight: '26px',
              letterSpacing: 0.1, color: '#121a26',
              overflow: 'hidden', textOverflow: 'ellipsis'
            }}>{title}</p>
          </div>
          <img src={A+'chevron-right-card.svg'} style={{ width: 24, height: 24, flexShrink: 0 }} alt=""/>
        </div>
        {/* Bank logo + APR */}
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '0 12px' }}>
          <div style={{ width: 125, padding: '2px 0' }}>
            <img src={bankLogo} style={{ height: 40, objectFit: 'contain', maxWidth: '100%' }} alt="bank logo"/>
          </div>
          <div style={{ width: 100, display: 'flex', flexDirection: 'column', alignItems: 'flex-end', paddingRight: 4 }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 2 }}>
              <img src={A+'icon-info-circle-sm.svg'} style={{ width: 14, height: 14 }} alt=""/>
              <span style={{ fontSize: 13.5, fontWeight: 500, lineHeight: '18px', color: '#4b5565', letterSpacing: 0.4 }}>APR</span>
            </div>
            <p style={{ fontSize: 17.5, fontWeight: 700, lineHeight: '26px', letterSpacing: 0.1, color: '#121a26' }}>{apr}</p>
          </div>
        </div>
        {/* Loan amount + period */}
        <div style={{ display: 'flex', alignItems: 'center', gap: 12, padding: '0 12px 6px' }}>
          <div style={{ flex: 1, maxWidth: 145.5 }}>
            <p style={{ fontSize: 13.5, fontWeight: 500, lineHeight: '18px', letterSpacing: 0.4, color: '#4b5565' }}>Loan amount</p>
            <p style={{ fontSize: 17.5, fontWeight: 700, lineHeight: '26px', letterSpacing: 0.1, color: '#121a26' }}>{loanAmount}</p>
          </div>
          <div style={{ flex: 1, maxWidth: 145.5, display: 'flex', flexDirection: 'column', alignItems: 'flex-end' }}>
            <p style={{ fontSize: 13.5, fontWeight: 500, lineHeight: '18px', letterSpacing: 0.4, color: '#4b5565' }}>Loan period</p>
            <p style={{ fontSize: 17.5, fontWeight: 700, lineHeight: '26px', letterSpacing: 0.1, color: '#121a26', textAlign: 'right' }}>{loanPeriod}</p>
          </div>
        </div>
        {/* Bottom row: star, execution icon, heart, compare */}
        <div style={{ display: 'flex', alignItems: 'center', gap: 24, padding: '8px 12px 2px' }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
            <img src={A+'icon-star-no-sm.svg'} style={{ width: 18, height: 18 }} alt=""/>
            <span style={{ fontSize: 15.5, fontWeight: 500, lineHeight: '22px', letterSpacing: 0.1, color: '#697586' }}>0.0</span>
          </div>
          <img src={A+'icon-execution-time.svg'} style={{ width: 32, height: 32 }} alt=""/>
          <img src={A+'icon-heart-rounded.svg'} style={{ width: 24, height: 24 }} alt=""/>
          <button style={{
            flex: 1, minHeight: 36, maxHeight: 36, minWidth: 90,
            background: '#0063f5', border: '2px solid rgba(255,255,255,0.12)',
            borderRadius: 8, color: '#fff',
            fontSize: 13.5, fontWeight: 600, letterSpacing: 0.5,
            cursor: 'pointer', overflow: 'hidden'
          }}>Compare</button>
        </div>
      </div>
    </div>
  );
}

function App() {
  return (
    <div className="screen">
      <div className="scroll-content">
        {/* Blue header */}
        <div style={{ background: '#0063f5', minHeight: 82 }}>
          <StatusBarDark />
          <div style={{
            display: 'flex', alignItems: 'flex-end', justifyContent: 'space-between',
            padding: '8px 16px 12px'
          }}>
            <div style={{ minWidth: 32, display: 'flex', alignItems: 'center' }}>
              <img src={A+'chevron-left-white.svg'} style={{ width: 24, height: 24 }} alt="Back"/>
            </div>
            <p style={{
              flex: 1, textAlign: 'center',
              fontSize: 15.5, fontWeight: 600, lineHeight: '22px',
              letterSpacing: 0.25, color: '#fff', height: 22
            }}>Eligible Offers</p>
            <div style={{ width: 32, height: 24, display: 'flex', alignItems: 'center', justifyContent: 'flex-end' }}>
              <img src={A+'icon-home.svg'} style={{ width: 24, height: 24 }} alt="Home"/>
            </div>
          </div>
        </div>

        {/* Not Eligible banner */}
        <div style={{ background: '#0063f5', padding: '8px 24px' }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 0 }}>
            <div style={{ flex: 1, display: 'flex', flexDirection: 'column', gap: 2 }}>
              <p style={{ fontSize: 17.5, fontWeight: 700, lineHeight: '26px', letterSpacing: 0.1, color: '#fff' }}>Not Eligible</p>
              <p style={{ fontSize: 12.5, fontWeight: 500, lineHeight: '18px', letterSpacing: 0.5, color: '#fff' }}>
                You're not eligible for the selected product, but there are other alternative offers!
              </p>
            </div>
            <div style={{ width: 80, height: 80, flexShrink: 0 }}>
              <img src={A+'icon-eligible-warning.svg'} style={{ width: 80, height: 80 }} alt="Not eligible"/>
            </div>
          </div>
        </div>

        {/* Blue rounded section with "Want to know why?" */}
        <div style={{ background: '#f8fafc', position: 'relative', paddingBottom: 24 }}>
          <div style={{
            background: '#0063f5', borderRadius: '0 0 48px 48px',
            overflow: 'hidden', position: 'relative',
            height: 96, marginBottom: -2
          }}>
            {/* Decorative elements */}
            <div style={{ position: 'absolute', left: -6, top: 1, width: 107, height: 107, overflow: 'hidden' }}>
              <div style={{ position: 'relative', width: '100%', height: '100%' }}>
                <div style={{ position: 'absolute', left: 3.03, top: 19.59, width: 101.066, height: 87.485, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                  <div style={{ transform: 'rotate(59.97deg) skewX(-0.06deg)' }}>
                    <div style={{ width: 50.607, height: 87.428, position: 'relative' }}>
                      <img src={A+'deco-rectangle-2379.svg'} style={{ position: 'absolute', inset: '2.77% 0 2.7% 0', width: '100%', height: '100%' }} alt=""/>
                    </div>
                  </div>
                </div>
                <div style={{ position: 'absolute', left: 5.35, top: 12.26, width: 96.341, height: 71.453 }}>
                  <img src={A+'deco-union.svg'} style={{ width: '100%', height: '100%' }} alt=""/>
                </div>
                <div style={{ position: 'absolute', left: 5.35, top: 22.63, width: 48.15, height: 61.319 }}>
                  <img src={A+'deco-mask-group.svg'} style={{ width: '100%', height: '100%' }} alt=""/>
                </div>
                <div style={{ position: 'absolute', left: 9.06, top: 11.93, width: 45.46, height: 32.009 }}>
                  <img src={A+'deco-group-5693.svg'} style={{ width: '100%', height: '100%' }} alt=""/>
                </div>
                <div style={{ position: 'absolute', left: 42.09, top: 15.18, width: 57.232, height: 58.076 }}>
                  <img src={A+'deco-group-5694.svg'} style={{ width: '100%', height: '100%' }} alt=""/>
                </div>
              </div>
            </div>
            <div style={{ position: 'absolute', left: 340, top: 105, width: 72.284, height: 72.284, overflow: 'hidden' }}>
              <img src={A+'deco-group-5495.svg'} style={{ width: '100%', height: '100%' }} alt=""/>
            </div>
            <div style={{ position: 'absolute', left: -29, top: 146, width: 86.284, height: 86.284, overflow: 'hidden' }}>
              <img src={A+'deco-group-5494.svg'} style={{ width: '100%', height: '100%' }} alt=""/>
            </div>
            <div style={{ position: 'absolute', left: 278, top: 16.29, width: 93, height: 93, overflow: 'hidden' }}>
              <img src={A+'deco-group-5497.svg'} style={{ width: '100%', height: '100%' }} alt=""/>
            </div>
          </div>
          {/* Want to know why card */}
          <div style={{ padding: '24px 24px 0', display: 'flex', flexDirection: 'column', gap: 16, alignItems: 'center' }}>
            <div style={{
              background: '#fff', borderRadius: 16, width: '100%',
              display: 'flex', alignItems: 'center', justifyContent: 'space-between',
              padding: '11px 16px', overflow: 'hidden'
            }}>
              <p style={{
                fontSize: 17.5, fontWeight: 500, lineHeight: '26px',
                letterSpacing: 0.5, color: '#121a26',
                overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap',
                width: 273
              }}>Want to know why?</p>
              <img src={A+'chevron-right-card.svg'} style={{ width: 24, height: 24 }} alt=""/>
            </div>
          </div>
        </div>

        {/* Alternative Offers */}
        <div style={{ background: '#f8fafc', padding: '32px 24px', display: 'flex', flexDirection: 'column', gap: 24, alignItems: 'center' }}>
          <p style={{
            fontSize: 23.5, fontWeight: 600, lineHeight: '30px',
            color: '#1d2939', textAlign: 'center', width: '100%'
          }}>Alternative Offers</p>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 20, alignItems: 'flex-start' }}>
            <ProductCard
              title="CEER Foxtron Model B - Car/EV Financing"
              bankLogo={A+'bank-snb-logo.png'}
              apr="99.99%"
              loanAmount="﷼99,999,999.99"
              loanPeriod="999 month"
            />
            <ProductCard
              title="CEER Foxtron Model B - Car/EV Financing"
              bankLogo={A+'bank-alrajhi-logo.png'}
              apr="99.99%"
              loanAmount="﷼99,999,999.99"
              loanPeriod="999 month"
            />
            <ProductCard
              title="Microfinance for Employee & their Family Daily Needs"
              bankLogo={A+'bank-albilad-logo.png'}
              apr="99.99%"
              loanAmount="﷼99,999,999.99"
              loanPeriod="999 month"
            />
          </div>
        </div>

        <HomeBar />
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
