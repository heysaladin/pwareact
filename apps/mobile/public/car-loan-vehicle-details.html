<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Vehicle Details</title>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
  <style>
    html,body,#root{margin:0;padding:0;height:100%;overflow:hidden;background:#fff;}
    *{box-sizing:border-box;}
    button{cursor:pointer;font-family:inherit;}
    .scroll{scrollbar-width:none;overflow-y:auto;}
    .scroll::-webkit-scrollbar{display:none;}
    select{appearance:none;-webkit-appearance:none;}
    input::placeholder{color:#B0B8C6;}
  </style>
</head>
<body>
<div id="root" style="height:100%"></div>
<script type="text/babel">
  const { useState, useRef } = React;
  const C = { brand600:'#0063F5', yellow:'#FFDD33', gray900:'#121A26', gray500:'#697586', gray100:'#EEF1F6', white:'#FFFFFF' };
  const nav = (p) => (window.top||window).location.href = p;

  const MAKES = ['Toyota','Nissan','Hyundai','Kia','Honda','Mercedes-Benz','BMW','Lexus','Mitsubishi','Chevrolet'];
  const MODELS = {
    'Toyota':['Camry','Corolla','Land Cruiser','RAV4','Yaris','Hilux','Fortuner'],
    'Nissan':['Altima','Patrol','Sunny','Kicks','X-Trail','Navara'],
    'Hyundai':['Sonata','Elantra','Tucson','Santa Fe','Palisade'],
    'Kia':['Cerato','Sorento','Sportage','Carnival','Telluride'],
    'Honda':['Accord','Civic','CR-V','HR-V','Pilot'],
    'Mercedes-Benz':['C-Class','E-Class','S-Class','GLE','GLC'],
    'BMW':['3 Series','5 Series','X3','X5','7 Series'],
    'Lexus':['ES 350','LS 500','RX 350','LX 600','GX 460'],
    'Mitsubishi':['Spacestar','Outlander','Eclipse Cross','Pajero','L200'],
    'Chevrolet':['Malibu','Tahoe','Blazer','Captiva','Suburban'],
  };
  const YEARS = ['2025','2024','2023','2022','2021','2020','2019','2018'];
  const TYPES = ['Standard','Premium','Sport','Luxury','GCC Edition','SE','XLE','SR'];

  function StatusBar() {
    return (
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'14px 20px 6px'}}>
        <span style={{fontSize:15,fontWeight:700,color:C.gray900}}>9:41</span>
        <div style={{display:'flex',gap:6,alignItems:'center'}}>
          <svg width="17" height="11" viewBox="0 0 17 11" fill={C.gray900}>
            <rect x="0" y="5" width="3" height="6" rx="0.5" opacity="0.4"/><rect x="4.5" y="3" width="3" height="8" rx="0.5" opacity="0.6"/><rect x="9" y="1.5" width="3" height="9.5" rx="0.5" opacity="0.8"/><rect x="13.5" y="0" width="3" height="11" rx="0.5"/>
          </svg>
          <svg width="16" height="11" viewBox="0 0 16 11" fill={C.gray900} opacity="0.7">
            <path d="M8 8c.9 0 1.6.7 1.6 1.6S8.9 11.2 8 11.2 6.4 10.5 6.4 9.6 7.1 8 8 8z"/>
            <path d="M4.6 5.4C5.6 4.3 6.7 3.7 8 3.7s2.4.6 3.4 1.7l1.3-1.3C11.2 2.6 9.7 2 8 2S4.8 2.6 3.3 4.1l1.3 1.3z" opacity="0.75"/>
            <path d="M1.6 2.5C3.1 1 5.4 0 8 0s4.9 1 6.4 2.5L16 1C14 .4 11.2 0 8 0S2 .4 0 1l1.6 1.5z" opacity="0.5"/>
          </svg>
          <div style={{display:'flex',alignItems:'center',gap:2}}>
            <div style={{width:22,height:11,border:'1.5px solid rgba(0,0,0,0.35)',borderRadius:3,padding:1.5}}>
              <div style={{background:C.gray900,borderRadius:1.5,height:'100%',width:'72%'}}/>
            </div>
          </div>
        </div>
      </div>
    );
  }

  /* Custom picker sheet */
  function PickerSheet({ title, options, value, onSelect, onClose }) {
    return (
      <div style={{position:'fixed',inset:0,zIndex:100,display:'flex',flexDirection:'column',justifyContent:'flex-end'}}>
        <div onClick={onClose} style={{flex:1,background:'rgba(0,0,0,0.4)'}}/>
        <div style={{background:C.white,borderRadius:'20px 20px 0 0',overflow:'hidden',maxHeight:'60%',display:'flex',flexDirection:'column'}}>
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'16px 20px',borderBottom:`1px solid ${C.gray100}`,flexShrink:0}}>
            <span style={{fontSize:15,fontWeight:600,color:C.gray900}}>{title}</span>
            <button onClick={onClose} style={{background:'none',border:'none',fontSize:20,color:C.gray500,padding:'0 4px',lineHeight:1}}>×</button>
          </div>
          <div className="scroll" style={{flex:1}}>
            {options.map(opt => (
              <button key={opt} onClick={() => { onSelect(opt); onClose(); }} style={{
                display:'block',width:'100%',textAlign:'left',padding:'14px 20px',border:'none',
                background: value===opt ? '#EBF3FF' : C.white,
                color: value===opt ? C.brand600 : C.gray900,
                fontSize:15, fontWeight: value===opt ? 600 : 400,
                borderBottom:`1px solid ${C.gray100}`,
              }}>{opt}</button>
            ))}
          </div>
        </div>
      </div>
    );
  }

  function SelectField({ label, value, placeholder, onTap, required }) {
    return (
      <div style={{marginBottom:12}}>
        <label style={{display:'block',fontSize:12.5,color:C.gray500,marginBottom:6,fontWeight:500}}>
          {label}{required && <span style={{color:'#E53935'}}> *</span>}
        </label>
        <button onClick={onTap} style={{
          width:'100%',display:'flex',alignItems:'center',justifyContent:'space-between',
          padding:'13px 14px',background:'#F8FAFC',border:`1.5px solid ${value ? '#D0D5DD' : '#E2E8F0'}`,
          borderRadius:12,textAlign:'left',
        }}>
          <span style={{fontSize:15,color: value ? C.gray900 : '#B0B8C6',fontWeight: value ? 500 : 400}}>{value || placeholder}</span>
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <path d="M4 6l4 4 4-4" stroke={C.gray500} strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
          </svg>
        </button>
      </div>
    );
  }

  function App() {
    const [isNew, setIsNew] = useState(true);
    const [make, setMake] = useState('');
    const [model, setModel] = useState('');
    const [year, setYear] = useState('');
    const [type, setType] = useState('');
    const [price, setPrice] = useState('');
    const [sheet, setSheet] = useState(null); // null | 'make'|'model'|'year'|'type'

    const canContinue = make && model && year && price;

    const openSheet = (which) => setSheet(which);
    const closeSheet = () => setSheet(null);

    return (
      <div style={{height:'100%',display:'flex',flexDirection:'column',background:C.white,fontFamily:'"SF Arabic",system-ui,-apple-system,Arial,sans-serif',position:'relative'}}>
        <StatusBar/>

        {/* Header */}
        <div style={{display:'flex',alignItems:'center',gap:12,padding:'4px 16px 12px'}}>
          <button onClick={() => nav('/car-loan')} style={{background:'none',border:'none',padding:'8px 4px',display:'flex',alignItems:'center'}}>
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
              <path d="M12.5 16.5L6 10l6.5-6.5" stroke={C.gray900} strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round"/>
            </svg>
          </button>
          <h1 style={{margin:0,fontSize:18,fontWeight:700,color:C.gray900}}>Vehicle Details</h1>
        </div>

        {/* Form */}
        <div className="scroll" style={{flex:1,padding:'8px 20px 120px'}}>

          {/* New/Used toggle */}
          <div style={{marginBottom:20}}>
            <label style={{display:'block',fontSize:12.5,color:C.gray500,marginBottom:8,fontWeight:500}}>Is this a new car?</label>
            <div style={{display:'flex',gap:8}}>
              {[{label:'Yes, New Car',val:true},{label:'No, Used Car',val:false}].map(opt => (
                <button key={opt.label} onClick={() => setIsNew(opt.val)} style={{
                  flex:1,padding:'11px 8px',fontSize:13.5,fontWeight: isNew===opt.val ? 600 : 400,
                  border:`1.5px solid ${isNew===opt.val ? C.brand600 : '#E2E8F0'}`,
                  borderRadius:10,
                  background: isNew===opt.val ? '#EBF3FF' : C.white,
                  color: isNew===opt.val ? C.brand600 : C.gray500,
                }}>
                  {opt.label}
                </button>
              ))}
            </div>
          </div>

          <SelectField label="Make" value={make} placeholder="Select make" required onTap={() => openSheet('make')}/>
          <SelectField label="Model" value={model} placeholder="Select model" required onTap={() => make && openSheet('model')}/>
          <SelectField label="Year" value={year} placeholder="Select year" required onTap={() => openSheet('year')}/>
          <SelectField label="Type" value={type} placeholder="Select type" onTap={() => openSheet('type')}/>

          {/* Price */}
          <div style={{marginBottom:12}}>
            <label style={{display:'block',fontSize:12.5,color:C.gray500,marginBottom:6,fontWeight:500}}>
              Vehicle Price <span style={{color:'#E53935'}}>*</span>
            </label>
            <div style={{display:'flex',alignItems:'center',gap:8,padding:'13px 14px',background:'#F8FAFC',border:'1.5px solid #D0D5DD',borderRadius:12}}>
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1124.14 1256.39" fill={C.gray500} style={{width:14,height:14,flexShrink:0}}>
                <path d="M699.62,1113.02h0c-20.06,44.48-33.32,92.75-38.4,143.37l424.51-90.24c20.06-44.47,33.31-92.75,38.4-143.37l-424.51,90.24Z"/>
                <path d="M1085.73,895.8c20.06-44.47,33.32-92.75,38.4-143.37l-330.68,70.33v-135.2l292.27-62.11c20.06-44.47,33.32-92.75,38.4-143.37l-330.68,70.27V66.13c-50.67,28.45-95.67,66.32-132.25,110.99v403.35l-132.25,28.11V0c-50.67,28.44-95.67,66.32-132.25,110.99v525.69l-295.91,62.88c-20.06,44.47-33.33,92.75-38.42,143.37l334.33-71.05v170.26l-358.3,76.14c-20.06,44.47-33.32,92.75-38.4,143.37l375.04-79.7c30.53-6.35,56.77-24.4,73.83-49.24l68.78-101.97v-.02c7.14-10.55,11.3-23.27,11.3-36.97v-149.98l132.25-28.11v270.4l424.53-90.28Z"/>
              </svg>
              <input type="text" value={price} onChange={e => {
                const raw = e.target.value.replace(/[^0-9]/g,'');
                const n = parseInt(raw||'0',10);
                setPrice(n ? n.toLocaleString('en-US') : '');
              }} placeholder="0" style={{flex:1,border:'none',background:'transparent',fontSize:15,fontWeight:500,color:C.gray900,outline:'none'}}/>
            </div>
          </div>
        </div>

        {/* Continue */}
        <div style={{position:'absolute',bottom:0,left:0,right:0,padding:'16px 20px 36px',background:C.white,borderTop:`1px solid ${C.gray100}`}}>
          <button onClick={() => canContinue && nav('/car-loan/offers')} style={{
            width:'100%',background: canContinue ? C.brand600 : '#D0D5DD',border:'none',
            borderRadius:14,padding:'16px',fontSize:16,fontWeight:600,color:C.white,
          }}>Continue</button>
        </div>

        {/* Picker sheets */}
        {sheet==='make' && <PickerSheet title="Select Make" options={MAKES} value={make} onSelect={v=>{setMake(v);setModel('');setType('');}} onClose={closeSheet}/>}
        {sheet==='model' && <PickerSheet title="Select Model" options={MODELS[make]||[]} value={model} onSelect={setModel} onClose={closeSheet}/>}
        {sheet==='year' && <PickerSheet title="Select Year" options={YEARS} value={year} onSelect={setYear} onClose={closeSheet}/>}
        {sheet==='type' && <PickerSheet title="Select Type" options={TYPES} value={type} onSelect={setType} onClose={closeSheet}/>}
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
