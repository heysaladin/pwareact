<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Tamawal Offers</title>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
  <style>
    html,body,#root{margin:0;padding:0;height:100%;overflow:hidden;background:#fff;}
    *{box-sizing:border-box;}
    button{cursor:pointer;font-family:inherit;}
    .scroll{scrollbar-width:none;overflow-y:auto;}
    .scroll::-webkit-scrollbar{display:none;}
    input::placeholder{color:#B0B8C6;}
  </style>
</head>
<body>
<div id="root" style="height:100%"></div>
<script type="text/babel">
  const { useState } = React;
  const C = { brand600:'#0063F5', yellow:'#FFDD33', gray900:'#121A26', gray600:'#4B5565', gray500:'#697586', gray200:'#E3E8EF', gray100:'#EEF1F6', gray50:'#F8FAFC', white:'#FFFFFF' };
  const nav = (p) => (window.top||window).location.href = p;

  const SAR = ({ size=13 }) => (
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1124.14 1256.39" fill="currentColor" style={{width:size,height:size,flexShrink:0,display:'inline-block'}}>
      <path d="M699.62,1113.02h0c-20.06,44.48-33.32,92.75-38.4,143.37l424.51-90.24c20.06-44.47,33.31-92.75,38.4-143.37l-424.51,90.24Z"/>
      <path d="M1085.73,895.8c20.06-44.47,33.32-92.75,38.4-143.37l-330.68,70.33v-135.2l292.27-62.11c20.06-44.47,33.32-92.75,38.4-143.37l-330.68,70.27V66.13c-50.67,28.45-95.67,66.32-132.25,110.99v403.35l-132.25,28.11V0c-50.67,28.44-95.67,66.32-132.25,110.99v525.69l-295.91,62.88c-20.06,44.47-33.33,92.75-38.42,143.37l334.33-71.05v170.26l-358.3,76.14c-20.06,44.47-33.32,92.75-38.4,143.37l375.04-79.7c30.53-6.35,56.77-24.4,73.83-49.24l68.78-101.97v-.02c7.14-10.55,11.3-23.27,11.3-36.97v-149.98l132.25-28.11v270.4l424.53-90.28Z"/>
    </svg>
  );

  const offers = [
    { id:1, name:'New Car Loan', bank:'Bank AlBilad', bankColor:'#1a5276', bankAbbr:'BA', aprFrom:3.49, loanAmt:150000, period:60, stars:0 },
    { id:2, name:'Spacestar MT Diesel Loan', bank:'Bank AlBilad', bankColor:'#117a65', bankAbbr:'BA', aprFrom:3.99, loanAmt:99999999.99, period:999, stars:0 },
    { id:3, name:'Microfinance for Employee & their Family Daily Needs', bank:'Bank AlBilad', bankColor:'#6c3483', bankAbbr:'BA', aprFrom:99.99, loanAmt:99999999.99, period:999, stars:0 },
    { id:4, name:'Car Murabaha Finance', bank:'Al Rajhi Bank', bankColor:'#1a5276', bankAbbr:'AR', aprFrom:2.99, loanAmt:200000, period:84, stars:4.5 },
  ];

  function StatusBar() {
    return (
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'14px 20px 6px'}}>
        <span style={{fontSize:15,fontWeight:700,color:C.gray900}}>9:41</span>
        <div style={{display:'flex',gap:6,alignItems:'center'}}>
          <svg width="17" height="11" viewBox="0 0 17 11" fill={C.gray900}><rect x="0" y="5" width="3" height="6" rx="0.5" opacity="0.4"/><rect x="4.5" y="3" width="3" height="8" rx="0.5" opacity="0.6"/><rect x="9" y="1.5" width="3" height="9.5" rx="0.5" opacity="0.8"/><rect x="13.5" y="0" width="3" height="11" rx="0.5"/></svg>
          <svg width="16" height="11" viewBox="0 0 16 11" fill={C.gray900} opacity="0.7"><path d="M8 8c.9 0 1.6.7 1.6 1.6S8.9 11.2 8 11.2 6.4 10.5 6.4 9.6 7.1 8 8 8z"/><path d="M4.6 5.4C5.6 4.3 6.7 3.7 8 3.7s2.4.6 3.4 1.7l1.3-1.3C11.2 2.6 9.7 2 8 2S4.8 2.6 3.3 4.1l1.3 1.3z" opacity="0.75"/><path d="M1.6 2.5C3.1 1 5.4 0 8 0s4.9 1 6.4 2.5L16 1C14 .4 11.2 0 8 0S2 .4 0 1l1.6 1.5z" opacity="0.5"/></svg>
          <div style={{display:'flex',alignItems:'center',gap:2}}><div style={{width:22,height:11,border:'1.5px solid rgba(0,0,0,0.35)',borderRadius:3,padding:1.5}}><div style={{background:C.gray900,borderRadius:1.5,height:'100%',width:'72%'}}/></div></div>
        </div>
      </div>
    );
  }

  function Stars({ val }) {
    return (
      <div style={{display:'flex',alignItems:'center',gap:2}}>
        {[1,2,3,4,5].map(i=>(
          <svg key={i} width="14" height="14" viewBox="0 0 12 12" fill={i<=Math.round(val)?C.yellow:'#E2E8F0'}>
            <path d="M6 1l1.24 2.51 2.76.4-2 1.95.47 2.74L6 7.25 3.53 8.6 4 5.86 2 3.91l2.76-.4z"/>
          </svg>
        ))}
        <span style={{fontSize:12,color:C.gray500,marginLeft:2}}>{val.toFixed(1)}</span>
      </div>
    );
  }

  function OfferCard({ offer }) {
    const [compared, setCompared] = useState(false);
    const [liked, setLiked] = useState(false);
    return (
      <div style={{background:C.white,border:`1px solid ${C.gray100}`,borderRadius:16,overflow:'hidden',boxShadow:'0 1px 2px rgba(10,13,18,0.05)'}}>

        {/* Product name row */}
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'14px 16px 12px',borderBottom:`1px solid ${C.gray100}`}}>
          <p style={{margin:0,fontSize:15.5,fontWeight:700,color:C.gray900,flex:1,lineHeight:1.35,letterSpacing:0.1,paddingRight:8}}>{offer.name}</p>
          <button onClick={()=>nav('/car-loan/car-details')} style={{background:'none',border:'none',padding:'4px',display:'flex',alignItems:'center',flexShrink:0}}>
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M7.5 4.5L13 10l-5.5 5.5" stroke={C.gray900} strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/></svg>
          </button>
        </div>

        {/* Bank + APR row */}
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'10px 16px',borderBottom:`1px solid ${C.gray100}`}}>
          <div style={{display:'flex',alignItems:'center',gap:8}}>
            <div style={{width:40,height:28,borderRadius:6,background:offer.bankColor,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
              <span style={{fontSize:10,fontWeight:700,color:C.white}}>{offer.bankAbbr}</span>
            </div>
            <span style={{fontSize:13,fontWeight:500,color:C.gray600}}>{offer.bank}</span>
          </div>
          <div style={{textAlign:'right'}}>
            <div style={{display:'flex',alignItems:'center',gap:4,justifyContent:'flex-end'}}>
              <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><circle cx="7" cy="7" r="6" stroke={C.gray500} strokeWidth="1.2"/><path d="M7 4v3.5l2 1.5" stroke={C.gray500} strokeWidth="1.2" strokeLinecap="round"/></svg>
              <span style={{fontSize:11,color:C.gray500,fontWeight:500}}>APR from</span>
            </div>
            <span style={{fontSize:17.5,fontWeight:700,color:C.brand600,display:'block'}}>{offer.aprFrom}%</span>
          </div>
        </div>

        {/* Loan amount + period row */}
        <div style={{display:'flex',justifyContent:'space-between',padding:'10px 16px',borderBottom:`1px solid ${C.gray100}`}}>
          <div>
            <p style={{margin:'0 0 3px',fontSize:11.5,color:C.gray500,fontWeight:500}}>Loan amount up to</p>
            <div style={{display:'flex',alignItems:'center',gap:3,color:C.gray900}}>
              <SAR size={13}/>
              <span style={{fontSize:15.5,fontWeight:700}}>{offer.loanAmt.toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:2})}</span>
            </div>
          </div>
          <div style={{textAlign:'right'}}>
            <p style={{margin:'0 0 3px',fontSize:11.5,color:C.gray500,fontWeight:500}}>Loan period for</p>
            <span style={{fontSize:15.5,fontWeight:700,color:C.gray900}}>{offer.period} month</span>
          </div>
        </div>

        {/* Stars + Tamawal button */}
        <div style={{display:'flex',alignItems:'center',gap:12,padding:'10px 16px',borderBottom:`1px solid ${C.gray100}`}}>
          <Stars val={offer.stars}/>
          {/* Lightning bolt */}
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M11 2L4 11h7l-2 7 9-11h-7l2-7z" fill={C.yellow} stroke={C.yellow} strokeWidth="0.5" strokeLinejoin="round"/></svg>
          <button onClick={()=>nav('/car-loan/car-details')} style={{flex:1,background:C.brand600,border:'none',borderRadius:10,padding:'10px 16px',fontSize:14,fontWeight:600,color:C.white,letterSpacing:0.25}}>
            Tamawal
          </button>
        </div>

        {/* Compare + heart */}
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'10px 16px'}}>
          <button onClick={()=>setCompared(!compared)} style={{display:'flex',alignItems:'center',gap:6,background:'none',border:`1px solid ${compared?C.brand600:C.gray200}`,borderRadius:8,padding:'7px 14px',color:compared?C.brand600:C.gray600,fontSize:13,fontWeight:500}}>
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
              <path d="M15.3125 12.7083C14.1044 12.7083 13.125 13.6877 13.125 14.8958C13.125 16.104 14.1044 17.0833 15.3125 17.0833C16.5206 17.0833 17.5 16.104 17.5 14.8958C17.5 13.6877 16.5206 12.7083 15.3125 12.7083ZM15.3125 12.7083V9.57552C15.3112 8.57925 14.9151 7.6241 14.2109 6.91927L11.25 3.95833M14.375 3.95833H11.25V7.08333M4.6875 7.70833C5.89562 7.70833 6.875 6.72896 6.875 5.52083C6.875 4.31271 5.89562 3.33333 4.6875 3.33333C3.47938 3.33333 2.5 4.31271 2.5 5.52083C2.5 6.72896 3.47938 7.70833 4.6875 7.70833ZM4.6875 7.70833V10.8411C4.68885 11.8374 5.08495 12.7926 5.78906 13.4974L8.75 16.4583M5.625 16.4583H8.75V13.3333" stroke="currentColor" strokeWidth="1.66667" strokeLinecap="round" strokeLinejoin="round"/>
            </svg>
            Compare
          </button>
          <button onClick={()=>setLiked(!liked)} style={{background:'none',border:'none',padding:4,display:'flex'}}>
            <svg width="24" height="24" viewBox="0 0 24 24" fill={liked?'#EF4444':'none'} xmlns="http://www.w3.org/2000/svg">
              <path d="M16.1111 3C19.6333 3 22 6.3525 22 9.48C22 15.8138 12.1778 21 12 21C11.8222 21 2 15.8138 2 9.48C2 6.3525 4.36667 3 7.88889 3C9.91111 3 11.2333 4.02375 12 4.92375C12.7667 4.02375 14.0889 3 16.1111 3Z" stroke={liked?'#EF4444':'#4B5565'} strokeWidth="1.66667" strokeLinecap="round" strokeLinejoin="round"/>
            </svg>
          </button>
        </div>
      </div>
    );
  }

  function ChangeForm({ onClose }) {
    const [salary, setSalary] = useState('12,000');
    const [hasLoans, setHasLoans] = useState(false);
    return (
      <div style={{background:C.white,padding:'12px 24px 20px',borderTop:`1px solid ${C.gray100}`}}>
        <div style={{marginBottom:16}}>
          <label style={{display:'block',fontSize:12.5,color:C.gray600,marginBottom:6}}>Salary <span style={{color:'#E53935'}}>*</span></label>
          <div style={{background:'#F8FAFC',border:'1.5px solid #E2E8F0',borderRadius:12,padding:'12px 14px',display:'flex',alignItems:'center',gap:8}}>
            <SAR size={16}/>
            <input type="text" placeholder="0" value={salary} onChange={e=>{const raw=e.target.value.replace(/[^0-9]/g,'');const n=parseInt(raw||'0',10);setSalary(n?n.toLocaleString('en-US'):'');}} style={{flex:1,border:'none',background:'transparent',fontSize:16,fontWeight:600,color:C.gray900,fontFamily:'inherit',outline:'none'}}/>
            <span style={{fontSize:13,color:C.gray600,flexShrink:0}}>Monthly</span>
          </div>
        </div>
        <div style={{marginBottom:16}}>
          <label style={{display:'block',fontSize:12.5,color:C.gray600,marginBottom:10}}>Do you have active loans? <span style={{color:'#E53935'}}>*</span></label>
          <div style={{display:'flex',gap:10}}>
            {[{l:'Yes',v:true},{l:'No',v:false}].map(o=>(
              <button key={o.l} onClick={()=>setHasLoans(o.v)} style={{flex:1,padding:11,fontSize:14,fontWeight:hasLoans===o.v?600:400,border:`1.5px solid ${hasLoans===o.v?C.brand600:'#E2E8F0'}`,borderRadius:10,background:hasLoans===o.v?'#EBF3FF':C.white,color:hasLoans===o.v?C.brand600:C.gray600,fontFamily:'inherit'}}>{o.l}</button>
            ))}
          </div>
        </div>
        <div style={{backgroundImage:'url(/bg-yellow.png)',backgroundSize:'cover',backgroundPosition:'left center',borderRadius:16,padding:'16px 18px 16px 140px',marginBottom:16,minHeight:88,display:'flex',flexDirection:'column',justifyContent:'center'}}>
          <p style={{margin:'0 0 4px',fontSize:12,color:'#5C4200',fontWeight:500}}>You may be eligible to take a loan up to</p>
          <div style={{display:'flex',alignItems:'center',gap:5,marginBottom:4}}><SAR size={20}/><span style={{fontSize:26,fontWeight:700,color:C.gray900}}>183,552</span></div>
          <p style={{margin:0,fontSize:12,color:'#5C4200'}}>for <strong>60 Months</strong></p>
        </div>
        <button onClick={onClose} style={{width:'100%',background:C.brand600,border:'none',borderRadius:14,padding:16,fontSize:16,fontWeight:600,color:C.white,fontFamily:'inherit'}}>Update</button>
      </div>
    );
  }

  function App() {
    const [expanded, setExpanded] = useState(false);

    return (
      <div style={{height:'100%',display:'flex',flexDirection:'column',background:'#F8FAFC',fontFamily:'"SF Arabic",system-ui,-apple-system,Arial,sans-serif',position:'relative'}}>

        {/* Header */}
        <div style={{background:C.white,flexShrink:0}}>
          <StatusBar/>
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'4px 16px 10px'}}>
            <button onClick={()=>nav('/car-loan/inventory')} style={{background:'none',border:'none',padding:'8px 4px',minWidth:48,display:'flex',alignItems:'center'}}>
              <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M12.5 16.5L6 10l6.5-6.5" stroke={C.gray900} strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round"/></svg>
            </button>
            <span style={{fontSize:15.5,fontWeight:600,color:'#202A39',letterSpacing:0.25}}>Tamawal offers</span>
            <button style={{background:'none',border:'none',padding:'8px 4px',minWidth:48,display:'flex',alignItems:'center',justifyContent:'flex-end'}}>
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                <path d="M18.375 15.25C16.9253 15.25 15.75 16.4253 15.75 17.875C15.75 19.3247 16.9253 20.5 18.375 20.5C19.8247 20.5 21 19.3247 21 17.875C21 16.4253 19.8247 15.25 18.375 15.25ZM18.375 15.25V11.4906C18.3734 10.2951 17.8981 9.14893 17.0531 8.30313L13.5 4.75M17.25 4.75H13.5V8.5M5.625 9.25C7.07475 9.25 8.25 8.07475 8.25 6.625C8.25 5.17525 7.07475 4 5.625 4C4.17525 4 3 5.17525 3 6.625C3 8.07475 4.17525 9.25 5.625 9.25ZM5.625 9.25V13.0094C5.62662 14.2049 6.10194 15.3511 6.94687 16.1969L10.5 19.75M6.75 19.75H10.5V16" stroke={C.gray900} strokeWidth="1.66667" strokeLinecap="round" strokeLinejoin="round"/>
              </svg>
            </button>
          </div>

          {/* Register interest banner */}
          <div style={{margin:'0 16px 10px',border:`1.5px solid ${C.brand600}`,borderRadius:12,padding:'12px 14px',display:'flex',alignItems:'center',justifyContent:'space-between',background:C.white}}>
            <span style={{fontSize:13.5,color:C.brand600,fontWeight:500}}>Register interest offers</span>
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M3 8h10M9 4.5l3.5 3.5L9 11.5" stroke={C.brand600} strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round"/></svg>
          </div>
        </div>

        {/* Preliminary search row */}
        <div style={{background:C.white,flexShrink:0}}>
          <div style={{padding:'8px 16px'}}>
            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}>
              <span style={{fontSize:15.5,fontWeight:700,color:C.gray900,letterSpacing:0.1}}>Preliminary search</span>
              <button onClick={()=>setExpanded(e=>!e)} style={{display:'flex',alignItems:'center',gap:10,background:'none',border:'none',padding:0}}>
                <span style={{fontSize:12.5,fontWeight:500,color:C.gray600,letterSpacing:0.5}}>Change</span>
                <div style={{border:`1px solid ${C.gray200}`,borderRadius:34,padding:8,display:'flex',alignItems:'center',justifyContent:'center'}}>
                  <svg width="16" height="16" viewBox="0 0 16 16" fill="none" style={{transform:expanded?'rotate(180deg)':'rotate(0deg)',transition:'transform 0.2s'}}>
                    <path d="M4 6l4 4 4-4" stroke={C.gray600} strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round"/>
                  </svg>
                </div>
              </button>
            </div>
          </div>
          {expanded && <ChangeForm onClose={()=>setExpanded(false)}/>}
        </div>

        {/* Scrollable list */}
        <div className="scroll" style={{flex:1,padding:'12px 16px 24px'}}>

          {/* Eligibility row */}
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:12}}>
            <p style={{margin:0,fontSize:13,fontWeight:500,color:'#98A2B3',letterSpacing:0.4,lineHeight:1.5}}>
              You may be eligible for{' '}
              <span style={{color:'#1D2939'}}>6 of 6</span>
              {'\n'}Products for{' '}
              <span style={{color:'#1D2939'}}>Personal loans</span>
            </p>
            <div style={{display:'flex',gap:16,alignItems:'center',flexShrink:0,paddingLeft:12}}>
              <button style={{background:'none',border:'none',padding:0,display:'flex'}}>
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
                  <path d="M13.5 15.75L17.25 19.5L21 15.75" stroke="#697586" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
                  <path d="M17.25 10.5V19.5" stroke="#697586" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
                  <path d="M4.5 12H11.25" stroke="#697586" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
                  <path d="M4.5 6H17.25" stroke="#697586" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
                  <path d="M4.5 18H9.75" stroke="#697586" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
                </svg>
              </button>
              <button style={{background:'none',border:'none',padding:0,display:'flex'}}>
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
                  <path d="M3.94507 4.5H20.0513C20.1968 4.50005 20.3391 4.5424 20.461 4.62191C20.5828 4.70141 20.6789 4.81463 20.7375 4.94777C20.7961 5.08092 20.8148 5.22824 20.7911 5.37179C20.7675 5.51533 20.7026 5.64891 20.6045 5.75625L14.4451 12.5344C14.3169 12.6716 14.2464 12.8529 14.2482 13.0406V18.3469C14.2493 18.4715 14.219 18.5944 14.16 18.7042C14.101 18.814 14.0153 18.9072 13.9107 18.975L10.9107 20.9719C10.7982 21.046 10.6677 21.0884 10.5331 21.0947C10.3985 21.101 10.2647 21.0709 10.1458 21.0076C10.0268 20.9443 9.92713 20.8501 9.85717 20.7349C9.78721 20.6198 9.74956 20.4879 9.7482 20.3531V13.0406C9.75001 12.8529 9.67952 12.6716 9.55132 12.5344L3.39195 5.75625C3.29375 5.64891 3.22889 5.51533 3.20527 5.37179C3.18164 5.22824 3.20028 5.08092 3.2589 4.94777C3.31753 4.81463 3.41361 4.70141 3.53544 4.62191C3.65727 4.5424 3.7996 4.50005 3.94507 4.5Z" stroke="#697586" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
                </svg>
              </button>
            </div>
          </div>

          {/* Offer cards */}
          <div style={{display:'flex',flexDirection:'column',gap:12}}>
            {offers.map(o => <OfferCard key={o.id} offer={o}/>)}
          </div>
        </div>

        {/* Home indicator */}
        <div style={{background:C.white,height:34,display:'flex',alignItems:'flex-end',justifyContent:'center',paddingBottom:8,flexShrink:0}}>
          <div style={{width:135,height:5,background:'#000',borderRadius:999}}/>
        </div>

      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
