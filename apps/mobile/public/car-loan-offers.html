<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Tamawal Offers</title>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
  <style>
    html,body,#root{margin:0;padding:0;height:100%;overflow:hidden;background:#fff;}
    *{box-sizing:border-box;}
    button{cursor:pointer;font-family:inherit;}
    .scroll{scrollbar-width:none;overflow-y:auto;}
    .scroll::-webkit-scrollbar{display:none;}
  </style>
</head>
<body>
<div id="root" style="height:100%"></div>
<script type="text/babel">
  const { useState } = React;
  const C = { brand600:'#0063F5', yellow:'#FFDD33', gray900:'#121A26', gray500:'#697586', gray100:'#EEF1F6', white:'#FFFFFF' };
  const nav = (p) => (window.top||window).location.href = p;

  const SAR = ({ size=11 }) => (
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1124.14 1256.39" fill="currentColor" style={{width:size,height:size,flexShrink:0,display:'inline-block'}}>
      <path d="M699.62,1113.02h0c-20.06,44.48-33.32,92.75-38.4,143.37l424.51-90.24c20.06-44.47,33.31-92.75,38.4-143.37l-424.51,90.24Z"/>
      <path d="M1085.73,895.8c20.06-44.47,33.32-92.75,38.4-143.37l-330.68,70.33v-135.2l292.27-62.11c20.06-44.47,33.32-92.75,38.4-143.37l-330.68,70.27V66.13c-50.67,28.45-95.67,66.32-132.25,110.99v403.35l-132.25,28.11V0c-50.67,28.44-95.67,66.32-132.25,110.99v525.69l-295.91,62.88c-20.06,44.47-33.33,92.75-38.42,143.37l334.33-71.05v170.26l-358.3,76.14c-20.06,44.47-33.32,92.75-38.4,143.37l375.04-79.7c30.53-6.35,56.77-24.4,73.83-49.24l68.78-101.97v-.02c7.14-10.55,11.3-23.27,11.3-36.97v-149.98l132.25-28.11v270.4l424.53-90.28Z"/>
    </svg>
  );

  const offers = [
    { id:1, bank:'Al Rajhi Bank', initials:'AR', bg:'#1a5276', monthly:1843, rateFrom:1.75, rateTo:3.00, loanAmt:108500, tenor:60, tag:'Best Rate', tagColor:'#079455', stars:4.5 },
    { id:2, bank:'Riyad Bank', initials:'RB', bg:'#1e8449', monthly:1920, rateFrom:2.10, rateTo:3.50, loanAmt:108500, tenor:60, tag:null, tagColor:null, stars:4.2 },
    { id:3, bank:'Saudi Fransi', initials:'SF', bg:'#6c3483', monthly:1975, rateFrom:2.25, rateTo:4.00, loanAmt:108500, tenor:60, tag:null, tagColor:null, stars:3.9 },
    { id:4, bank:'Bank AlBilad', initials:'BA', bg:'#117a65', monthly:1860, rateFrom:1.90, rateTo:3.25, loanAmt:108500, tenor:60, tag:'Low Monthly', tagColor:C.brand600, stars:4.0 },
  ];

  function StatusBar() {
    return (
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'14px 20px 6px'}}>
        <span style={{fontSize:15,fontWeight:700,color:C.gray900}}>9:41</span>
        <div style={{display:'flex',gap:6,alignItems:'center'}}>
          <svg width="17" height="11" viewBox="0 0 17 11" fill={C.gray900}><rect x="0" y="5" width="3" height="6" rx="0.5" opacity="0.4"/><rect x="4.5" y="3" width="3" height="8" rx="0.5" opacity="0.6"/><rect x="9" y="1.5" width="3" height="9.5" rx="0.5" opacity="0.8"/><rect x="13.5" y="0" width="3" height="11" rx="0.5"/></svg>
          <svg width="16" height="11" viewBox="0 0 16 11" fill={C.gray900} opacity="0.7"><path d="M8 8c.9 0 1.6.7 1.6 1.6S8.9 11.2 8 11.2 6.4 10.5 6.4 9.6 7.1 8 8 8z"/><path d="M4.6 5.4C5.6 4.3 6.7 3.7 8 3.7s2.4.6 3.4 1.7l1.3-1.3C11.2 2.6 9.7 2 8 2S4.8 2.6 3.3 4.1l1.3 1.3z" opacity="0.75"/><path d="M1.6 2.5C3.1 1 5.4 0 8 0s4.9 1 6.4 2.5L16 1C14 .4 11.2 0 8 0S2 .4 0 1l1.6 1.5z" opacity="0.5"/></svg>
          <div style={{display:'flex',alignItems:'center',gap:2}}><div style={{width:22,height:11,border:'1.5px solid rgba(0,0,0,0.35)',borderRadius:3,padding:1.5}}><div style={{background:C.gray900,borderRadius:1.5,height:'100%',width:'72%'}}/></div></div>
        </div>
      </div>
    );
  }

  function Stars({ val }) {
    return (
      <div style={{display:'flex',alignItems:'center',gap:2}}>
        {[1,2,3,4,5].map(i=>(
          <svg key={i} width="11" height="11" viewBox="0 0 12 12" fill={i<=Math.round(val)?C.yellow:'#E2E8F0'}>
            <path d="M6 1l1.24 2.51 2.76.4-2 1.95.47 2.74L6 7.25 3.53 8.6 4 5.86 2 3.91l2.76-.4z"/>
          </svg>
        ))}
        <span style={{fontSize:11,color:C.gray500,marginLeft:2}}>{val.toFixed(1)}</span>
      </div>
    );
  }

  function OfferCard({ offer }) {
    const [compared, setCompared] = useState(false);
    return (
      <div style={{background:C.white,border:`1px solid ${C.gray100}`,borderRadius:16,marginBottom:12,padding:'16px',boxShadow:'0 2px 8px rgba(0,0,0,0.04)'}}>
        {/* Bank row */}
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:12}}>
          <div style={{display:'flex',alignItems:'center',gap:10}}>
            <div style={{width:36,height:36,borderRadius:10,background:offer.bg,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
              <span style={{fontSize:11,fontWeight:700,color:C.white}}>{offer.initials}</span>
            </div>
            <div>
              <p style={{margin:'0 0 2px',fontSize:13.5,fontWeight:600,color:C.gray900}}>{offer.bank}</p>
              {offer.tag && <span style={{background:offer.tagColor,color:C.white,fontSize:10,fontWeight:600,borderRadius:4,padding:'2px 6px'}}>{offer.tag}</span>}
            </div>
          </div>
          <Stars val={offer.stars}/>
        </div>

        {/* Metrics */}
        <div style={{display:'flex',justifyContent:'space-between',padding:'12px 0',borderTop:`1px solid ${C.gray100}`,borderBottom:`1px solid ${C.gray100}`,marginBottom:12}}>
          <div>
            <p style={{margin:'0 0 3px',fontSize:11,color:C.gray500}}>Rate from</p>
            <span style={{fontSize:14,fontWeight:700,color:C.gray900}}>{offer.rateFrom}% — {offer.rateTo}%</span>
          </div>
          <div style={{textAlign:'center'}}>
            <p style={{margin:'0 0 3px',fontSize:11,color:C.gray500}}>Tenor</p>
            <span style={{fontSize:14,fontWeight:700,color:C.gray900}}>{offer.tenor} mo</span>
          </div>
          <div style={{textAlign:'right'}}>
            <p style={{margin:'0 0 3px',fontSize:11,color:C.gray500}}>Monthly</p>
            <div style={{display:'flex',alignItems:'center',gap:3,color:C.brand600,justifyContent:'flex-end'}}>
              <SAR size={12}/>
              <span style={{fontSize:14,fontWeight:700}}>{offer.monthly.toLocaleString('en-US')}</span>
            </div>
          </div>
        </div>

        {/* Actions */}
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}>
          <button onClick={()=>setCompared(!compared)} style={{background:'none',border:'none',display:'flex',alignItems:'center',gap:6,color:compared?C.brand600:C.gray500,fontSize:12,padding:0}}>
            <div style={{width:14,height:14,border:`1.5px solid ${compared?C.brand600:C.gray500}`,borderRadius:3,background:compared?C.brand600:'transparent',display:'flex',alignItems:'center',justifyContent:'center'}}>
              {compared&&<svg width="9" height="9" viewBox="0 0 9 9" fill="none"><path d="M1.5 4.5l2 2 4-4" stroke={C.white} strokeWidth="1.2" strokeLinecap="round" strokeLinejoin="round"/></svg>}
            </div>
            Compare
          </button>
          <button onClick={()=>nav('/car-loan/product-details')} style={{background:C.brand600,border:'none',borderRadius:10,padding:'10px 22px',fontSize:13.5,fontWeight:600,color:C.white}}>
            Tamawal
          </button>
        </div>
      </div>
    );
  }

  function App() {
    const [tab, setTab] = useState('Products');
    return (
      <div style={{height:'100%',display:'flex',flexDirection:'column',background:'#F8FAFC',fontFamily:'"SF Arabic",system-ui,-apple-system,Arial,sans-serif',position:'relative'}}>
        <div style={{background:C.white,flexShrink:0}}>
          <StatusBar/>
          {/* Header */}
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'4px 16px 8px'}}>
            <button onClick={()=>nav('/car-loan/vehicle-details')} style={{background:'none',border:'none',padding:'8px 4px'}}>
              <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M12.5 16.5L6 10l6.5-6.5" stroke={C.gray900} strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round"/></svg>
            </button>
            <span style={{fontSize:16,fontWeight:700,color:C.gray900}}>Tamawal offers</span>
            <button style={{background:'none',border:'none',padding:'8px 4px'}}>
              <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M3 5h14M6 10h8M9 15h2" stroke={C.gray900} strokeWidth="1.5" strokeLinecap="round"/></svg>
            </button>
          </div>

          {/* Register interest banner */}
          <div style={{margin:'0 16px 8px',background:'#EBF3FF',borderRadius:12,padding:'10px 14px',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
            <span style={{fontSize:13,color:C.brand600,fontWeight:500}}>Register interest offers</span>
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M3 8h10M9 4.5l3.5 3.5L9 11.5" stroke={C.brand600} strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round"/></svg>
          </div>

          {/* Tabs */}
          <div style={{display:'flex',borderTop:`1px solid ${C.gray100}`,padding:'0 16px'}}>
            {['Products','Personal loans'].map(t=>{
              const on=tab===t;
              return <button key={t} onClick={()=>setTab(t)} style={{padding:'11px 12px',fontSize:13.5,fontWeight:on?700:400,color:on?C.brand600:C.gray500,border:'none',borderBottom:on?`2.5px solid ${C.yellow}`:'2.5px solid transparent',background:'none',flexShrink:0}}>{t}</button>;
            })}
          </div>
        </div>

        <div className="scroll" style={{flex:1,padding:'12px 16px 24px'}}>
          {/* Preliminary search label */}
          <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:12}}>
            <div style={{flex:1,height:1,background:C.gray100}}/>
            <span style={{fontSize:11.5,color:C.gray500,fontWeight:500}}>Preliminary search</span>
            <div style={{flex:1,height:1,background:C.gray100}}/>
          </div>

          {offers.map(o=><OfferCard key={o.id} offer={o}/>)}
        </div>
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
