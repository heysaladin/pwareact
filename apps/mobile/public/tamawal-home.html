<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tamawal Home</title>
  <link rel="stylesheet" href="/kit.css" />
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
  <style>
    html, body, #root { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #00317A; }
    * { box-sizing: border-box; }
    button { cursor: pointer; }
    .tab-scroll { scrollbar-width: none; }
    .tab-scroll::-webkit-scrollbar { display: none; }
    .content-scroll { scrollbar-width: none; }
    .content-scroll::-webkit-scrollbar { display: none; }
  </style>
</head>
<body>
  <div id="root" style="height:100%"></div>
  <script type="text/babel">
    const { useState } = React;

    const isEn = new URLSearchParams(location.search).get('lang') === 'en';
    const isAr = !isEn;

    const C = {
      brand900: '#00317A',
      brand800: '#0041A3',
      brand600: '#0063F5',
      yellow:   '#FFDD33',
      white:    '#FFFFFF',
      gray900:  '#121A26',
      gray500:  '#697586',
      gray100:  '#EEF1F6',
    };

    /* ── Figma asset URLs (localhost:3845) ── */
    const A = {
      logomark:    'http://localhost:3845/assets/3d7e52ff9b1262980b552f1cd74590cb00057883.svg',
      logoText:    'http://localhost:3845/assets/6b620f2cef0ce01cd5bb7f1f618869b7db2c9616.svg',
      bell:        'http://localhost:3845/assets/2e3b66156f2a61730d3cbbeab7af72810b004f43.svg',
      homeOff:     'http://localhost:3845/assets/391a94075e50b72c39e9fd45e99a5a9c37c6d25a.svg',
      homeOn:      'http://localhost:3845/assets/5d4c1d83a04f38f2eb333f7dcec7af6ee33beb33.svg',
      news:        'http://localhost:3845/assets/82e2ad2a394729aae8e81f7e07bd312dbc82316a.svg',
      mag:         'http://localhost:3845/assets/49715f2b0844d8b2d6ffe68c48a17c276decd807.svg',
      shine:       'http://localhost:3845/assets/f327b4cf6b4acd830afdb0431a1765353b0596ff.svg',
      orders:      'http://localhost:3845/assets/f15f7e999bcf2f061694fdd1ab853a8e12418338.svg',
      loans:       'http://localhost:3845/assets/8355acdf91d6bcf1f49f3dc675e9b80bbb53021b.svg',
      star:        'http://localhost:3845/assets/11ae7f101aefecde536a80dc812be87227635de6.svg',
      bankLogo:    'http://localhost:3845/assets/3d7298d457288a86727f71510afcc4bd82655a4e.png',
      sar:         'http://localhost:3845/assets/91ba90864c9229b4429231874e2ff187b2186120.svg',
    };

    /* ── i18n ── */
    const TX = {
      ar: {
        personalLoan:   'تمويل شخصي',
        carLoan:        'تمويل سيارات',
        realEstate:     'تمويل عقاري',
        tamawalNow:     'تموّل الآن',
        interest:       'الاهتمام',
        likes:          'المفضلة',
        saved:          'الحفظ',
        eligible:       'التأهيل',
        offerTitle:     'تمويل أصغر لتلبية احتياجات الموظفين ...',
        aprLabel:       'معدل سنوي (APR) من',
        installLabel:   'قسط شهري من',
        savedLabel:     'وفرت',
        details:        'تفاصيل',
        home:           'الرئيسية',
        news:           'الاخبار',
        search:         'بحث',
        orders:         'الطلبات',
        financing:      'التمويل',
        lang:           'عربي',
      },
      en: {
        personalLoan:   'Personal Loan',
        carLoan:        'Car Loan',
        realEstate:     'Real Estate',
        tamawalNow:     'Tamawal now',
        interest:       'Interest',
        likes:          'Likes',
        saved:          'Saved',
        eligible:       'Eligible',
        offerTitle:     'Microfinance for Employee and ...',
        aprLabel:       'APR from',
        installLabel:   'Installment from',
        savedLabel:     'You saved',
        details:        'Details',
        home:           'Home',
        news:           'News',
        search:         'Search',
        orders:         'Orders',
        financing:      'Loans',
        lang:           'En',
      },
    };
    const T = TX[isAr ? 'ar' : 'en'];

    /* ── SVG card illustrations ── */
    function BuildingIllus() {
      return (
        <svg width="110" height="110" viewBox="0 0 110 110" fill="none">
          <rect x="18" y="48" width="74" height="60" rx="4" fill="rgba(255,255,255,0.07)"/>
          <path d="M8 54L55 18L102 54" stroke="rgba(255,255,255,0.25)" strokeWidth="2.5" strokeLinecap="round"/>
          <rect x="28" y="56" width="54" height="52" rx="3" fill="rgba(255,255,255,0.05)"/>
          <rect x="35" y="64" width="14" height="13" rx="2" fill="rgba(255,255,255,0.18)"/>
          <rect x="60" y="64" width="14" height="13" rx="2" fill="rgba(255,255,255,0.18)"/>
          <rect x="35" y="84" width="14" height="13" rx="2" fill="rgba(255,255,255,0.18)"/>
          <rect x="60" y="84" width="14" height="13" rx="2" fill="rgba(255,255,255,0.18)"/>
          <circle cx="86" cy="34" r="13" fill="rgba(255,221,51,0.3)"/>
          <circle cx="91" cy="28" r="9"  fill="rgba(255,221,51,0.5)"/>
          <circle cx="96" cy="22" r="6"  fill="rgba(255,221,51,0.7)"/>
        </svg>
      );
    }

    function WalletIllus() {
      return (
        <svg width="130" height="130" viewBox="0 0 130 130" fill="none">
          {/* Coins stack */}
          <ellipse cx="85" cy="38" rx="19" ry="7.5" fill="rgba(255,221,51,0.95)"/>
          <rect x="66" y="30.5" width="38" height="16" fill="rgba(200,160,0,0.6)"/>
          <ellipse cx="85" cy="30.5" rx="19" ry="7.5" fill="#FFDD33"/>
          <ellipse cx="70" cy="26" rx="16" ry="6.5" fill="rgba(255,221,51,0.85)"/>
          <rect x="54" y="19.5" width="32" height="13" fill="rgba(200,160,0,0.5)"/>
          <ellipse cx="70" cy="19.5" rx="16" ry="6.5" fill="rgba(255,220,40,0.95)"/>
          <ellipse cx="56" cy="18" rx="13" ry="5.5" fill="rgba(255,221,51,0.7)"/>
          <rect x="43" y="12.5" width="26" height="11" fill="rgba(200,160,0,0.4)"/>
          <ellipse cx="56" cy="12.5" rx="13" ry="5.5" fill="rgba(255,210,30,0.85)"/>
          {/* Wallet body */}
          <rect x="20" y="62" width="90" height="56" rx="10" fill="rgba(255,255,255,0.88)"/>
          <rect x="20" y="62" width="90" height="22" rx="10" fill="rgba(255,255,255,0.7)"/>
          {/* Clasp */}
          <rect x="82" y="69" width="20" height="14" rx="7" fill="rgba(255,221,51,0.85)"/>
          <circle cx="92" cy="76" r="4.5" fill="rgba(255,255,255,0.9)"/>
        </svg>
      );
    }

    function CarIllus() {
      return (
        <svg width="110" height="110" viewBox="0 0 110 110" fill="none">
          <rect x="8"  y="52" width="94" height="30" rx="6" fill="rgba(255,255,255,0.1)"/>
          <path d="M16 52L28 34H82L94 52" fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.18)" strokeWidth="1"/>
          <rect x="32" y="36" width="46" height="16" rx="2.5" fill="rgba(255,255,255,0.13)"/>
          {/* Wheels */}
          <circle cx="29" cy="82" r="12" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.28)" strokeWidth="2"/>
          <circle cx="29" cy="82" r="6"  fill="rgba(255,255,255,0.14)"/>
          <circle cx="81" cy="82" r="12" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.28)" strokeWidth="2"/>
          <circle cx="81" cy="82" r="6"  fill="rgba(255,255,255,0.14)"/>
          {/* Headlights */}
          <rect x="88" y="60" width="11" height="7" rx="2.5" fill="rgba(255,221,51,0.7)"/>
          <rect x="11" y="60" width="11" height="7" rx="2.5" fill="rgba(255,200,0,0.3)"/>
          {/* Coins */}
          <circle cx="64" cy="26" r="11" fill="rgba(255,221,51,0.75)"/>
          <circle cx="77" cy="18" r="8"  fill="rgba(255,221,51,0.6)"/>
          <circle cx="52" cy="20" r="6"  fill="rgba(255,221,51,0.5)"/>
        </svg>
      );
    }

    /* ── Status bar ── */
    function StatusBar() {
      const end = (
        <div style={{display:'flex', gap:6, alignItems:'center'}}>
          <svg width="17" height="11" viewBox="0 0 17 11" fill={C.white}>
            <rect x="0"    y="5"   width="3" height="6"  rx="0.5" opacity="0.4"/>
            <rect x="4.5"  y="3"   width="3" height="8"  rx="0.5" opacity="0.6"/>
            <rect x="9"    y="1.5" width="3" height="9.5" rx="0.5" opacity="0.8"/>
            <rect x="13.5" y="0"   width="3" height="11" rx="0.5"/>
          </svg>
          <svg width="16" height="11" viewBox="0 0 16 11" fill={C.white} opacity="0.85">
            <path d="M8 8c.9 0 1.6.7 1.6 1.6S8.9 11.2 8 11.2 6.4 10.5 6.4 9.6 7.1 8 8 8z"/>
            <path d="M4.6 5.4C5.6 4.3 6.7 3.7 8 3.7s2.4.6 3.4 1.7l1.3-1.3C11.2 2.6 9.7 2 8 2S4.8 2.6 3.3 4.1l1.3 1.3z" opacity="0.75"/>
            <path d="M1.6 2.5C3.1 1 5.4 0 8 0s4.9 1 6.4 2.5L16 1C14 .4 11.2 0 8 0S2 .4 0 1l1.6 1.5z" opacity="0.5"/>
          </svg>
          <div style={{display:'flex', alignItems:'center', gap:2}}>
            <div style={{width:22, height:11, border:'1.5px solid rgba(255,255,255,0.55)', borderRadius:3, padding:1.5}}>
              <div style={{background:C.white, borderRadius:1.5, height:'100%', width:'72%'}}/>
            </div>
            <div style={{width:2, height:5, background:'rgba(255,255,255,0.55)', borderRadius:'0 1px 1px 0'}}/>
          </div>
        </div>
      );
      return (
        <div style={{display:'flex', alignItems:'center', justifyContent:'space-between', padding:'14px 20px 6px', color:C.white}}>
          {isAr ? end : <span style={{fontSize:15, fontWeight:700}}>9:41</span>}
          {isAr ? <span style={{fontSize:15, fontWeight:700}}>9:41</span> : end}
        </div>
      );
    }

    /* ── Avatar circle ── */
    function Avatar() {
      return (
        <div style={{position:'relative', flexShrink:0}}>
          <div style={{
            width:40, height:40, borderRadius:'50%', background:'#EBF3FF',
            display:'flex', alignItems:'center', justifyContent:'center',
          }}>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
              <circle cx="12" cy="8" r="4" fill={C.brand800}/>
              <path d="M4 20c0-4.4 3.6-8 8-8s8 3.6 8 8" stroke={C.brand800} strokeWidth="2" strokeLinecap="round"/>
            </svg>
          </div>
          <div style={{
            position:'absolute', bottom:-2, [isAr ? 'right' : 'left']:-2,
            width:16, height:16, borderRadius:'50%', background:C.white,
            display:'flex', alignItems:'center', justifyContent:'center',
          }}>
            <img src={A.logomark} alt="" style={{width:11, height:11}}/>
          </div>
        </div>
      );
    }

    /* ── Header ── */
    function Header() {
      const notifBtn = (
        <div style={{position:'relative', width:40, height:40,
          border:`1px solid ${C.brand800}`, borderRadius:'50%',
          display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0}}>
          <img src={A.bell} alt="" style={{width:22, height:22}}/>
          <div style={{
            position:'absolute', top:-5, [isAr ? 'right' : 'left']:-5,
            background:C.yellow, border:`2px solid ${C.brand900}`,
            borderRadius:'50%', minWidth:16, height:16, padding:'0 3px',
            fontSize:9, fontWeight:700, color:C.gray900,
            display:'flex', alignItems:'center', justifyContent:'center',
          }}>99+</div>
        </div>
      );

      const langBadge = (
        <button onClick={() => { location.href = isAr ? '?lang=en' : '?'; }} style={{
          border:`1px solid ${C.brand800}`, borderRadius:999,
          padding:'5px 10px', fontSize:12, color:C.white, fontWeight:600, flexShrink:0,
          background:'transparent', cursor:'pointer', fontFamily:'inherit',
        }}>{T.lang}</button>
      );

      const logo = (
        <div style={{display:'flex', alignItems:'center', gap:5}}>
          <img src={A.logomark} alt="" style={{width:26, height:26}}/>
          <img src={A.logoText} alt="Tamawal" style={{height:13, width:'auto'}}/>
        </div>
      );

      const pointsAndAvatar = (
        <div style={{display:'flex', alignItems:'center', gap:8, flexDirection: isAr ? 'row-reverse' : 'row'}}>
          <span style={{fontSize:12.5, color:C.white, fontWeight:600, letterSpacing:0.4}}>99,999</span>
          <Avatar/>
        </div>
      );

      return (
        <div style={{
          display:'flex', alignItems:'center', justifyContent:'space-between',
          padding:'6px 24px 12px',
        }}>
          {isAr ? (
            <>
              {/* Arabic: avatar+points | logo | lang+bell */}
              <div style={{display:'flex', alignItems:'center', gap:8, flexDirection:'row-reverse'}}>
                <Avatar/>
                <span style={{fontSize:12.5, color:C.white, fontWeight:600, letterSpacing:0.4}}>99,999</span>
              </div>
              {logo}
              <div style={{display:'flex', alignItems:'center', gap:6, flexDirection:'row-reverse'}}>
                {langBadge}
                {notifBtn}
              </div>
            </>
          ) : (
            <>
              {/* English: bell+En | logo | points+avatar */}
              <div style={{display:'flex', alignItems:'center', gap:6}}>
                {notifBtn}
                {langBadge}
              </div>
              {logo}
              {pointsAndAvatar}
            </>
          )}
        </div>
      );
    }

    /* ── Loan cards carousel ── */
    function CardCarousel() {
      const cards = [
        { label: T.realEstate,   bg: 'linear-gradient(145deg,#0041A3,#1E3A6E)', illus: <BuildingIllus/>, w:178, h:205 },
        { label: T.personalLoan, bg: 'linear-gradient(145deg,#0063F5,#0041A3)', illus: <WalletIllus/>,   w:216, h:216, active:true },
        { label: T.carLoan,      bg: 'linear-gradient(145deg,#163080,#0A1F5C)', illus: <CarIllus/>,      w:178, h:205 },
      ];
      return (
        /* overflow:hidden clips the partial side cards */
        <div style={{overflow:'hidden', paddingBottom:16}}>
          <div style={{
            display:'flex', alignItems:'flex-end', gap:16,
            direction:'ltr',                 /* always LTR for visual card layout */
            transform:'translateX(-115px)',  /* centers the 216px middle card in 375px screen */
            paddingTop:16,
          }}>
            {cards.map((c, i) => (
              <div key={i} style={{display:'flex', flexDirection:'column', alignItems:'center', gap:8, flexShrink:0}}>
                <div style={{
                  width:c.w, height:c.h,
                  background:c.bg, borderRadius:16, overflow:'hidden',
                  display:'flex', alignItems:'center', justifyContent:'center',
                  boxShadow: c.active ? '0 8px 24px rgba(0,0,0,0.45)' : '0 2px 8px rgba(0,0,0,0.25)',
                  border: c.active ? '1.5px solid rgba(255,255,255,0.15)' : 'none',
                }}>
                  {c.illus}
                </div>
                <span style={{fontSize: c.active ? 16 : 13, fontWeight: c.active ? 700 : 500, color:C.white}}>
                  {c.label}
                </span>
              </div>
            ))}
          </div>
        </div>
      );
    }

    /* ── Offer card ── */
    function OfferCard() {
      const flip = isAr ? 'row-reverse' : 'row';
      return (
        <div style={{
          background:C.white, borderRadius:16, border:`1px solid ${C.gray100}`,
          padding:16, boxShadow:'0 2px 12px rgba(0,0,0,0.06)',
        }}>
          {/* Title row */}
          <div style={{display:'flex', justifyContent:'space-between', alignItems:'flex-start', flexDirection:flip, marginBottom:12}}>
            <div style={{flex:1}}>
              <p style={{
                margin:'0 0 8px', fontWeight:700, fontSize:14,
                color:C.gray900, lineHeight:1.5,
                textAlign: isAr ? 'right' : 'left',
              }}>{T.offerTitle}</p>
              <div style={{display:'flex', alignItems:'center', gap:6, flexDirection:flip}}>
                <img src={A.bankLogo} alt="Bank Albilad" style={{height:22, objectFit:'contain', maxWidth:80}}
                  onError={e => { e.target.style.display='none'; }}/>
                <span style={{fontSize:12, color:C.gray500}}>Bank Albilad</span>
              </div>
            </div>
            {/* Flash icon */}
            <div style={{
              width:44, height:44, borderRadius:'50%', background:'#EBF3FF', flexShrink:0,
              display:'flex', alignItems:'center', justifyContent:'center',
              marginLeft: isAr ? 0 : 10, marginRight: isAr ? 10 : 0,
            }}>
              <svg width="24" height="24" viewBox="0 0 24 24" fill={C.brand600}>
                <path d="M13 2L4.5 13.5H11L10 22L20.5 10.5H14L13 2Z"/>
              </svg>
            </div>
          </div>

          {/* APR + Installment */}
          <div style={{display:'flex', justifyContent:'space-between', flexDirection:flip, marginBottom:8}}>
            <div>
              <p style={{margin:'0 0 3px', fontSize:11.5, color:C.gray500}}>{T.installLabel}</p>
              <div style={{display:'flex', alignItems:'center', gap:4, flexDirection:flip}}>
                <img src={A.sar} alt="﷼" style={{width:14, height:14}} onError={e=>e.target.style.display='none'}/>
                <span style={{fontSize:16, fontWeight:700, color:C.gray900}}>99,999.99</span>
              </div>
            </div>
            <div style={{textAlign: isAr ? 'left' : 'right'}}>
              <p style={{margin:'0 0 3px', fontSize:11.5, color:C.gray500}}>{T.aprLabel}</p>
              <div style={{display:'flex', alignItems:'center', gap:4, justifyContent: isAr ? 'flex-start' : 'flex-end', flexDirection:flip}}>
                <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
                  <circle cx="7" cy="7" r="6.5" stroke={C.gray500} strokeWidth="1"/>
                  <text x="7" y="10.5" fontSize="7" fill={C.gray500} textAnchor="middle" fontWeight="600">i</text>
                </svg>
                <span style={{fontSize:16, fontWeight:700, color:C.gray900}}>%99.99</span>
              </div>
            </div>
          </div>

          {/* You saved */}
          <div style={{display:'flex', alignItems:'center', gap:8, flexDirection:flip, marginBottom:14}}>
            <span style={{fontSize:12, color:C.gray500}}>{T.savedLabel}</span>
            <div style={{display:'flex', alignItems:'center', gap:6, flexDirection:flip}}>
              <div style={{display:'flex', alignItems:'center', gap:3, flexDirection:flip}}>
                <img src={A.sar} alt="﷼" style={{width:12, height:12}} onError={e=>e.target.style.display='none'}/>
                <span style={{fontSize:13, color:C.gray500}}>9,999.99</span>
              </div>
              <span style={{
                background:C.brand600, color:C.white,
                borderRadius:6, padding:'2px 7px', fontSize:12, fontWeight:700,
              }}>-86%</span>
            </div>
          </div>

          <div style={{height:1, background:C.gray100, marginBottom:12}}/>

          {/* Footer */}
          <div style={{display:'flex', alignItems:'center', justifyContent:'space-between', flexDirection:flip}}>
            <div style={{display:'flex', alignItems:'center', gap:5, flexDirection:flip}}>
              <img src={A.star} alt="★" style={{width:18, height:18}} onError={e=>e.target.style.display='none'}/>
              <span style={{fontWeight:600, fontSize:14, color:C.gray900}}>5.0</span>
            </div>
            <div style={{display:'flex', alignItems:'center', gap:12, flexDirection:flip}}>
              <button style={{background:'none', border:'none', padding:4}}>
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke={C.gray500} strokeWidth="2">
                  <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
                </svg>
              </button>
              <button style={{
                background:C.brand600, color:C.white, border:'none', borderRadius:12,
                padding:'10px 20px', fontSize:14, fontWeight:600, fontFamily:'inherit',
                display:'flex', alignItems:'center', gap:7, flexDirection:flip,
              }}>
                {T.details}
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke={C.white}
                  strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"
                  style={{transform: isAr ? 'rotate(180deg)' : 'none'}}>
                  <path d="M5 12h14M12 5l7 7-7 7"/>
                </svg>
              </button>
            </div>
          </div>
        </div>
      );
    }

    /* ── Bottom nav ── */
    function BottomNav({ active, onNav }) {
      const items = isAr
        ? [
            { id:'loans',  label:T.financing, icon:A.loans },
            { id:'orders', label:T.orders,    icon:A.orders },
            { id:'search', label:T.search,    isSearch:true },
            { id:'news',   label:T.news,      icon:A.news },
            { id:'home',   label:T.home,      icon:A.homeOff, activeIcon:A.homeOn },
          ]
        : [
            { id:'home',   label:T.home,      icon:A.homeOff, activeIcon:A.homeOn },
            { id:'news',   label:T.news,      icon:A.news },
            { id:'search', label:T.search,    isSearch:true },
            { id:'orders', label:T.orders,    icon:A.orders },
            { id:'loans',  label:T.financing, icon:A.loans },
          ];

      return (
        <div style={{
          position:'absolute', bottom:0, left:0, right:0, zIndex:10,
          background:C.white, borderTop:`1px solid ${C.gray100}`,
          borderRadius:'32px 32px 0 0',
          boxShadow:'0 -2px 12px rgba(0,0,0,0.07)',
        }}>
          <div style={{display:'flex', alignItems:'flex-end', justifyContent:'space-around', padding:'0 12px'}}>
            {items.map(item => {
              const on = active === item.id;
              if (item.isSearch) return (
                <button key={item.id} onClick={() => onNav(item.id)} style={{
                  display:'flex', flexDirection:'column', alignItems:'center', gap:4,
                  background:'none', border:'none', flex:1, padding:'0 4px',
                }}>
                  <div style={{
                    width:68, height:68, borderRadius:'50%', background:C.brand600,
                    display:'flex', alignItems:'center', justifyContent:'center',
                    marginBottom:-10, marginTop:-24,
                    boxShadow:`0 4px 20px rgba(0,99,245,0.45)`,
                    position:'relative',
                  }}>
                    <img src={A.mag}   alt="" style={{width:42, height:42, position:'absolute'}}/>
                    <img src={A.shine} alt="" style={{width:26, height:26, position:'absolute'}}/>
                  </div>
                  <span style={{fontSize:12.5, fontWeight:500, color:C.gray500, marginTop:14, paddingBottom:2}}>{item.label}</span>
                </button>
              );
              return (
                <button key={item.id} onClick={() => onNav(item.id)} style={{
                  display:'flex', flexDirection:'column', alignItems:'center', gap:3,
                  background:'none', border:'none', flex:1, padding:'12px 4px 6px',
                  position:'relative',
                }}>
                  {on && <div style={{position:'absolute', top:8, width:16, height:3, background:C.yellow, borderRadius:999}}/>}
                  <div style={{marginTop: on ? 6 : 0}}>
                    <img src={on && item.activeIcon ? item.activeIcon : item.icon} alt="" style={{width:20, height:20}}/>
                  </div>
                  <span style={{fontSize:12.5, fontWeight:500, color: on ? C.brand600 : C.gray500}}>{item.label}</span>
                </button>
              );
            })}
          </div>
          <div style={{height:24}}/>
        </div>
      );
    }

    /* ── Root ── */
    function TamawalHome() {
      const [activeTab, setActiveTab] = useState('now');
      const [activeNav, setActiveNav] = useState('home');

      const tabs = isAr
        ? [
            { id:'now',      label:T.tamawalNow },
            { id:'interest', label:T.interest },
            { id:'likes',    label:T.likes },
            { id:'saved',    label:T.saved },
            { id:'eligible', label:T.eligible },
          ]
        : [
            { id:'now',      label:T.tamawalNow },
            { id:'interest', label:T.interest },
            { id:'likes',    label:T.likes },
            { id:'saved',    label:T.saved },
          ];

      return (
        <div dir={isAr ? 'rtl' : 'ltr'} style={{
          height:'100vh', display:'flex', flexDirection:'column',
          background:C.white, overflow:'hidden', position:'relative',
          fontFamily: isAr
            ? '"SF Arabic", system-ui, -apple-system, Arial, sans-serif'
            : '"SF Pro Text", system-ui, -apple-system, Arial, sans-serif',
        }}>

          {/* ── Upper dark-blue section ── */}
          <div style={{background:C.brand900, flexShrink:0}}>
            <StatusBar/>
            <Header/>
            <CardCarousel/>
          </div>

          {/* ── White lower section ── */}
          <div style={{flex:1, background:C.white, display:'flex', flexDirection:'column', overflow:'hidden', marginTop:4}}>

            {/* Tabs */}
            <div className="tab-scroll" style={{
              display:'flex', padding:'0 16px',
              borderBottom:`1px solid ${C.gray100}`,
              overflowX:'auto', flexShrink:0,
            }}>
              {tabs.map(tab => {
                const on = activeTab === tab.id;
                return (
                  <button key={tab.id} onClick={() => setActiveTab(tab.id)} style={{
                    padding:'14px 10px 11px', fontSize:14, whiteSpace:'nowrap',
                    fontWeight: on ? 700 : 400,
                    color: on ? C.brand600 : C.gray500,
                    borderTop:'none', borderLeft:'none', borderRight:'none',
                    borderBottom: on ? `2.5px solid ${C.yellow}` : '2.5px solid transparent',
                    background:'none', fontFamily:'inherit', flexShrink:0, cursor:'pointer',
                  }}>{tab.label}</button>
                );
              })}
            </div>

            {/* Content */}
            <div className="content-scroll" style={{flex:1, overflowY:'auto', padding:'14px 16px 130px'}}>
              <OfferCard/>
            </div>
          </div>

          <BottomNav active={activeNav} onNav={setActiveNav}/>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<TamawalHome/>);
  </script>
</body>
</html>
