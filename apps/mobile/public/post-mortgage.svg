<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 375 500" width="375" height="500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#001f6e"/>
      <stop offset="50%" stop-color="#003cb3"/>
      <stop offset="100%" stop-color="#0055e0"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0063F5" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="375" height="500" fill="url(#bg)"/>

  <!-- Top gold accent -->
  <rect x="0" y="0" width="375" height="5" fill="#f5c842"/>

  <!-- Glow circle top right -->
  <circle cx="340" cy="60" r="140" fill="url(#glow)"/>

  <!-- House icon -->
  <g transform="translate(144, 68)">
    <!-- House roof -->
    <polyline points="44,58 44,10 87,10 87,58" fill="none" stroke="white" stroke-width="0" opacity="0"/>
    <polygon points="44,42 87,42 87,10 44,10" fill="white" fill-opacity="0"/>
    <!-- Main house shape -->
    <path d="M10 45 L43.5 10 L77 45 L77 90 L10 90 Z" fill="white" fill-opacity="0.15" stroke="white" stroke-width="2" stroke-linejoin="round"/>
    <!-- Door -->
    <rect x="32" y="65" width="22" height="25" rx="3" fill="white" fill-opacity="0.3"/>
    <!-- Window -->
    <rect x="20" y="54" width="14" height="12" rx="2" fill="white" fill-opacity="0.3"/>
    <rect x="52" y="54" width="14" height="12" rx="2" fill="white" fill-opacity="0.3"/>
    <!-- Chimney -->
    <rect x="56" y="16" width="10" height="18" rx="2" fill="white" fill-opacity="0.2"/>
  </g>

  <!-- Arabic text -->
  <text x="187" y="228" font-family="'SF Arabic', 'Segoe UI', Arial, sans-serif" font-size="44" font-weight="800" fill="white" text-anchor="middle" direction="rtl">بيتك يبدأ</text>
  <text x="187" y="278" font-family="'SF Arabic', 'Segoe UI', Arial, sans-serif" font-size="44" font-weight="800" fill="white" text-anchor="middle" direction="rtl">من تموّل</text>

  <text x="187" y="320" font-family="'SF Arabic', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="400" fill="white" fill-opacity="0.7" text-anchor="middle" direction="rtl">التمويل العقاري المناسب لك</text>

  <!-- Divider -->
  <rect x="145" y="342" width="85" height="2" rx="1" fill="white" fill-opacity="0.2"/>

  <!-- CTA pill -->
  <rect x="127" y="358" width="121" height="36" rx="18" fill="white" fill-opacity="0.12" stroke="white" stroke-opacity="0.3" stroke-width="1"/>
  <text x="187" y="381" font-family="'SF Arabic', 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="600" fill="white" text-anchor="middle" direction="rtl">قدّم واعرف أهليتك</text>

  <!-- Bottom branding -->
  <rect x="0" y="430" width="375" height="70" fill="black" fill-opacity="0.25"/>

  <text x="32" y="474" font-family="'SF Arabic', 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="700" fill="white" direction="rtl">تموّل</text>
  <text x="32" y="490" font-family="Arial, sans-serif" font-size="11" fill="white" fill-opacity="0.55">Tamawal®</text>

  <text x="340" y="468" font-family="'SF Arabic', 'Segoe UI', Arial, sans-serif" font-size="9" fill="white" fill-opacity="0.55" text-anchor="end" direction="rtl">خاضع لرقابة وإشراف</text>
  <text x="340" y="482" font-family="'SF Arabic', 'Segoe UI', Arial, sans-serif" font-size="9" fill="white" fill-opacity="0.55" text-anchor="end" direction="rtl">البنك المركزي السعودي</text>
  <text x="340" y="494" font-family="Arial, sans-serif" font-size="9" fill="white" fill-opacity="0.4" text-anchor="end">Saudi Central Bank</text>
</svg>
