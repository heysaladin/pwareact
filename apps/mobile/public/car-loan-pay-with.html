<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>Pay With</title>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { background: #fff; font-family: -apple-system, 'SF Pro Text', sans-serif; overflow-x: hidden; }
  :root {
    --brand-600: #0063f5;
    --gray-50: #f8fafc;
    --gray-100: #eef1f6;
    --gray-200: #e3e8ef;
    --gray-300: #cdd4df;
    --gray-400: #9aa4b2;
    --gray-500: #697586;
    --gray-600: #4b5565;
    --gray-800: #202a39;
    --gray-900: #121a26;
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">

function DarkStatusBar() {
  return (
    <div style={{height:38,position:'relative',overflow:'hidden',width:'100%'}}>
      <div style={{position:'absolute',right:14.67,top:'50%',transform:'translateY(-50%)',display:'flex',alignItems:'center',gap:6}}>
        <svg width="17" height="11" viewBox="0 0 17 11" fill="white">
          <rect x="0" y="5" width="3" height="6" rx="0.5" opacity="0.4"/><rect x="4.5" y="3" width="3" height="8" rx="0.5" opacity="0.6"/><rect x="9" y="1.5" width="3" height="9.5" rx="0.5" opacity="0.8"/><rect x="13.5" y="0" width="3" height="11" rx="0.5"/>
        </svg>
        <svg width="16" height="11" viewBox="0 0 16 11" fill="white">
          <path d="M8 8c.9 0 1.6.7 1.6 1.6S8.9 11.2 8 11.2 6.4 10.5 6.4 9.6 7.1 8 8 8z"/>
          <path d="M4.6 5.4C5.6 4.3 6.7 3.7 8 3.7s2.4.6 3.4 1.7l1.3-1.3C11.2 2.6 9.7 2 8 2S4.8 2.6 3.3 4.1l1.3 1.3z" opacity="0.75"/>
          <path d="M1.6 2.5C3.1 1 5.4 0 8 0s4.9 1 6.4 2.5L16 1C14 .4 11.2 0 8 0S2 .4 0 1l1.6 1.5z" opacity="0.5"/>
        </svg>
        <div style={{display:'flex',alignItems:'center'}}>
          <div style={{width:22,height:11,border:'1.5px solid rgba(255,255,255,0.5)',borderRadius:3,padding:1.5}}>
            <div style={{background:'white',borderRadius:1.5,height:'100%',width:'72%'}}/>
          </div>
        </div>
      </div>
      <div style={{position:'absolute',left:33,top:'50%',transform:'translateY(-50%)'}}>
        <span style={{fontSize:15,fontWeight:700,color:'white',lineHeight:'11px'}}>9:41</span>
      </div>
    </div>
  );
}

function App() {
  return (
    <div style={{width:'100%',height:'100vh',display:'flex',flexDirection:'column',position:'relative',overflow:'hidden'}}>
      {/* Dark overlay top area */}
      <div style={{flex:1,background:'#0d131c',opacity:0.5,position:'absolute',top:0,left:0,right:0,bottom:'300px'}}/>
      <div style={{position:'absolute',top:0,left:0,right:0}}>
        <DarkStatusBar/>
      </div>

      {/* Bottom sheet */}
      <div style={{position:'absolute',bottom:0,left:0,right:0,background:'white',borderRadius:'24px 24px 0 0',paddingTop:12,paddingBottom:0}}>
        {/* Drag handle */}
        <div style={{display:'flex',justifyContent:'center',marginBottom:12}}>
          <div style={{width:48,height:4,background:'#9aa4b2',borderRadius:999}}/>
        </div>
        {/* Title */}
        <p style={{fontSize:23.5,color:'var(--gray-600)',textAlign:'center',marginBottom:20,fontWeight:500}}>Pay with</p>

        {/* Apple Pay button */}
        <div style={{padding:'0 20px',marginBottom:12}}>
          <button style={{width:'100%',background:'#000',border:'none',borderRadius:8,padding:'8px 12px',display:'flex',alignItems:'center',justifyContent:'space-between',cursor:'pointer'}}>
            <img src="/car-loan-assets/apple-pay-dark.svg" style={{width:48,height:24,objectFit:'contain'}} alt="Apple Pay logo"/>
            <div style={{display:'flex',flexDirection:'column',alignItems:'flex-start',flex:1,paddingLeft:12}}>
              <span style={{fontSize:15.5,fontWeight:700,color:'white',lineHeight:'22px'}}>Apple Pay</span>
              <span style={{fontSize:12.5,color:'#cdd4df',lineHeight:'18px'}}>Pay via Apple Pay</span>
            </div>
            <div style={{display:'flex',alignItems:'center',gap:4}}>
              <img src="/car-loan-assets/sar-white.svg" style={{width:16,height:16}} alt="﷼"/>
              <span style={{fontSize:23.5,fontWeight:600,color:'white',lineHeight:'30px'}}>150</span>
            </div>
          </button>
        </div>

        {/* Credit/Debit card row */}
        <div style={{padding:'0 20px',marginBottom:20}}>
          <div style={{background:'white',border:'1px solid var(--gray-100)',borderRadius:8,padding:'14px 16px',display:'flex',alignItems:'center',justifyContent:'space-between',cursor:'pointer'}}>
            <span style={{fontSize:15.5,fontWeight:700,color:'#121a26'}}>Credit / Debit card</span>
            <div style={{display:'flex',gap:6,alignItems:'center'}}>
              <img src="/car-loan-assets/payment-amex.svg" style={{width:34,height:'auto'}} alt="AMEX"/>
              <img src="/car-loan-assets/payment-mastercard.svg" style={{width:34,height:'auto'}} alt="Mastercard"/>
              <img src="/car-loan-assets/payment-visa.svg" style={{width:34,height:'auto'}} alt="Visa"/>
              <img src="/car-loan-assets/payment-mada.svg" style={{width:34,height:'auto'}} alt="Mada"/>
            </div>
          </div>
        </div>

        {/* Home indicator */}
        <div style={{height:34,display:'flex',alignItems:'flex-end',justifyContent:'center',paddingBottom:8}}>
          <div style={{width:134,height:5,background:'black',borderRadius:999}}/>
        </div>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
</body>
</html>
