<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>Checkout</title>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { background: #fff; font-family: -apple-system, 'SF Pro Text', sans-serif; overflow-x: hidden; }
  :root {
    --brand-600: #0063f5;
    --gray-50: #f8fafc;
    --gray-100: #eef1f6;
    --gray-200: #e3e8ef;
    --gray-300: #cdd4df;
    --gray-400: #9aa4b2;
    --gray-500: #697586;
    --gray-600: #4b5565;
    --gray-800: #202a39;
    --gray-900: #121a26;
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">

function DarkStatusBar() {
  return (
    <div style={{height:38,position:'relative',overflow:'hidden',width:'100%'}}>
      <div style={{position:'absolute',right:14.67,top:'50%',transform:'translateY(-50%)',display:'flex',alignItems:'center',gap:6}}>
        <svg width="17" height="11" viewBox="0 0 17 11" fill="white">
          <rect x="0" y="5" width="3" height="6" rx="0.5" opacity="0.4"/><rect x="4.5" y="3" width="3" height="8" rx="0.5" opacity="0.6"/><rect x="9" y="1.5" width="3" height="9.5" rx="0.5" opacity="0.8"/><rect x="13.5" y="0" width="3" height="11" rx="0.5"/>
        </svg>
        <svg width="16" height="11" viewBox="0 0 16 11" fill="white">
          <path d="M8 8c.9 0 1.6.7 1.6 1.6S8.9 11.2 8 11.2 6.4 10.5 6.4 9.6 7.1 8 8 8z"/>
          <path d="M4.6 5.4C5.6 4.3 6.7 3.7 8 3.7s2.4.6 3.4 1.7l1.3-1.3C11.2 2.6 9.7 2 8 2S4.8 2.6 3.3 4.1l1.3 1.3z" opacity="0.75"/>
          <path d="M1.6 2.5C3.1 1 5.4 0 8 0s4.9 1 6.4 2.5L16 1C14 .4 11.2 0 8 0S2 .4 0 1l1.6 1.5z" opacity="0.5"/>
        </svg>
        <div style={{display:'flex',alignItems:'center'}}>
          <div style={{width:22,height:11,border:'1.5px solid rgba(255,255,255,0.5)',borderRadius:3,padding:1.5}}>
            <div style={{background:'white',borderRadius:1.5,height:'100%',width:'72%'}}/>
          </div>
        </div>
      </div>
      <div style={{position:'absolute',left:33,top:'50%',transform:'translateY(-50%)'}}>
        <span style={{fontSize:15,fontWeight:700,color:'white',lineHeight:'11px'}}>9:41</span>
      </div>
    </div>
  );
}

function App() {
  return (
    <div style={{width:'100%',height:'100vh',background:'white',display:'flex',flexDirection:'column',position:'relative'}}>

      {/* Blue header */}
      <div style={{background:'#0063f5',flexShrink:0}}>
        <DarkStatusBar/>
        {/* Header row */}
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',paddingLeft:16,paddingRight:16,paddingTop:4,paddingBottom:16}}>
          <div style={{minWidth:48,display:'flex',alignItems:'center'}}>
            <img src="/car-loan-assets/chevron-left.svg" style={{width:24,height:24,filter:'brightness(0) invert(1)'}} alt="back"/>
          </div>
          <p style={{flex:1,textAlign:'center',fontSize:15.5,fontWeight:600,lineHeight:'22px',color:'white',letterSpacing:0.25}}>Review Eligibility Order</p>
          <div style={{minWidth:48}}/>
        </div>

        {/* Blue bottom section with product card */}
        <div style={{borderRadius:'0 0 48px 48px',background:'#0063f5',padding:'0 24px 32px'}}>
          {/* White product card */}
          <div style={{background:'white',borderRadius:16,border:'1px solid var(--gray-100)',boxShadow:'0 4px 20px rgba(0,0,0,0.12)',padding:'16px'}}>
            {/* Row 1: title + icon */}
            <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',gap:12,marginBottom:12}}>
              <p style={{fontSize:17.5,fontWeight:700,color:'#121a26',lineHeight:'24px',flex:1}}>Microfinance for Employee &amp; their Family Daily Needs</p>
              <img src="/car-loan-assets/icon-execution.svg" style={{width:32,height:32,flexShrink:0}} alt=""/>
            </div>
            {/* Row 2: logo + APR */}
            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:12}}>
              <img src="/car-loan-assets/bank-albilad-logo.png" style={{width:125,height:'auto',objectFit:'contain'}} alt="Bank AlBilad"/>
              <div style={{display:'flex',alignItems:'center',gap:4}}>
                <span style={{fontSize:14,color:'var(--gray-600)'}}>APR from 99.99%</span>
                <img src="/car-loan-assets/info-circle.svg" style={{width:14,height:14}} alt=""/>
              </div>
            </div>
            {/* Row 3: installment + saved */}
            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}>
              <div>
                <p style={{fontSize:11,color:'var(--gray-500)'}}>Installment from</p>
                <p style={{fontSize:15.5,fontWeight:700,color:'#121a26',fontFamily:'SF Arabic, -apple-system'}}>﷼99,999.99</p>
              </div>
              <div style={{background:'#dcfce7',borderRadius:6,padding:'3px 8px',display:'flex',alignItems:'center',gap:4}}>
                <span style={{fontSize:12.5,fontWeight:600,color:'#079455'}}>You saved ﷼99,999.99</span>
                <span style={{fontSize:12.5,fontWeight:600,color:'#079455'}}>-86%</span>
              </div>
            </div>
          </div>
        </div>
      </div>

      {/* White scrollable content */}
      <div style={{flex:1,overflowY:'auto',padding:'24px 24px 120px',display:'flex',flexDirection:'column',gap:16}}>

        {/* Why Do I Need to Pay card */}
        <div style={{border:'1px solid var(--gray-200)',borderRadius:12,overflow:'hidden'}}>
          {/* Top section */}
          <div style={{background:'#f5f9ff',padding:'14px 16px',display:'flex',alignItems:'flex-start',gap:12}}>
            <div style={{flex:1}}>
              <p style={{fontSize:15.5,fontWeight:700,color:'#121a26',lineHeight:'22px',marginBottom:4}}>Why Do I Need to Pay?</p>
              <p style={{fontSize:12.5,color:'var(--gray-600)',lineHeight:'18px'}}>Non-refundable fees for data processing.</p>
            </div>
            <img src="/car-loan-assets/icon-next.svg" style={{width:16,height:16,marginTop:4,flexShrink:0}} alt=""/>
          </div>
          {/* Bottom section: 3 icons */}
          <div style={{background:'white',padding:'14px 16px',display:'flex',alignItems:'center'}}>
            <div style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',gap:6}}>
              <img src="/car-loan-assets/icon-simah.svg" style={{width:20,height:20}} alt=""/>
              <span style={{fontSize:10,color:'var(--gray-500)',textAlign:'center',lineHeight:'14px'}}>SIMAH Reports</span>
            </div>
            <div style={{width:1,height:36,background:'var(--gray-200)'}}/>
            <div style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',gap:6}}>
              <img src="/car-loan-assets/icon-verification.svg" style={{width:20,height:20}} alt=""/>
              <span style={{fontSize:10,color:'var(--gray-500)',textAlign:'center',lineHeight:'14px'}}>Verification Checks</span>
            </div>
            <div style={{width:1,height:36,background:'var(--gray-200)'}}/>
            <div style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',gap:6}}>
              <img src="/car-loan-assets/icon-offer-matching.svg" style={{width:20,height:20}} alt=""/>
              <span style={{fontSize:10,color:'var(--gray-500)',textAlign:'center',lineHeight:'14px'}}>Offer Matching</span>
            </div>
          </div>
        </div>

        {/* Discount banner + redeem row */}
        <div style={{position:'relative'}}>
          <div style={{position:'absolute',top:0,right:0,background:'#d91c1c',borderRadius:999,padding:'3px 10px',zIndex:1}}>
            <span style={{fontSize:12.5,color:'white',fontWeight:500,lineHeight:'18px'}}>Enjoy up to ﷼100 discount</span>
          </div>
          <div style={{background:'#fef2f2',border:'1px solid #fee2e2',borderRadius:8,padding:'14px 16px',marginTop:12,display:'flex',alignItems:'center',gap:12}}>
            <img src="/car-loan-assets/tamawal-points.svg" style={{width:25,flexShrink:0}} alt=""/>
            <span style={{flex:1,fontSize:13.5,fontWeight:500,color:'#121a26',lineHeight:'20px'}}>Redeem your discount points</span>
            <img src="/car-loan-assets/chevron-right-sm.svg" style={{width:16,height:16,flexShrink:0}} alt=""/>
          </div>
        </div>

        {/* Payment Details card */}
        <div style={{border:'1px solid var(--gray-100)',borderRadius:8,overflow:'hidden'}}>
          <div style={{padding:'14px 16px',borderBottom:'1px solid var(--gray-100)'}}>
            <p style={{fontSize:17.5,fontWeight:700,color:'#121a26'}}>Payment Details</p>
          </div>
          {/* Eligibility Fees */}
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'10px 16px',background:'var(--gray-50)'}}>
            <span style={{fontSize:13.5,color:'var(--gray-600)'}}>Eligibility Fees</span>
            <span style={{fontSize:15.5,color:'var(--gray-900)',fontFamily:'SF Arabic, -apple-system'}}>﷼950</span>
          </div>
          {/* VAT row */}
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'10px 16px',background:'white'}}>
            <div>
              <p style={{fontSize:13.5,color:'var(--gray-600)'}}>VAT (15%)</p>
              <p style={{fontSize:11,color:'var(--brand-600)',cursor:'pointer'}}>VAT Number: 310131935400</p>
            </div>
            <span style={{fontSize:15.5,color:'var(--gray-900)',fontFamily:'SF Arabic, -apple-system'}}>﷼50</span>
          </div>
          {/* Divider */}
          <div style={{height:1,background:'var(--gray-200)',margin:'0 16px'}}/>
          {/* Total */}
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'10px 16px',background:'var(--gray-50)'}}>
            <span style={{fontSize:13.5,fontWeight:600,color:'var(--gray-800)'}}>Total (VAT Inclusive)</span>
            <span style={{fontSize:17.5,fontWeight:700,color:'var(--gray-900)',fontFamily:'SF Arabic, -apple-system'}}>﷼900</span>
          </div>
        </div>

        {/* Disclaimer */}
        <p style={{fontSize:13.5,color:'#364152',lineHeight:'20px'}}>
          By paying, you acknowledge the payment is non-refundable. <span style={{color:'#0063f5',fontWeight:600,cursor:'pointer'}}>Read More</span>
        </p>
      </div>

      {/* Sticky bottom */}
      <div style={{position:'fixed',bottom:0,left:0,right:0,background:'white'}}>
        <div style={{padding:'12px 24px 8px'}}>
          <button style={{width:'100%',minHeight:46,background:'#ffdd33',border:'none',borderRadius:8,fontSize:15.5,fontWeight:600,color:'#121a26',cursor:'pointer'}}>
            Pay now
          </button>
        </div>
        <div style={{height:34,display:'flex',alignItems:'flex-end',justifyContent:'center',paddingBottom:8}}>
          <div style={{width:134,height:5,background:'black',borderRadius:999}}/>
        </div>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
</body>
</html>
