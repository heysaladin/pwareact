<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Car Details</title>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
  <style>
    html,body,#root{margin:0;padding:0;height:100%;overflow:hidden;background:#fff;}
    *{box-sizing:border-box;}
    button{cursor:pointer;font-family:inherit;}
    .scroll{scrollbar-width:none;overflow-y:auto;}
    .scroll::-webkit-scrollbar{display:none;}
  </style>
</head>
<body>
<div id="root" style="height:100%"></div>
<script type="text/babel">
  const { useState } = React;
  const C = { brand600:'#0063F5', brand800:'#0041A3', yellow:'#FFDD33', gray900:'#101828', gray600:'#4B5565', gray200:'#EAECF0', gray50:'#F8FAFC', white:'#FFFFFF' };
  const nav = (p) => (window.top||window).location.href = p;

  const specs = [
    { label:'Engine',        value:'1.5L Turbo 4-Cylinder' },
    { label:'Transmission',  value:'7-Speed Automatic',    alt:true },
    { label:'Fuel Economy',  value:'14.5 km/L' },
    { label:'Seating',       value:'5 Passengers',         alt:true },
    { label:'Warranty',      value:'5 Years / 150,000 km' },
  ];

  const thumbs = ['/car-image.png', '/car-mg-zs.png', '/car-image.png', '/car-mg-zs.png'];

  function StatusBar() {
    return (
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'14px 20px 6px'}}>
        <span style={{fontSize:15,fontWeight:700,color:C.gray900}}>9:41</span>
        <div style={{display:'flex',gap:6,alignItems:'center'}}>
          <svg width="17" height="11" viewBox="0 0 17 11" fill={C.gray900}><rect x="0" y="5" width="3" height="6" rx="0.5" opacity="0.4"/><rect x="4.5" y="3" width="3" height="8" rx="0.5" opacity="0.6"/><rect x="9" y="1.5" width="3" height="9.5" rx="0.5" opacity="0.8"/><rect x="13.5" y="0" width="3" height="11" rx="0.5"/></svg>
          <svg width="16" height="11" viewBox="0 0 16 11" fill={C.gray900} opacity="0.7"><path d="M8 8c.9 0 1.6.7 1.6 1.6S8.9 11.2 8 11.2 6.4 10.5 6.4 9.6 7.1 8 8 8z"/><path d="M4.6 5.4C5.6 4.3 6.7 3.7 8 3.7s2.4.6 3.4 1.7l1.3-1.3C11.2 2.6 9.7 2 8 2S4.8 2.6 3.3 4.1l1.3 1.3z" opacity="0.75"/><path d="M1.6 2.5C3.1 1 5.4 0 8 0s4.9 1 6.4 2.5L16 1C14 .4 11.2 0 8 0S2 .4 0 1l1.6 1.5z" opacity="0.5"/></svg>
          <div style={{display:'flex',alignItems:'center',gap:2}}><div style={{width:22,height:11,border:'1.5px solid rgba(0,0,0,0.35)',borderRadius:3,padding:1.5}}><div style={{background:C.gray900,borderRadius:1.5,height:'100%',width:'72%'}}/></div></div>
        </div>
      </div>
    );
  }

  function App() {
    const [activeThumb, setActiveThumb] = useState(1);

    return (
      <div style={{height:'100%',display:'flex',flexDirection:'column',background:C.white,fontFamily:'"SF Arabic",system-ui,-apple-system,Arial,sans-serif',position:'relative'}}>

        {/* Header */}
        <div style={{background:C.white,flexShrink:0}}>
          <StatusBar/>
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'4px 16px 10px'}}>
            <button onClick={()=>nav('/car-loan/inventory')} style={{background:'none',border:'none',padding:'8px 4px',minWidth:48,display:'flex',alignItems:'center'}}>
              <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M12.5 16.5L6 10l6.5-6.5" stroke={C.gray900} strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round"/></svg>
            </button>
            <span style={{fontSize:15.5,fontWeight:600,color:C.gray900,letterSpacing:0.25}}>Car Details</span>
            <div style={{minWidth:48}}/>
          </div>
        </div>

        {/* Scrollable content */}
        <div className="scroll" style={{flex:1,paddingBottom:110}}>

          {/* Main car image */}
          <div style={{padding:'24px 16px 8px',background:C.white}}>
            <img src="/car-image.png" alt="MG ZS" style={{width:'100%',height:220,objectFit:'contain',objectPosition:'center',display:'block'}}/>
          </div>

          {/* Thumbnails */}
          <div style={{display:'flex',gap:8,padding:'0 8px 20px',background:C.white}}>
            {thumbs.map((src, i) => (
              <button key={i} onClick={()=>setActiveThumb(i)} style={{flex:1,height:65,borderRadius:0,overflow:'hidden',border:'none',padding:0,background:'transparent',opacity:activeThumb===i?1:0.4,flexShrink:0}}>
                <img src={src} alt="" style={{width:'100%',height:'100%',objectFit:'contain',objectPosition:'center'}}/>
              </button>
            ))}
          </div>

          {/* Car name */}
          <div style={{borderBottom:`1px solid ${C.gray200}`,paddingBottom:16,textAlign:'center',padding:'20px 16px 16px'}}>
            <p style={{margin:'0 0 2px',fontSize:13.5,fontWeight:500,color:C.gray600,letterSpacing:0.4}}>MG</p>
            <p style={{margin:0,fontSize:23.5,fontWeight:600,color:C.gray900,lineHeight:1.28}}>ZS Luxury 1.5T</p>
          </div>

          {/* Description */}
          <div style={{padding:'24px 24px 0'}}>
            <p style={{margin:0,fontSize:13.5,fontWeight:500,color:C.gray600,lineHeight:1.65,letterSpacing:0.4}}>
              The MG ZS Luxury 1.5T is a feature-rich compact SUV designed for everyday comfort and urban convenience. With its turbocharged engine, automatic transmission, and premium interior, it delivers a smooth ride while offering excellent value for money in its class.
            </p>
          </div>

          {/* Specifications */}
          <div style={{padding:'24px 24px 0',display:'flex',flexDirection:'column',gap:16,alignItems:'center'}}>
            <p style={{margin:0,fontSize:13.5,fontWeight:500,color:C.gray600,letterSpacing:0.4}}>Specifications</p>
            <div style={{border:`1px solid ${C.white}`,borderRadius:8,overflow:'hidden',width:'100%'}}>
              {specs.map((s,i) => (
                <div key={s.label} style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'9px 12px',background:s.alt?C.gray50:C.white}}>
                  <span style={{fontSize:13.5,fontWeight:500,color:C.gray600,letterSpacing:0.4,whiteSpace:'nowrap'}}>{s.label}</span>
                  <span style={{fontSize:15.5,fontWeight:600,color:C.brand800,letterSpacing:0.25,textAlign:'right'}}>{s.value}</span>
                </div>
              ))}
            </div>
          </div>

          {/* Divider dot */}
          <div style={{display:'flex',justifyContent:'center',padding:'24px 0 0'}}>
            <div style={{width:40,height:1,background:C.gray200}}/>
          </div>

          {/* Dealer section */}
          <div style={{padding:'24px 24px 8px',display:'flex',flexDirection:'column',gap:16,alignItems:'center'}}>
            <p style={{margin:0,fontSize:13.5,fontWeight:500,color:C.gray600,letterSpacing:0.4,whiteSpace:'nowrap'}}>Dealer available</p>
            <div style={{display:'flex',gap:16,alignItems:'center'}}>
              <button onClick={()=>{sessionStorage.setItem('dealerCtx',JSON.stringify({id:'wallan',name:'Al Wallan Dealer',logo:'/dealer-wallan.png'}));nav('/car-loan/inventory');}} style={{background:'none',border:`1px solid ${C.gray100}`,borderRadius:12,padding:'8px 12px',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center'}}>
                <img src="/dealer-wallan.png" alt="Al Wallan Trading Company" style={{width:94,height:63,objectFit:'contain'}}/>
              </button>
              <button onClick={()=>{sessionStorage.setItem('dealerCtx',JSON.stringify({id:'almajdouie',name:'Almajdouie Dealer',logo:'/dealer-almajdouie.png'}));nav('/car-loan/inventory');}} style={{background:'none',border:`1px solid ${C.gray100}`,borderRadius:12,padding:'8px 12px',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center'}}>
                <img src="/dealer-almajdouie.png" alt="Almajdouie" style={{width:135,height:49,objectFit:'contain'}}/>
              </button>
            </div>
          </div>

        </div>

        {/* Bottom CTA */}
        <div style={{position:'absolute',bottom:0,left:0,right:0,background:C.white,display:'flex',flexDirection:'column',alignItems:'stretch'}}>
          <div style={{padding:'12px 24px 8px',display:'flex',gap:8}}>
            <button onClick={()=>nav('/car-loan/offers')} style={{flex:1,background:C.brand600,border:'2px solid rgba(255,255,255,0.12)',borderRadius:8,padding:'12px 16px',fontSize:13.5,fontWeight:600,color:C.white,letterSpacing:0.5,minHeight:46}}>
              See offers
            </button>
          </div>
          <div style={{background:C.white,height:34,display:'flex',alignItems:'flex-end',justifyContent:'center',paddingBottom:8}}>
            <div style={{width:135,height:5,background:'#000',borderRadius:999}}/>
          </div>
        </div>

      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
