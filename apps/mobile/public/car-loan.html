<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Car Loan</title>
  <link rel="stylesheet" href="/kit.css" />
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
  <style>
    html, body, #root { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #121A26; }
    * { box-sizing: border-box; }
    button { cursor: pointer; }
    .tab-scroll { scrollbar-width: none; }
    .tab-scroll::-webkit-scrollbar { display: none; }
    .content-scroll { scrollbar-width: none; }
    .content-scroll::-webkit-scrollbar { display: none; }
    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; }
    input[type=number] { -moz-appearance: textfield; }
  </style>
</head>
<body>
  <div id="root" style="height:100%"></div>
  <script type="text/babel">
    const { useState, useRef } = React;

    const C = {
      brand900: '#00317A',
      brand800: '#0041A3',
      brand600: '#0063F5',
      yellow:   '#FFDD33',
      white:    '#FFFFFF',
      gray900:  '#121A26',
      gray500:  '#697586',
      gray100:  '#EEF1F6',
    };

    /* ── SAR icon ── */
    function SarIcon({ size = 14, color = 'currentColor' }) {
      return (
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1124.14 1256.39" fill={color} aria-label="SAR" style={{ width:size, height:size, flexShrink:0, display:'inline-block' }}>
          <path d="M699.62,1113.02h0c-20.06,44.48-33.32,92.75-38.4,143.37l424.51-90.24c20.06-44.47,33.31-92.75,38.4-143.37l-424.51,90.24Z"/>
          <path d="M1085.73,895.8c20.06-44.47,33.32-92.75,38.4-143.37l-330.68,70.33v-135.2l292.27-62.11c20.06-44.47,33.32-92.75,38.4-143.37l-330.68,70.27V66.13c-50.67,28.45-95.67,66.32-132.25,110.99v403.35l-132.25,28.11V0c-50.67,28.44-95.67,66.32-132.25,110.99v525.69l-295.91,62.88c-20.06,44.47-33.33,92.75-38.42,143.37l334.33-71.05v170.26l-358.3,76.14c-20.06,44.47-33.32,92.75-38.4,143.37l375.04-79.7c30.53-6.35,56.77-24.4,73.83-49.24l68.78-101.97v-.02c7.14-10.55,11.3-23.27,11.3-36.97v-149.98l132.25-28.11v270.4l424.53-90.28Z"/>
        </svg>
      );
    }

    /* ── Status bar ── */
    function StatusBar({ dark }) {
      const textColor = dark ? C.white : C.gray900;
      const end = (
        <div style={{ display:'flex', gap:6, alignItems:'center' }}>
          <svg width="17" height="11" viewBox="0 0 17 11" fill={textColor}>
            <rect x="0"    y="5"   width="3" height="6"  rx="0.5" opacity="0.4"/>
            <rect x="4.5"  y="3"   width="3" height="8"  rx="0.5" opacity="0.6"/>
            <rect x="9"    y="1.5" width="3" height="9.5" rx="0.5" opacity="0.8"/>
            <rect x="13.5" y="0"   width="3" height="11" rx="0.5"/>
          </svg>
          <svg width="16" height="11" viewBox="0 0 16 11" fill={textColor} opacity="0.85">
            <path d="M8 8c.9 0 1.6.7 1.6 1.6S8.9 11.2 8 11.2 6.4 10.5 6.4 9.6 7.1 8 8 8z"/>
            <path d="M4.6 5.4C5.6 4.3 6.7 3.7 8 3.7s2.4.6 3.4 1.7l1.3-1.3C11.2 2.6 9.7 2 8 2S4.8 2.6 3.3 4.1l1.3 1.3z" opacity="0.75"/>
            <path d="M1.6 2.5C3.1 1 5.4 0 8 0s4.9 1 6.4 2.5L16 1C14 .4 11.2 0 8 0S2 .4 0 1l1.6 1.5z" opacity="0.5"/>
          </svg>
          <div style={{ display:'flex', alignItems:'center', gap:2 }}>
            <div style={{ width:22, height:11, border:`1.5px solid ${dark ? 'rgba(255,255,255,0.55)' : 'rgba(0,0,0,0.35)'}`, borderRadius:3, padding:1.5 }}>
              <div style={{ background:textColor, borderRadius:1.5, height:'100%', width:'72%' }}/>
            </div>
            <div style={{ width:2, height:5, background:dark ? 'rgba(255,255,255,0.55)' : 'rgba(0,0,0,0.35)', borderRadius:'0 1px 1px 0' }}/>
          </div>
        </div>
      );
      return (
        <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', padding:'14px 20px 6px', color:textColor }}>
          <span style={{ fontSize:15, fontWeight:700 }}>9:41</span>
          {end}
        </div>
      );
    }

    /* ── Header ── */
    function Header() {
      return (
        <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', padding:'6px 24px 12px' }}>
          <div style={{ display:'flex', alignItems:'center', gap:6 }}>
            <div style={{ position:'relative', width:40, height:40, border:`1px solid ${C.brand800}`, borderRadius:'50%', display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0 }}>
              <img src="/home/Notification Icon Container.svg" alt="" style={{ width:22, height:22 }}/>
              <div style={{ position:'absolute', top:-5, left:-5, background:C.yellow, border:`2px solid ${C.brand900}`, borderRadius:10, padding:'1px 4px', fontSize:9, fontWeight:700, color:C.gray900, display:'flex', alignItems:'center', justifyContent:'center' }}>99+</div>
            </div>
            <button style={{ border:`1px solid ${C.brand800}`, borderRadius:999, padding:'5px 10px', fontSize:12, color:C.white, fontWeight:600, background:'transparent', fontFamily:'inherit' }}>
              عربي
            </button>
          </div>
          <img src="/home/Logo.svg" alt="Tamawal" style={{ height:28, width:'auto' }}/>
          <div style={{ display:'flex', alignItems:'center', gap:8 }}>
            <span style={{ fontSize:12.5, color:C.white, fontWeight:600, letterSpacing:0.4 }}>99,999</span>
            <div style={{ position:'relative', flexShrink:0 }}>
              <img src="/home/Avatar.svg" alt="User" style={{ width:40, height:40, borderRadius:'50%' }}/>
              <div style={{ position:'absolute', bottom:-2, left:-2, width:16, height:16, borderRadius:'50%', background:C.white, display:'flex', alignItems:'center', justifyContent:'center', overflow:'hidden' }}>
                <svg width="10" height="10" viewBox="0 0 14 14" fill="none">
                  <rect x="1" y="3.5" width="5.5" height="1.5" fill={C.brand600}/>
                  <path d="M3.5 3.5H2.5v6l1.5 1.5V3.5Z" fill={C.brand600}/>
                  <path d="M2.5 9.5l1.5 1.5H7L8.5 9.5H2.5Z" fill={C.brand600}/>
                  <path d="M8.5 1.5l1.5 1.5v6l-1.5 1.5V1.5Z" fill={C.brand600}/>
                  <path d="M1 2L2.5 1h6L10 2H1Z" fill={C.brand600}/>
                  <path d="M2.5 1L1 2v6l1.5 1.5V1Z" fill={C.brand600}/>
                </svg>
              </div>
            </div>
          </div>
        </div>
      );
    }

    /* ── Card carousel ── */
    function CardCarousel({ activeIndex, setActiveIndex, animated, setAnimated }) {
      const touchStartX = useRef(null);
      const cards = [
        { label:'Real Estate Loan', icon:'/home/type=Real Estate loan.svg' },
        { label:'Personal Loan',    icon:'/home/type=Personal Loan.svg' },
        { label:'Car/EV Loan',      icon:'/home/type=Car Loan.svg' },
        { label:'Cards Loan',       icon:'/home/type=Cards Loan.svg' },
      ];
      const marginLeftMap = [79.5, -114.5, -308.5, -502.5];

      const handleTouchStart = (e) => { touchStartX.current = e.touches[0].clientX; };
      const handleTouchEnd = (e) => {
        if (touchStartX.current === null) return;
        const dx = touchStartX.current - e.changedTouches[0].clientX;
        if (Math.abs(dx) > 40) {
          const n = cards.length;
          const next = dx > 0 ? (activeIndex + 1) % n : (activeIndex - 1 + n) % n;
          const wrap = (dx > 0 && activeIndex === n-1) || (dx < 0 && activeIndex === 0);
          if (wrap) setAnimated(false);
          setActiveIndex(next);
          if (wrap) requestAnimationFrame(() => requestAnimationFrame(() => setAnimated(true)));
        }
        touchStartX.current = null;
      };

      return (
        <div style={{ position:'relative', direction:'ltr', overflow:'hidden' }} onTouchStart={handleTouchStart} onTouchEnd={handleTouchEnd}>
          <div style={{ display:'flex', gap:16, alignItems:'flex-start', paddingTop:16, width:604, marginLeft:marginLeftMap[activeIndex], transition: animated ? 'margin-left 0.35s cubic-bezier(0.32,0.72,0,1)' : 'none' }}>
            {cards.map((card, i) => {
              const s = i !== activeIndex;
              const iconW = s ? 154 : 184;
              const iconH = s ? 129 : 154;
              const bgH   = s ? 130 : 158;
              const bgW   = s ? 178 : 216;
              const px    = s ? 12  : 16;
              const pt    = s ? 12  : 16;
              return (
                <div key={i} onClick={() => setActiveIndex(i)} style={{ display:'flex', flexDirection:'column', alignItems:'center', flexShrink:0, width:bgW, paddingTop: s ? 24 : 0, filter: s ? 'drop-shadow(0px 6.679px 5.009px rgba(177,189,209,0.1))' : 'none', cursor: s ? 'pointer' : 'default', transition:'width 0.35s cubic-bezier(0.32,0.72,0,1), padding-top 0.35s cubic-bezier(0.32,0.72,0,1)' }}>
                  <div style={{ background:'white', borderRadius: s ? 12 : 16, boxShadow: s ? '0px 6.679px 10.018px 0px rgba(177,189,209,0.1)' : '0px 8px 12px 0px rgba(177,189,209,0.1)', overflow:'hidden', width:'100%', display:'flex', flexDirection:'column', alignItems:'center', paddingBottom: s ? 6 : 8, position:'relative', flexShrink:0 }}>
                    <div style={{ position:'absolute', background:'#0063F5', width:bgW, height:bgH, left:'50%', transform: s ? 'translateX(-50%) translateY(-50%)' : 'translateX(-50%)', top: s ? 'calc(50% - 25.5px)' : 0 }}/>
                    <div style={{ paddingTop:pt, paddingLeft:px, paddingRight:px, display:'flex', flexDirection:'column', gap:8, alignItems:'flex-start', position:'relative', zIndex:1, flexShrink:0 }}>
                      <div style={{ width:iconW, height:iconH, overflow:'hidden', flexShrink:0 }}>
                        <img src={card.icon} alt={card.label} style={{ width:'100%', height:'100%', objectFit:'contain', objectPosition:'center bottom' }}/>
                      </div>
                    </div>
                  </div>
                  <p style={{ margin:'8px 0 0', fontSize:17.5, fontWeight:400, color:C.gray900, textAlign:'center', fontFamily:'inherit', lineHeight:'30px', width:'100%', flexShrink:0 }}>{card.label}</p>
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    /* ── Bottom nav — only Search button ── */
    function BottomNav({ onSearch }) {
      return (
        <div style={{ position:'absolute', bottom:0, left:0, right:0, zIndex:10, display:'flex', flexDirection:'column', alignItems:'center', paddingBottom:28 }}>
          <button onClick={onSearch} style={{ background:'none', border:'none', display:'flex', flexDirection:'column', alignItems:'center', gap:6, cursor:'pointer', padding:0 }}>
            <div style={{ width:68, height:68, borderRadius:'50%', background:C.brand600, display:'flex', alignItems:'center', justifyContent:'center', boxShadow:`0 4px 20px rgba(0,99,245,0.45)`, position:'relative' }}>
              <img src="/home/_Magnifier.svg" alt="" style={{ width:32, height:32, position:'absolute' }}/>
              <div style={{ position:'absolute', top:6, left:6, width:20, height:20, borderRadius:'50%', background:'radial-gradient(circle at 30% 30%, rgba(255,255,255,0.45), transparent 70%)' }}/>
            </div>
            <span style={{ fontSize:12.5, fontWeight:500, color:C.gray500 }}>Search</span>
          </button>
        </div>
      );
    }

    /* ── Screen 1: Discovery home ── */
    function ScreenHome({ onStart }) {
      const [carouselIndex, setCarouselIndex] = useState(2);
      const [carouselAnimated, setCarouselAnimated] = useState(true);
      return (
        <div style={{ height:'100%', display:'flex', flexDirection:'column', background:C.white, overflow:'hidden', position:'relative', fontFamily:'"SF Arabic", system-ui, -apple-system, Arial, sans-serif' }}>
          <div style={{ background:C.gray900, flexShrink:0, position:'relative', paddingBottom:174 }}>
            <StatusBar dark={true}/>
            <Header/>
            <div style={{ position:'absolute', bottom:-62, left:0, right:0, zIndex:3 }}>
              <CardCarousel activeIndex={carouselIndex} setActiveIndex={setCarouselIndex} animated={carouselAnimated} setAnimated={setCarouselAnimated}/>
            </div>
          </div>
          <div style={{ flex:1, background:C.white, display:'flex', flexDirection:'column', overflow:'hidden', paddingTop:72 }}>
            <div className="content-scroll" style={{ flex:1, overflowY:'auto', padding:'24px 24px 130px' }}>
              <h2 style={{ margin:'0 0 10px', fontSize:22, fontWeight:700, color:C.gray900, lineHeight:1.3 }}>Discover potential products</h2>
              <p style={{ margin:'0 0 32px', fontSize:14, color:C.gray500, lineHeight:1.6 }}>Start discovering potential products that fit your needs and situation from Tamawal</p>
              <button
                onClick={onStart}
                style={{ width:'100%', background:C.yellow, border:'none', borderRadius:999, padding:'16px 24px', fontSize:16, fontWeight:700, color:C.gray900, fontFamily:'inherit', display:'flex', alignItems:'center', justifyContent:'center', gap:8 }}
              >
                Start Discovery
              </button>
            </div>
          </div>
          <BottomNav onSearch={onStart}/>
        </div>
      );
    }

    /* ── Screen 2: Find your best loan ── */
    function ScreenFindLoan({ onNext, onBack }) {
      const [salary, setSalary] = useState('12,000');
      const [hasLoans, setHasLoans] = useState(false);
      const rawSalary = parseFloat((salary || '0').replace(/,/g, '')) || 0;
      const eligible = Math.round(rawSalary * (hasLoans ? 10.2 : 15.296));
      const eligibleFormatted = eligible.toLocaleString('en-US');

      return (
        <div style={{ height:'100%', display:'flex', flexDirection:'column', background:'#8E9AAA', overflow:'hidden', position:'relative', fontFamily:'"SF Arabic", system-ui, -apple-system, Arial, sans-serif' }}>
          <StatusBar dark={false}/>

          {/* White card */}
          <div style={{ flex:1, display:'flex', flexDirection:'column', overflow:'hidden' }}>
            <div style={{ background:C.white, borderRadius:'24px 24px 0 0', flex:1, display:'flex', flexDirection:'column', overflow:'hidden' }}>
              {/* Pull handle */}
              <div style={{ display:'flex', justifyContent:'center', paddingTop:12, paddingBottom:4, flexShrink:0 }}>
                <div style={{ width:36, height:4, background:'#D0D5DD', borderRadius:999 }}/>
              </div>

              <div className="content-scroll" style={{ flex:1, overflowY:'auto', padding:'16px 24px 32px' }}>
                <h2 style={{ margin:'0 0 24px', fontSize:20, fontWeight:700, color:C.gray900, textAlign:'center' }}>Find your best loan</h2>

                {/* Salary input */}
                <div style={{ marginBottom:16 }}>
                  <label style={{ display:'block', fontSize:12.5, color:C.gray500, marginBottom:6 }}>Salary <span style={{ color:'#E53935' }}>*</span></label>
                  <div style={{ background:'#F8FAFC', border:'1.5px solid #E2E8F0', borderRadius:12, padding:'12px 14px', display:'flex', alignItems:'center', gap:8 }}>
                    <SarIcon size={16} color={C.gray500}/>
                    <input
                      type="text"
                      value={salary}
                      onChange={e => {
                        const raw = e.target.value.replace(/[^0-9]/g, '');
                        const num = parseInt(raw || '0', 10);
                        setSalary(num ? num.toLocaleString('en-US') : '');
                      }}
                      style={{ flex:1, border:'none', background:'transparent', fontSize:16, fontWeight:600, color:C.gray900, fontFamily:'inherit', outline:'none' }}
                      placeholder="0"
                    />
                    <span style={{ fontSize:13, color:C.gray500, flexShrink:0 }}>Monthly</span>
                  </div>
                </div>

                {/* Active loans toggle */}
                <div style={{ marginBottom:24 }}>
                  <label style={{ display:'block', fontSize:12.5, color:C.gray500, marginBottom:10 }}>Do you have active loans? <span style={{ color:'#E53935' }}>*</span></label>
                  <div style={{ display:'flex', gap:10 }}>
                    {[{label:'Yes', val:true},{label:'No', val:false}].map(opt => (
                      <button
                        key={opt.label}
                        onClick={() => setHasLoans(opt.val)}
                        style={{ flex:1, padding:'11px', fontSize:14, fontWeight: hasLoans === opt.val ? 600 : 400, border:`1.5px solid ${hasLoans === opt.val ? C.brand600 : '#E2E8F0'}`, borderRadius:10, background: hasLoans === opt.val ? '#EBF3FF' : C.white, color: hasLoans === opt.val ? C.brand600 : C.gray500, fontFamily:'inherit' }}
                      >
                        {opt.label}
                      </button>
                    ))}
                  </div>
                </div>

                {/* Eligibility result */}
                {rawSalary > 0 && (
                  <div style={{ backgroundImage:'url(/bg-yellow.png)', backgroundSize:'cover', backgroundPosition:'left center', borderRadius:16, padding:'16px 18px 16px 140px', marginBottom:24, minHeight:88, display:'flex', flexDirection:'column', justifyContent:'center' }}>
                    <p style={{ margin:'0 0 4px', fontSize:12, color:'#5C4200', fontWeight:500 }}>You may be eligible to take a loan up to</p>
                    <div style={{ display:'flex', alignItems:'center', gap:5, marginBottom:4 }}>
                      <SarIcon size={20} color={C.gray900}/>
                      <span style={{ fontSize:26, fontWeight:700, color:C.gray900 }}>{eligibleFormatted}</span>
                    </div>
                    <p style={{ margin:0, fontSize:12, color:'#5C4200' }}>for <strong>60 Months</strong></p>
                  </div>
                )}

                {/* CTA */}
                <button
                  onClick={onNext}
                  style={{ width:'100%', background:C.brand600, border:'none', borderRadius:14, padding:'16px', fontSize:16, fontWeight:600, color:C.white, fontFamily:'inherit' }}
                >
                  Tamawal
                </button>
              </div>
            </div>
          </div>

          {/* Close button */}
          <div style={{ position:'absolute', bottom:32, left:'50%', transform:'translateX(-50%)', zIndex:20 }}>
            <button
              onClick={onBack}
              style={{ width:56, height:56, borderRadius:'50%', background:C.yellow, border:'none', display:'flex', alignItems:'center', justifyContent:'center', boxShadow:'0 4px 16px rgba(0,0,0,0.18)' }}
            >
              <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
                <path d="M6 6l10 10M16 6L6 16" stroke={C.gray900} strokeWidth="2" strokeLinecap="round"/>
              </svg>
            </button>
            <p style={{ margin:'6px 0 0', fontSize:12, fontWeight:600, color:C.brand600, textAlign:'center' }}>Search</p>
          </div>
        </div>
      );
    }

    /* ── Screen 3: Do you have a car selected ── */
    function ScreenCarSelected({ onBack }) {
      const [selected, setSelected] = useState(null);

      const options = [
        {
          id:'yes',
          title:'Yes, I have a car',
          subtitle:'Enter vehicle details',
          illustration: <img src="/icon-selected-car.png" alt="" style={{ width:72, height:72, objectFit:'contain' }}/>,
        },
        {
          id:'no',
          title:'Not yet',
          subtitle:'Show me my budget and financing options',
          illustration: <img src="/icon-selected-carx.png" alt="" style={{ width:72, height:72, objectFit:'contain' }}/>,
        },
      ];

      return (
        <div style={{ height:'100%', display:'flex', flexDirection:'column', background:C.white, overflow:'hidden', fontFamily:'"SF Arabic", system-ui, -apple-system, Arial, sans-serif' }}>
          <StatusBar dark={false}/>

          {/* Back */}
          <div style={{ padding:'8px 20px 0' }}>
            <button onClick={onBack} style={{ background:'none', border:'none', padding:'8px 4px', display:'flex', alignItems:'center', gap:6, color:C.gray500 }}>
              <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                <path d="M12.5 16.5L6 10l6.5-6.5" stroke={C.gray900} strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round"/>
              </svg>
            </button>
          </div>

          <div className="content-scroll" style={{ flex:1, overflowY:'auto', padding:'24px 24px 120px' }}>
            <h1 style={{ margin:'0 0 36px', fontSize:26, fontWeight:700, color:C.gray900, textAlign:'center', lineHeight:1.3 }}>Do you have a car selected?</h1>

            <div style={{ display:'flex', flexDirection:'column', gap:12 }}>
              {options.map(opt => (
                <button
                  key={opt.id}
                  onClick={() => setSelected(opt.id)}
                  style={{ display:'flex', alignItems:'center', gap:16, padding:'18px 20px', borderRadius:16, border:`1.5px solid ${selected === opt.id ? C.brand600 : '#E2E8F0'}`, background: selected === opt.id ? '#EBF3FF' : C.white, textAlign:'left', fontFamily:'inherit', cursor:'pointer', transition:'border-color 0.15s, background 0.15s' }}
                >
                  {/* Radio */}
                  <div style={{ width:22, height:22, borderRadius:'50%', border:`2px solid ${selected === opt.id ? C.brand600 : '#D0D5DD'}`, background: selected === opt.id ? C.brand600 : C.white, flexShrink:0, display:'flex', alignItems:'center', justifyContent:'center' }}>
                    {selected === opt.id && <div style={{ width:8, height:8, borderRadius:'50%', background:C.white }}/>}
                  </div>
                  {/* Text */}
                  <div style={{ flex:1 }}>
                    <p style={{ margin:'0 0 3px', fontSize:15, fontWeight:600, color:C.gray900 }}>{opt.title}</p>
                    <p style={{ margin:0, fontSize:12.5, color:C.gray500, lineHeight:1.4 }}>{opt.subtitle}</p>
                  </div>
                  {/* Illustration */}
                  <div style={{ flexShrink:0 }}>{opt.illustration}</div>
                </button>
              ))}
            </div>
          </div>

          {/* Continue button fixed bottom */}
          <div style={{ position:'absolute', bottom:0, left:0, right:0, padding:'16px 24px 36px', background:C.white, borderTop:'1px solid #EEF1F6' }}>
            <button
              onClick={() => {
                if (!selected) return;
                const dest = selected === 'yes' ? '/car-loan/vehicle-details' : '/car-loan/inventory';
                (window.top || window).location.href = dest;
              }}
              disabled={!selected}
              style={{ width:'100%', background: selected ? C.brand600 : '#D0D5DD', border:'none', borderRadius:14, padding:'16px', fontSize:16, fontWeight:600, color:C.white, fontFamily:'inherit', transition:'background 0.15s' }}
            >
              Continue
            </button>
          </div>
        </div>
      );
    }

    /* ── Root ── */
    function CarLoanApp() {
      const [screen, setScreen] = useState('home'); // 'home' | 'find' | 'selected'
      if (screen === 'find') return <ScreenFindLoan onNext={() => setScreen('selected')} onBack={() => setScreen('home')}/>;
      if (screen === 'selected') return <ScreenCarSelected onBack={() => setScreen('find')}/>;
      return <ScreenHome onStart={() => setScreen('find')}/>;
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<CarLoanApp/>);
  </script>
</body>
